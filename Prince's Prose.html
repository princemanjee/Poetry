er"]}, {"n": 105, "part": 5, "title": "You would give any man time", "slug": "you-would-give-any-man-time", "stanzas": [["You honor the seed as much as the harvest,", "the raw iron as much as the knife.", "You would give any man time.", "Give it to yourself."]], "text": "You honor the seed as much as the harvest,\nthe raw iron as much as the knife.\nYou would give any man time.\nGive it to yourself.", "sig": true, "cats": ["Grace & Self-Forgiveness", "Growth & Becoming"]}, {"n": 106, "part": 5, "title": "You forgive the sky its rain", "slug": "you-forgive-the-sky-its-rain", "stanzas": [["You forgive the sky without a second thought.", "Why not the rain in your own head?"], ["It falls for the same reason.", "It fills the well.", "Wait and see what stands when it stops."]], "text": "You forgive the sky without a second thought.\nWhy not the rain in your own head?\nIt falls for the same reason.\nIt fills the well.\nWait and see what stands when it stops.", "sig": true, "cats": ["Grace & Self-Forgiveness", "Healing & Endurance", "Nature as Teacher"]}, {"n": 107, "part": 5, "title": "Stand on the ground you have", "slug": "stand-on-the-ground-you-have", "stanzas": [["No mason curses a brick before he lays it.", "No smith beats the iron out of spite."], ["You want a better man in the mirror,", "but you keep spitting in his face.", "Wash the glass.", "Thank the man who got you this far,", "then tell him the shift is not over."]], "text": "No mason curses a brick before he lays it.\nNo smith beats the iron out of spite.\nYou want a better man in the mirror,\nbut you keep spitting in his face.\nWash the glass.\nThank the man who got you this far,\nthen tell him the shift is not over.", "sig": true, "cats": ["Grace & Self-Forgiveness", "Growth & Becoming"]}, {"n": 108, "part": 5, "title": "Forgive the man you were", "slug": "forgive-the-man-you-were", "stanzas": [["He did not have the manual you carry now.", "He was working with a bad flashlight", "under the hood of a car he did not own."], ["Forgive him the stripped bolts.", "You will need the same mercy ten years from now,", "and you should not have to ask yourself twice."]], "text": "He did not have the manual you carry now.\nHe was working with a bad flashlight\nunder the hood of a car he did not own.\nForgive him the stripped bolts.\nYou will need the same mercy ten years from now,\nand you should not have to ask yourself twice.", "sig": true, "cats": ["Grace & Self-Forgiveness", "Growth & Becoming"]}, {"n": 109, "part": 5, "title": "Grace for what survived", "slug": "grace-for-what-survived", "stanzas": [["Be gentle with the parts of you", "that pulled you from the wreck."], ["They were not graceful.", "They built walls out of scrap wood.", "They went quiet when they should have spoken.", "They did not have the right tools."], ["They just kept you breathing", "long enough to find some."]], "text": "Be gentle with the parts of you\nthat pulled you from the wreck.\nThey were not graceful.\nThey built walls out of scrap wood.\nThey went quiet when they should have spoken.\nThey did not have the right tools.\nThey just kept you breathing\nlong enough to find some.", "sig": true, "cats": ["Grace & Self-Forgiveness", "Healing & Endurance"]}, {"n": 110, "part": 5, "title": "A kinder foreman", "slug": "a-kinder-foreman", "stanzas": [["Show the body some mercy.", "It lifted the lumber you asked it to lift.", "It stood on the concrete as long as you asked it to stand."], ["It is walking this ground for the first time.", "Give it a kinder foreman."]], "text": "Show the body some mercy.\nIt lifted the lumber you asked it to lift.\nIt stood on the concrete as long as you asked it to stand.\nIt is walking this ground for the first time.\nGive it a kinder foreman.", "sig": true, "cats": ["Grace & Self-Forgiveness", "Healing & Endurance"]}, {"n": 111, "part": 5, "title": "Not everything is a repair", "slug": "not-everything-is-a-repair", "stanzas": [["I have spent my life fixing engines,", "so it took me years to learn", "that a man is not a broken part.", "You cannot tighten him back into place."], ["Set the tools down.", "Let mercy do what the wrench cannot."]], "text": "I have spent my life fixing engines,\nso it took me years to learn\nthat a man is not a broken part.\nYou cannot tighten him back into place.\nSet the tools down.\nLet mercy do what the wrench cannot.", "sig": true, "cats": ["Grace & Self-Forgiveness", "Letting Go"]}, {"n": 112, "part": 5, "title": "The same man walks out", "slug": "the-same-man-walks-out", "stanzas": [["You do not leave the past by becoming someone new.", "No one waits down the road to trade you places."], ["The same man walks out who walked in.", "Forgive him.", "Then go."]], "text": "You do not leave the past by becoming someone new.\nNo one waits down the road to trade you places.\nThe same man walks out who walked in.\nForgive him.\nThen go.", "sig": true, "cats": ["Grace & Self-Forgiveness", "Letting Go"]}, {"n": 113, "part": 5, "title": "Mercy runs forward", "slug": "mercy-runs-forward", "stanzas": [["Forgive the man you were.", "He did what he knew with what he had in his pockets.", "The mercy you show him", "is the mercy the next man inherits."], ["You are the next man."]], "text": "Forgive the man you were.\nHe did what he knew with what he had in his pockets.\nThe mercy you show him\nis the mercy the next man inherits.\nYou are the next man.", "sig": true, "cats": ["Grace & Self-Forgiveness", "Growth & Becoming"]}, {"n": 114, "part": 5, "title": "Grace for the man who got through", "slug": "grace-for-the-man-who-got-through", "stanzas": [["Offer yourself the grace you would offer a stranger", "who came through a hard stretch with the tools he had", "instead of the ones he wished for."], ["You did not do it cleanly. You did it.", "Let that be enough tonight."]], "text": "Offer yourself the grace you would offer a stranger\nwho came through a hard stretch with the tools he had\ninstead of the ones he wished for.\nYou did not do it cleanly. You did it.\nLet that be enough tonight.", "sig": true, "cats": ["Grace & Self-Forgiveness", "Healing & Endurance"]}, {"n": 115, "part": 5, "title": "Mercy for the parts that survived", "slug": "mercy-for-the-parts-that-survived", "stanzas": [["Show some mercy to the parts of you", "that survived the only way they knew how.", "The fist that learned to close before the blow.", "The silence that learned to pass for calm.", "The watch you kept at the front window for years."], ["They were not wrong.", "They were on duty.", "Thank them.", "Then tell them to stand down."]], "text": "Show some mercy to the parts of you\nthat survived the only way they knew how.\nThe fist that learned to close before the blow.\nThe silence that learned to pass for calm.\nThe watch you kept at the front window for years.\nThey were not wrong.\nThey were on duty.\nThank them.\nThen tell them to stand down.", "sig": true, "cats": ["Grace & Self-Forgiveness", "Healing & Endurance"]}, {"n": 116, "part": 5, "title": "Forgive yourself the storms", "slug": "forgive-yourself-the-storms", "stanzas": [["Forgive yourself the storms.", "You did not call them and you could not stop them,", "and still you stood in the open and held."], ["The wheat field does not curse the rain.", "It takes what falls and makes a crop of it.", "Take what fell.", "Bail it into hay."]], "text": "Forgive yourself the storms.\nYou did not call them and you could not stop them,\nand still you stood in the open and held.\nThe wheat field does not curse the rain.\nIt takes what falls and makes a crop of it.\nTake what fell.\nBail it into hay.", "sig": true, "cats": ["Grace & Self-Forgiveness", "Nature as Teacher"]}, {"n": 117, "part": 5, "title": "Grace for the body that carries me", "slug": "grace-for-the-body-that-carries-me", "stanzas": [["I owe this body some grace.", "It has carried firewood and grief for thirty years", "and asked for nothing back.", "When the knee gives out on the stairs,", "I will not curse it.", "It is doing this for the first time, too.", "It is learning the ice while it walks."]], "text": "I owe this body some grace.\nIt has carried firewood and grief for thirty years\nand asked for nothing back.\nWhen the knee gives out on the stairs,\nI will not curse it.\nIt is doing this for the first time, too.\nIt is learning the ice while it walks.", "sig": true, "cats": ["Grace & Self-Forgiveness", "Rest & Stillness"]}, {"n": 118, "part": 5, "title": "He was working with less light", "slug": "he-was-working-with-less-light", "stanzas": [["The man I was at twenty", "read the map by the light he had.", "It was a thin bulb.", "I would not fault a son for that.", "I set the grudge down on the floor.", "The road clears for the man I have not become yet,", "who will look back at me in ten years", "and need the same pardon."]], "text": "The man I was at twenty\nread the map by the light he had.\nIt was a thin bulb.\nI would not fault a son for that.\nI set the grudge down on the floor.\nThe road clears for the man I have not become yet,\nwho will look back at me in ten years\nand need the same pardon.", "sig": true, "cats": ["Grace & Self-Forgiveness", "Growth & Becoming"]}, {"n": 119, "part": 5, "title": "Grace for the parts that survived", "slug": "grace-for-the-parts-that-survived", "stanzas": [["Have grace for the parts of you", "that survived the only way they knew.", "They were not wise.", "They were not gentle.", "But they kept the house from burning."]], "text": "Have grace for the parts of you\nthat survived the only way they knew.\nThey were not wise.\nThey were not gentle.\nBut they kept the house from burning.", "sig": true, "cats": ["Grace & Self-Forgiveness", "Healing & Endurance"]}, {"n": 120, "part": 5, "title": "Thank the crew that brought you in", "slug": "thank-the-crew-that-brought-you-in", "stanzas": [["Be merciful to the parts of yourself", "that survived the only way they knew how.", "They were a rough crew.", "They did not steer pretty,", "and some of what they did you would not do again.", "But they brought the ship in."], ["If you are still here,", "still taking the morning air,", "still able to be gentle", "after everything that tried to make you hard,", "you did not fail yourself.", "You held on to the one thing the storm was after.", "You made port with it."]], "text": "Be merciful to the parts of yourself\nthat survived the only way they knew how.\nThey were a rough crew.\nThey did not steer pretty,\nand some of what they did you would not do again.\nBut they brought the ship in.\nIf you are still here,\nstill taking the morning air,\nstill able to be gentle\nafter everything that tried to make you hard,\nyou did not fail yourself.\nYou held on to the one thing the storm was after.\nYou made port with it.", "sig": true, "cats": ["Grace & Self-Forgiveness", "Healing & Endurance", "Honor & Character"]}, {"n": 121, "part": 5, "title": "They stood the watch", "slug": "they-stood-the-watch", "stanzas": [["May you find grace for the parts of you", "that made it through the only way they knew.", "They were not wrong.", "They stood the watch."]], "text": "May you find grace for the parts of you\nthat made it through the only way they knew.\nThey were not wrong.\nThey stood the watch.", "sig": true, "cats": ["Grace & Self-Forgiveness", "Healing & Endurance"]}, {"n": 122, "part": 5, "title": "I watched the dawn come down", "slug": "i-watched-the-dawn-come-down", "stanzas": [["I watched the dawn come down", "on ground still cold from the night.", "It asked nothing of the field.", "It simply gave it light."], ["I understood, at last,", "what it looks like to forgive myself."]], "text": "I watched the dawn come down\non ground still cold from the night.\nIt asked nothing of the field.\nIt simply gave it light.\nI understood, at last,\nwhat it looks like to forgive myself.", "sig": true, "cats": ["Grace & Self-Forgiveness", "Nature as Teacher"]}, {"n": 123, "part": 6, "title": "Stand in the new snow", "slug": "stand-in-the-new-snow", "stanzas": [["Watch how calm the ground becomes", "when it stops fighting what has fallen."], ["You could carry that quiet.", "It is not weather. It is a choice."]], "text": "Watch how calm the ground becomes\nwhen it stops fighting what has fallen.\nYou could carry that quiet.\nIt is not weather. It is a choice.", "sig": true, "cats": ["Rest & Stillness", "Nature as Teacher", "Fortitude & Gentleness"]}, {"n": 124, "part": 6, "title": "Peace is not a windless sky", "slug": "peace-is-not-a-windless-sky", "stanzas": [["It takes courage to let peace be what it is,", "not the dead calm you asked for,", "but a steady hand on the wheel,", "a roof that holds when the gale hits."]], "text": "It takes courage to let peace be what it is,\nnot the dead calm you asked for,\nbut a steady hand on the wheel,\na roof that holds when the gale hits.", "sig": true, "cats": ["Rest & Stillness", "Fortitude & Gentleness"]}, {"n": 125, "part": 6, "title": "Rest is a form of trust", "slug": "rest-is-a-form-of-trust", "stanzas": [["When the sun goes down,", "set the day down with it", "like a heavy coat.", "Do not lie awake", "trying to guarantee the morning."]], "text": "When the sun goes down,\nset the day down with it\nlike a heavy coat.\nDo not lie awake\ntrying to guarantee the morning.", "sig": true, "cats": ["Rest & Stillness", "Faith & Reverence"]}, {"n": 126, "part": 6, "title": "Not every storm is yours to face", "slug": "not-every-storm-is-yours-to-face", "stanzas": [["Some come only to make you stop,", "to put down the wrench and sit in the doorway.", "Listen for the quiet", "you carried all along", "and never had the time to hear."]], "text": "Some come only to make you stop,\nto put down the wrench and sit in the doorway.\nListen for the quiet\nyou carried all along\nand never had the time to hear.", "sig": true, "cats": ["Rest & Stillness", "Healing & Endurance"]}, {"n": 127, "part": 6, "title": "Winter is not a sentence", "slug": "winter-is-not-a-sentence", "stanzas": [["Why do you serve January like a sentence?", "It was never a punishment."], ["The field lies fallow and is not ashamed.", "The forge is banked, not cold.", "Set the shovel down.", "Rest is also the work."]], "text": "Why do you serve January like a sentence?\nIt was never a punishment.\nThe field lies fallow and is not ashamed.\nThe forge is banked, not cold.\nSet the shovel down.\nRest is also the work.", "sig": true, "cats": ["Rest & Stillness", "Seasons & Letters", "Nature as Teacher"]}, {"n": 128, "part": 6, "title": "Rest is not the pause", "slug": "rest-is-not-the-pause", "stanzas": [["The field lies fallow so the soil can pull itself together.", "The axe is set down on the stump so it can be honed."], ["You still think sleep is an interruption of the work.", "You are driving a truck on fumes,", "angry at the pump for slowing you down."]], "text": "The field lies fallow so the soil can pull itself together.\nThe axe is set down on the stump so it can be honed.\nYou still think sleep is an interruption of the work.\nYou are driving a truck on fumes,\nangry at the pump for slowing you down.", "sig": true, "cats": ["Rest & Stillness", "Healing & Endurance"]}, {"n": 129, "part": 6, "title": "Gentleness is enough of a goal", "slug": "gentleness-is-enough-of-a-goal", "stanzas": [["If your only aim is to stay gentle,", "that is enough.", "There is a freedom in standing where you are,", "with nothing left to prove."], ["It will carry a man further", "than any race he could have run."]], "text": "If your only aim is to stay gentle,\nthat is enough.\nThere is a freedom in standing where you are,\nwith nothing left to prove.\nIt will carry a man further\nthan any race he could have run.", "sig": true, "cats": ["Rest & Stillness", "Fortitude & Gentleness", "Worth & Belonging"]}, {"n": 130, "part": 6, "title": "Peace is not a grip", "slug": "peace-is-not-a-grip", "stanzas": [["I thought peace was a matter of grip,", "of holding every piece in place", "until my hands forgot how to open.", "It is not."], ["Peace is the load set down at the door.", "The arms still ache.", "That passes."]], "text": "I thought peace was a matter of grip,\nof holding every piece in place\nuntil my hands forgot how to open.\nIt is not.\nPeace is the load set down at the door.\nThe arms still ache.\nThat passes.", "sig": true, "cats": ["Rest & Stillness", "Letting Go"]}, {"n": 131, "part": 6, "title": "Put the problem down for the night", "slug": "put-the-problem-down-for-the-night", "stanzas": [["Not every night calls for a fix.", "Some call for the back step and the cold air.", "The sky does its old work without any help from me."], ["Most of what I carry shrinks under that much black.", "What remains can wait for morning."]], "text": "Not every night calls for a fix.\nSome call for the back step and the cold air.\nThe sky does its old work without any help from me.\nMost of what I carry shrinks under that much black.\nWhat remains can wait for morning.", "sig": true, "cats": ["Rest & Stillness", "Nature as Teacher"]}, {"n": 132, "part": 6, "title": "Roots go down in winter", "slug": "roots-go-down-in-winter", "stanzas": [["You are not stuck.", "The oak does not do all its growing", "where you can see it.", "Half the work is done in the dark,", "roots splitting limestone", "while not a single branch moves above the frost."], ["Stillness is not the pause between the work.", "It is the work."]], "text": "You are not stuck.\nThe oak does not do all its growing\nwhere you can see it.\nHalf the work is done in the dark,\nroots splitting limestone\nwhile not a single branch moves above the frost.\nStillness is not the pause between the work.\nIt is the work.", "sig": true, "cats": ["Rest & Stillness", "Growth & Becoming", "Nature as Teacher"]}, {"n": 133, "part": 6, "title": "Alone was never the problem", "slug": "alone-was-never-the-problem", "stanzas": [["Alone was never the problem.", "Alone was the first quiet room you were ever given,", "no one at the door, no one to answer to,", "and in the corner, waiting to be introduced,", "a man you had not met yet."], ["Sit down with him.", "Learn his name.", "He has been patient a long time."]], "text": "Alone was never the problem.\nAlone was the first quiet room you were ever given,\nno one at the door, no one to answer to,\nand in the corner, waiting to be introduced,\na man you had not met yet.\nSit down with him.\nLearn his name.\nHe has been patient a long time.", "sig": true, "cats": ["Rest & Stillness", "Growth & Becoming", "Worth & Belonging"]}, {"n": 134, "part": 6, "title": "Give yourself leave to rest", "slug": "give-yourself-leave-to-rest", "stanzas": [["The dark floor of the pines holds the damp.", "A seed sits under it", "and does nothing for a month.", "Nobody calls it idle."]], "text": "The dark floor of the pines holds the damp.\nA seed sits under it\nand does nothing for a month.\nNobody calls it idle.", "sig": true, "cats": ["Rest & Stillness", "Nature as Teacher"]}, {"n": 135, "part": 6, "title": "In the lean months", "slug": "in-the-lean-months", "stanzas": [["You do not have to perform.", "The moon spends half its time", "down to a sliver.", "It keeps no ledger of who noticed the dark."]], "text": "You do not have to perform.\nThe moon spends half its time\ndown to a sliver.\nIt keeps no ledger of who noticed the dark.", "sig": true, "cats": ["Rest & Stillness", "Healing & Endurance", "Nature as Teacher"]}, {"n": 136, "part": 6, "title": "Dear June, remind me", "slug": "dear-june-remind-me", "stanzas": [["Remind me the arms of this life are open.", "A man can set the shovel down", "and let the heat take over."]], "text": "Remind me the arms of this life are open.\nA man can set the shovel down\nand let the heat take over.", "sig": true, "cats": ["Rest & Stillness", "Seasons & Letters"]}, {"n": 137, "part": 6, "title": "Leave the window open", "slug": "leave-the-window-open", "stanzas": [["Some days the whole of your duty", "is to leave the window open,", "let the wind and the sparrows have the room,", "and trust that hope knows the way back in."]], "text": "Some days the whole of your duty\nis to leave the window open,\nlet the wind and the sparrows have the room,\nand trust that hope knows the way back in.", "sig": true, "cats": ["Rest & Stillness", "Healing & Endurance"]}, {"n": 138, "part": 6, "title": "Keep the window open", "slug": "keep-the-window-open", "stanzas": [["Some days this is the only work.", "Leave the window open.", "Do not throw the latch.", "Hope knows this house.", "Let it come in on its own", "and find you in your chair."]], "text": "Some days this is the only work.\nLeave the window open.\nDo not throw the latch.\nHope knows this house.\nLet it come in on its own\nand find you in your chair.", "sig": true, "cats": ["Rest & Stillness", "Healing & Endurance"]}, {"n": 139, "part": 6, "title": "Still enough to hear it", "slug": "still-enough-to-hear-it", "stanzas": [["Sometimes the whole work is to get quiet.", "Quiet enough to hear the dirt beneath the noise.", "A hard world has never once", "kept the wheat from coming up.", "Goodness grows anyway.", "Stand still long enough", "and you will see it."]], "text": "Sometimes the whole work is to get quiet.\nQuiet enough to hear the dirt beneath the noise.\nA hard world has never once\nkept the wheat from coming up.\nGoodness grows anyway.\nStand still long enough\nand you will see it.", "sig": true, "cats": ["Rest & Stillness", "Nature as Teacher", "Fortitude & Gentleness"]}, {"n": 140, "part": 6, "title": "What your hands are for", "slug": "what-your-hands-are-for", "stanzas": [["When it is too much to hold, open your hands.", "Put them in cold water.", "Put them in the dirt.", "Run them along the grain of a pine board,", "the bark of the oak by the fence,", "the hair of a boy asleep on your shoulder.", "Hands were not made only to carry.", "They were made to tend, to build,", "and when the time comes,", "to open."]], "text": "When it is too much to hold, open your hands.\nPut them in cold water.\nPut them in the dirt.\nRun them along the grain of a pine board,\nthe bark of the oak by the fence,\nthe hair of a boy asleep on your shoulder.\nHands were not made only to carry.\nThey were made to tend, to build,\nand when the time comes,\nto open.", "sig": true, "cats": ["Rest & Stillness", "Fortitude & Gentleness", "Nature as Teacher"]}, {"n": 141, "part": 6, "title": "Make no apology for the rest", "slug": "make-no-apology-for-the-rest", "stanzas": [["Make no apology for being a man who tires.", "For setting the load down at the door.", "For letting the ones you have carried", "carry you a while."], ["You earned the chair.", "Take it."]], "text": "Make no apology for being a man who tires.\nFor setting the load down at the door.\nFor letting the ones you have carried\ncarry you a while.\nYou earned the chair.\nTake it.", "sig": true, "cats": ["Rest & Stillness", "Grace & Self-Forgiveness", "Worth & Belonging"]}, {"n": 142, "part": 6, "title": "I want the composure of September", "slug": "i-want-the-composure-of-september", "stanzas": [["I want the composure of September.", "The way it sits on the porch at dusk", "with the day's work set down beside it,", "sleeves rolled, boots off,", "in no hurry to be anywhere but here."], ["It watches autumn walk up the road", "and hears it say the light is going.", "It answers with a late wind", "that lays the long grass down in a bow."], ["It holds the harvest back one more week,", "with hands that have never once been rushed."], ["See how wide the earth opens", "for what takes its time."]], "text": "I want the composure of September.\nThe way it sits on the porch at dusk\nwith the day's work set down beside it,\nsleeves rolled, boots off,\nin no hurry to be anywhere but here.\nIt watches autumn walk up the road\nand hears it say the light is going.\nIt answers with a late wind\nthat lays the long grass down in a bow.\nIt holds the harvest back one more week,\nwith hands that have never once been rushed.\nSee how wide the earth opens\nfor what takes its time.", "sig": true, "cats": ["Rest & Stillness", "Seasons & Letters", "Nature as Teacher"]}, {"n": 143, "part": 7, "title": "Worthy of its return", "slug": "worthy-of-its-return", "stanzas": [["A man who works without a ledger", "still gets paid at the end of the week."], ["If your entire record is waking at five, boiling the water,", "and keeping the heat on for the house,", "you are allowed to sit at the table you bought."]], "text": "A man who works without a ledger\nstill gets paid at the end of the week.\nIf your entire record is waking at five, boiling the water,\nand keeping the heat on for the house,\nyou are allowed to sit at the table you bought.", "sig": true, "cats": ["Worth & Belonging", "Honor & Character"]}, {"n": 144, "part": 7, "title": "Worth does not move with the water", "slug": "worth-does-not-move-with-the-water", "stanzas": [["Set the striving down on the workbench.", "Stand still."], ["The river trades its water every afternoon", "and keeps its name.", "Your worth was never in the current.", "It is the limestone bed beneath it.", "It does not wash out."]], "text": "Set the striving down on the workbench.\nStand still.\nThe river trades its water every afternoon\nand keeps its name.\nYour worth was never in the current.\nIt is the limestone bed beneath it.\nIt does not wash out.", "sig": true, "cats": ["Worth & Belonging", "Rest & Stillness", "Nature as Teacher"]}, {"n": 145, "part": 7, "title": "Go stand in the sun", "slug": "go-stand-in-the-sun", "stanzas": [["When you forget what you are worth,", "go out to the yard and stand there."], ["The sun will lay its heat across your shoulders.", "The oak will put its shade down over you.", "Neither will ask to see your wallet.", "You belong on the dirt you stand on.", "That was settled before you were born."]], "text": "When you forget what you are worth,\ngo out to the yard and stand there.\nThe sun will lay its heat across your shoulders.\nThe oak will put its shade down over you.\nNeither will ask to see your wallet.\nYou belong on the dirt you stand on.\nThat was settled before you were born.", "sig": true, "cats": ["Worth & Belonging", "Nature as Teacher"]}, {"n": 146, "part": 7, "title": "Not everyone speaks it", "slug": "not-everyone-speaks-it", "stanzas": [["It may be that you speak a quieter tongue,", "one that hears the silence before the answer,", "and reads the room before a word is said."], ["Not everyone was raised in that language.", "Keep speaking it anyway."]], "text": "It may be that you speak a quieter tongue,\none that hears the silence before the answer,\nand reads the room before a word is said.\nNot everyone was raised in that language.\nKeep speaking it anyway.", "sig": true, "cats": ["Worth & Belonging", "Fortitude & Gentleness"]}, {"n": 147, "part": 7, "title": "Nothing left to prove", "slug": "nothing-left-to-prove", "stanzas": [["The proof is already on the table.", "The years, the work, the word you kept.", "What is left is trusting the man who did it."], ["Give him that.", "He has earned the quiet."]], "text": "The proof is already on the table.\nThe years, the work, the word you kept.\nWhat is left is trusting the man who did it.\nGive him that.\nHe has earned the quiet.", "sig": true, "cats": ["Worth & Belonging", "Honor & Character"]}, {"n": 148, "part": 7, "title": "A chair set for you", "slug": "a-chair-set-for-you", "stanzas": [["You carried the plates to other men's tables", "long enough to forget a place was set for you.", "It takes a different nerve to pull the chair out", "and eat what they cooked for you."]], "text": "You carried the plates to other men's tables\nlong enough to forget a place was set for you.\nIt takes a different nerve to pull the chair out\nand eat what they cooked for you.", "sig": true, "cats": ["Worth & Belonging", "Fortitude & Gentleness"]}, {"n": 149, "part": 7, "title": "Stand still and let them look", "slug": "stand-still-and-let-them-look", "stanzas": [["You are not afraid of the bulb on the porch.", "You are afraid of what it will show.", "You have guessed wrong.", "You have never stood still long enough", "to learn your own worth in the morning.", "Stand still. Let them look.", "What they find will not shame you."]], "text": "You are not afraid of the bulb on the porch.\nYou are afraid of what it will show.\nYou have guessed wrong.\nYou have never stood still long enough\nto learn your own worth in the morning.\nStand still. Let them look.\nWhat they find will not shame you.", "sig": true, "cats": ["Worth & Belonging", "Fortitude & Gentleness"]}, {"n": 150, "part": 7, "title": "Some days you let the ground hold you", "slug": "some-days-you-let-the-ground-hold-you", "stanzas": [["Sit in the grass.", "Let it take the weight.", "The soil takes what falls", "the same way it takes rain.", "Nobody calls the rain unnecessary."]], "text": "Sit in the grass.\nLet it take the weight.\nThe soil takes what falls\nthe same way it takes rain.\nNobody calls the rain unnecessary.", "sig": true, "cats": ["Worth & Belonging", "Healing & Endurance", "Rest & Stillness"]}, {"n": 151, "part": 7, "title": "The house you come home to", "slug": "the-house-you-come-home-to", "stanzas": [["It was not built to be looked at.", "Like the gravel under your boots", "it owes no apology for its shape.", "The give in the knees.", "The gray at the temples."], ["It asks only for a chair", "to set the load down."]], "text": "It was not built to be looked at.\nLike the gravel under your boots\nit owes no apology for its shape.\nThe give in the knees.\nThe gray at the temples.\nIt asks only for a chair\nto set the load down.", "sig": true, "cats": ["Worth & Belonging", "Grace & Self-Forgiveness", "Rest & Stillness"]}, {"n": 152, "part": 7, "title": "Nothing in the field withholds", "slug": "nothing-in-the-field-withholds", "stanzas": [["The creek does not ration its water.", "The elm drops its shade", "on the stray dog and the priest."], ["You are made of the same dirt.", "Let the water run.", "It was never meant to be kept in a jar."]], "text": "The creek does not ration its water.\nThe elm drops its shade\non the stray dog and the priest.\nYou are made of the same dirt.\nLet the water run.\nIt was never meant to be kept in a jar.", "sig": true, "cats": ["Worth & Belonging", "Nature as Teacher", "Honor & Character"]}, {"n": 153, "part": 7, "title": "Before anyone is awake", "slug": "before-anyone-is-awake", "stanzas": [["The dew sits on the mower", "before the house is up.", "It sinks into the roots", "and burns off by ten o'clock."], ["No one comes out to thank it.", "The yard is green all the same."]], "text": "The dew sits on the mower\nbefore the house is up.\nIt sinks into the roots\nand burns off by ten o'clock.\nNo one comes out to thank it.\nThe yard is green all the same.", "sig": true, "cats": ["Worth & Belonging", "Honor & Character", "Nature as Teacher"]}, {"n": 154, "part": 7, "title": "What if I am a quieter thing", "slug": "what-if-i-am-a-quieter-thing", "stanzas": [["What if I meet myself more fully", "in an open field than in a crowded room.", "What if I read my face in the sky", "more easily than in a mirror.", "What if my pulse keeps time", "with the sparrows at first light.", "What if I am a different, quieter thing,", "and no less a man for it."]], "text": "What if I meet myself more fully\nin an open field than in a crowded room.\nWhat if I read my face in the sky\nmore easily than in a mirror.\nWhat if my pulse keeps time\nwith the sparrows at first light.\nWhat if I am a different, quieter thing,\nand no less a man for it.", "sig": true, "cats": ["Worth & Belonging", "Nature as Teacher"]}, {"n": 155, "part": 7, "title": "May you never cut yourself down to size", "slug": "may-you-never-cut-yourself-down-to-size", "stanzas": [["May you never trim what you feel", "to something a closed hand can hold.", "Let it stand at its full height.", "The ones who mean to carry it will make room for the whole weight."]], "text": "May you never trim what you feel\nto something a closed hand can hold.\nLet it stand at its full height.\nThe ones who mean to carry it will make room for the whole weight.", "sig": true, "cats": ["Worth & Belonging", "Fatherhood & Duty", "Fortitude & Gentleness"]}, {"n": 156, "part": 8, "title": "Kneeling is its own prayer", "slug": "kneeling-is-its-own-prayer", "stanzas": [["Again I tell myself", "to keep an hour for God,", "then drop to one knee in the grass", "to inspect what a two-year-old holds up.", "Three acorns and a twig.", "I wash the small feet.", "I hold the scraped shin", "and blow on it, which does nothing,", "and he stops crying."], ["At night I unroll the mat.", "The knees of my trousers are green."]], "text": "Again I tell myself\nto keep an hour for God,\nthen drop to one knee in the grass\nto inspect what a two-year-old holds up.\nThree acorns and a twig.\nI wash the small feet.\nI hold the scraped shin\nand blow on it, which does nothing,\nand he stops crying.\nAt night I unroll the mat.\nThe knees of my trousers are green.", "sig": true, "cats": ["Fatherhood & Duty", "Faith & Reverence"]}, {"n": 157, "part": 8, "title": "What I carry there", "slug": "what-i-carry-there", "stanzas": [["His head fits my palm,", "his ear to my chest.", "He sleeps to the beat of it.", "He has never asked what I keep there."], ["So I guard it,", "and keep it worth guarding."]], "text": "His head fits my palm,\nhis ear to my chest.\nHe sleeps to the beat of it.\nHe has never asked what I keep there.\nSo I guard it,\nand keep it worth guarding.", "sig": true, "cats": ["Fatherhood & Duty", "Honor & Character"]}, {"n": 158, "part": 8, "title": "Tell me this is not prayer", "slug": "tell-me-this-is-not-prayer", "stanzas": [["I tell myself to make an hour for God.", "Then I am down on one knee in the gravel", "because my son holds up an acorn", "and needs a witness.", "I wash the mud from his heel.", "I inspect the scraped shin,", "tell him it will hold,", "and he stops crying."], ["Most of my life is spent kneeling.", "The trousers are worn through.", "Tell me this is not prayer."]], "text": "I tell myself to make an hour for God.\nThen I am down on one knee in the gravel\nbecause my son holds up an acorn\nand needs a witness.\nI wash the mud from his heel.\nI inspect the scraped shin,\ntell him it will hold,\nand he stops crying.\nMost of my life is spent kneeling.\nThe trousers are worn through.\nTell me this is not prayer.", "sig": true, "cats": ["Fatherhood & Duty", "Faith & Reverence"]}, {"n": 159, "part": 8, "title": "Nothing gets done with you here", "slug": "nothing-gets-done-with-you-here", "stanzas": [["I cannot chop an onion with crayons on the board.", "I cannot fix the trap under the sink", "with your hand closed around my wrench.", "Nothing gets done with you here."], ["Then I look at your hand,", "the knuckles filling out,", "one day closer to turning the doorknob without me."], ["The sink can leak a while longer.", "Nothing gets done with you here.", "That is the work."]], "text": "I cannot chop an onion with crayons on the board.\nI cannot fix the trap under the sink\nwith your hand closed around my wrench.\nNothing gets done with you here.\nThen I look at your hand,\nthe knuckles filling out,\none day closer to turning the doorknob without me.\nThe sink can leak a while longer.\nNothing gets done with you here.\nThat is the work.", "sig": true, "cats": ["Fatherhood & Duty", "Letting Go"]}, {"n": 160, "part": 8, "title": "No one told me about the arms", "slug": "no-one-told-me-about-the-arms", "stanzas": [["No one told me my arms would never rest again.", "They ache from carrying you up the stairs,", "or they ache from the empty air when you are at school.", "There is no third option.", "I will carry either."]], "text": "No one told me my arms would never rest again.\nThey ache from carrying you up the stairs,\nor they ache from the empty air when you are at school.\nThere is no third option.\nI will carry either.", "sig": true, "cats": ["Fatherhood & Duty", "Letting Go"]}, {"n": 161, "part": 8, "title": "I keep saying I will make time for prayer", "slug": "i-keep-saying-i-will-make-time-for-prayer", "stanzas": [["I bend to inspect a two-year-old's treasure,", "three acorns and a muddy twig.", "I wash his feet in the tub.", "I blow on the scraped shin,", "say I love him at his eye level,", "so the words have somewhere to land."], ["I have spent whole years kneeling.", "Tell me that was not prayer."]], "text": "I bend to inspect a two-year-old's treasure,\nthree acorns and a muddy twig.\nI wash his feet in the tub.\nI blow on the scraped shin,\nsay I love him at his eye level,\nso the words have somewhere to land.\nI have spent whole years kneeling.\nTell me that was not prayer.", "sig": true, "cats": ["Fatherhood & Duty", "Faith & Reverence"]}, {"n": 162, "part": 8, "title": "It took becoming a father", "slug": "it-took-becoming-a-father", "stanzas": [["It took becoming a father", "to meet the men I had been before.", "The boy in the driveway, the hothead,", "the one who kept running.", "I shook each of their hands.", "Now when I come home to myself", "I open the door quietly,", "with something good in my pockets."]], "text": "It took becoming a father\nto meet the men I had been before.\nThe boy in the driveway, the hothead,\nthe one who kept running.\nI shook each of their hands.\nNow when I come home to myself\nI open the door quietly,\nwith something good in my pockets.", "sig": true, "cats": ["Fatherhood & Duty", "Grace & Self-Forgiveness", "Growth & Becoming"]}, {"n": 163, "part": 8, "title": "When my back aches from being a father", "slug": "when-my-back-aches-from-being-a-father", "stanzas": [["When my back aches from lifting the boy,", "I lie flat on the floorboards.", "The oak teaches me without a word", "how to give all I am", "to feet that walk on me all afternoon.", "It stays solid underneath them.", "It calls it holding, not loss."]], "text": "When my back aches from lifting the boy,\nI lie flat on the floorboards.\nThe oak teaches me without a word\nhow to give all I am\nto feet that walk on me all afternoon.\nIt stays solid underneath them.\nIt calls it holding, not loss.", "sig": true, "cats": ["Fatherhood & Duty", "Nature as Teacher", "Healing & Endurance"]}, {"n": 164, "part": 8, "title": "You were built to feel", "slug": "you-were-built-to-feel", "stanzas": [["A river was built to move water.", "That is the design, not a flaw.", "When it rises, let it rise."], ["The lower pasture is not weak", "for taking the flood.", "It is how the hay comes back."]], "text": "A river was built to move water.\nThat is the design, not a flaw.\nWhen it rises, let it rise.\nThe lower pasture is not weak\nfor taking the flood.\nIt is how the hay comes back.", "sig": true, "cats": ["Fatherhood & Duty", "Fortitude & Gentleness", "Grace & Self-Forgiveness"]}, {"n": 165, "part": 8, "title": "Stone fruit season", "slug": "stone-fruit-season", "stanzas": [["The earth meets us halfway through the year", "with the labor of late summer.", "I rise before the light to take a knife to the apricots,", "halving them for my children,", "working the stone from the flesh", "in a motion my wrists have memorized."], ["I thank the ground for this reminder.", "A man can give all of himself", "and still keep his center."]], "text": "The earth meets us halfway through the year\nwith the labor of late summer.\nI rise before the light to take a knife to the apricots,\nhalving them for my children,\nworking the stone from the flesh\nin a motion my wrists have memorized.\nI thank the ground for this reminder.\nA man can give all of himself\nand still keep his center.", "sig": true, "cats": ["Fatherhood & Duty", "Nature as Teacher", "Seasons & Letters"]}, {"n": 166, "part": 9, "title": "Winters that were never mine", "slug": "winters-that-were-never-mine", "stanzas": [["I am learning to set down", "the frost that was never mine to carry,", "to open my hands", "and leave them open."], ["Stop handing your harvest", "to another man's weather."]], "text": "I am learning to set down\nthe frost that was never mine to carry,\nto open my hands\nand leave them open.\nStop handing your harvest\nto another man's weather.", "sig": true, "cats": ["Letting Go", "Fortitude & Gentleness", "Growth & Becoming"]}, {"n": 167, "part": 9, "title": "Winters that were never yours", "slug": "winters-that-were-never-yours", "stanzas": [["Set down the frost that was never yours to carry.", "Feel for others, but with open hands,", "not a fist that takes their cold as your own."], ["Do not hand your one spring", "to every storm that walks past you.", "The field comes green on its own calendar."]], "text": "Set down the frost that was never yours to carry.\nFeel for others, but with open hands,\nnot a fist that takes their cold as your own.\nDo not hand your one spring\nto every storm that walks past you.\nThe field comes green on its own calendar.", "sig": true, "cats": ["Letting Go", "Seasons & Letters"]}, {"n": 168, "part": 9, "title": "You do not need the whole map", "slug": "you-do-not-need-the-whole-map", "stanzas": [["Thirty years in, I still check the mirrors.", "The headlights only show forty yards of asphalt,", "and forty yards is enough to steer by."], ["Somewhere past the county line,", "I stopped demanding to see the destination,", "and started watching the man behind the wheel."]], "text": "Thirty years in, I still check the mirrors.\nThe headlights only show forty yards of asphalt,\nand forty yards is enough to steer by.\nSomewhere past the county line,\nI stopped demanding to see the destination,\nand started watching the man behind the wheel.", "sig": true, "cats": ["Letting Go", "Growth & Becoming"]}, {"n": 169, "part": 9, "title": "The man you would have been", "slug": "the-man-you-would-have-been", "stanzas": [["Let go of the man you would have been", "if the bad year had skipped your house.", "He is a pencil sketch. He never bled."], ["The man standing in your boots", "knows what a hundred pounds feels like", "before he bends his knees.", "Stand with him.", "He is the one who showed up to work."]], "text": "Let go of the man you would have been\nif the bad year had skipped your house.\nHe is a pencil sketch. He never bled.\nThe man standing in your boots\nknows what a hundred pounds feels like\nbefore he bends his knees.\nStand with him.\nHe is the one who showed up to work.", "sig": true, "cats": ["Letting Go", "Growth & Becoming", "Healing & Endurance"]}, {"n": 170, "part": 9, "title": "What made the difference", "slug": "what-made-the-difference", "stanzas": [["Any man can clench his jaw and call it strength.", "It takes something else to open your hands", "and let the river take what was only water."], ["That was the difference."]], "text": "Any man can clench his jaw and call it strength.\nIt takes something else to open your hands\nand let the river take what was only water.\nThat was the difference.", "sig": true, "cats": ["Letting Go", "Fortitude & Gentleness"]}, {"n": 171, "part": 9, "title": "Only what is yours", "slug": "only-what-is-yours", "stanzas": [["Count the load again.", "Some of it has your name on it.", "Most of it does not."], ["A man can carry a great deal", "and still learn the difference between duty and habit.", "Set down what was never yours.", "Walk lighter, not smaller."]], "text": "Count the load again.\nSome of it has your name on it.\nMost of it does not.\nA man can carry a great deal\nand still learn the difference between duty and habit.\nSet down what was never yours.\nWalk lighter, not smaller.", "sig": true, "cats": ["Letting Go", "Honor & Character"]}, {"n": 172, "part": 9, "title": "What May taught me", "slug": "what-may-taught-me", "stanzas": [["I have stopped waiting for the hard years", "to say they were sorry.", "The apple orchard never got an apology", "from the late frost,", "and it has never once withheld the fruit."], ["May comes.", "The branches do what branches do.", "I have decided to do the same."]], "text": "I have stopped waiting for the hard years\nto say they were sorry.\nThe apple orchard never got an apology\nfrom the late frost,\nand it has never once withheld the fruit.\nMay comes.\nThe branches do what branches do.\nI have decided to do the same.", "sig": true, "cats": ["Letting Go", "Seasons & Letters", "Nature as Teacher"]}, {"n": 173, "part": 9, "title": "Set down what was never yours", "slug": "set-down-what-was-never-yours", "stanzas": [["You are allowed to set it down.", "The weight you picked up because no one else would.", "The blame that was handed to you,", "which you carried, because carrying is what you know."], ["Let it go the way frost goes on the first morning of spring.", "No fight. No sound.", "Gone before the coffee in your mug is cold."]], "text": "You are allowed to set it down.\nThe weight you picked up because no one else would.\nThe blame that was handed to you,\nwhich you carried, because carrying is what you know.\nLet it go the way frost goes on the first morning of spring.\nNo fight. No sound.\nGone before the coffee in your mug is cold.", "sig": true, "cats": ["Letting Go", "Rest & Stillness"]}, {"n": 174, "part": 9, "title": "What the ground does with what falls", "slug": "what-the-ground-does-with-what-falls", "stanzas": [["You carry a heavy load", "and will not set it down.", "The forest floor takes the dead oak branch", "and holds it until it rots into soil."], ["In time it turns the weight to ground", "that a green shoot can stand on."]], "text": "You carry a heavy load\nand will not set it down.\nThe forest floor takes the dead oak branch\nand holds it until it rots into soil.\nIn time it turns the weight to ground\nthat a green shoot can stand on.", "sig": true, "cats": ["Letting Go", "Healing & Endurance", "Nature as Teacher"]}, {"n": 175, "part": 10, "title": "A note for the new month", "slug": "a-note-for-the-new-month", "stanzas": [["The field does not ask the winter to apologize.", "It takes the frost, the long dark, the silence.", "When the thaw comes it turns green again", "without a word about the ice."], ["Let this month find you the same.", "Demand no apology.", "Go about the work of growing back."]], "text": "The field does not ask the winter to apologize.\nIt takes the frost, the long dark, the silence.\nWhen the thaw comes it turns green again\nwithout a word about the ice.\nLet this month find you the same.\nDemand no apology.\nGo about the work of growing back.", "sig": true, "cats": ["Seasons & Letters", "Nature as Teacher", "Letting Go"]}, {"n": 176, "part": 10, "title": "Come back out", "slug": "come-back-out", "stanzas": [["The ground has thawed enough to walk on", "and the wind has turned to your side of the house."], ["Nothing out here demands a speech.", "It only asks that you open the door,", "stand in the yard a while,", "and let the dog see you are still here."]], "text": "The ground has thawed enough to walk on\nand the wind has turned to your side of the house.\nNothing out here demands a speech.\nIt only asks that you open the door,\nstand in the yard a while,\nand let the dog see you are still here.", "sig": true, "cats": ["Seasons & Letters", "Healing & Endurance", "Nature as Teacher"]}, {"n": 177, "part": 10, "title": "Dear summer, remind me", "slug": "dear-summer-remind-me", "stanzas": [["Remind me that life is not only weight.", "There is warmth waiting for a man", "who has spent too long braced against the cold.", "I am allowed to drop the shovel", "and stand in your long light a while."]], "text": "Remind me that life is not only weight.\nThere is warmth waiting for a man\nwho has spent too long braced against the cold.\nI am allowed to drop the shovel\nand stand in your long light a while.", "sig": true, "cats": ["Seasons & Letters", "Rest & Stillness"]}, {"n": 178, "part": 10, "title": "Dear July, the long light", "slug": "dear-july-the-long-light", "stanzas": [["The sun is staying up late these days,", "leaving a light on the way a father does for a son not yet home.", "I take it as it is meant.", "An invitation to look up from the workbench", "and see who is still here."]], "text": "The sun is staying up late these days,\nleaving a light on the way a father does for a son not yet home.\nI take it as it is meant.\nAn invitation to look up from the workbench\nand see who is still here.", "sig": true, "cats": ["Seasons & Letters", "Worth & Belonging"]}, {"n": 179, "part": 10, "title": "Dear July, the middle of the year", "slug": "dear-july-the-middle-of-the-year", "stanzas": [["The sun leaves the light on longer these days.", "I eat a peach over the kitchen sink", "and let it run down my wrist.", "I watch fireflies in the yard", "and ask nothing of them.", "I sit back in the porch chair", "and let the oak tree show me", "how a heavy thing can still sway."]], "text": "The sun leaves the light on longer these days.\nI eat a peach over the kitchen sink\nand let it run down my wrist.\nI watch fireflies in the yard\nand ask nothing of them.\nI sit back in the porch chair\nand let the oak tree show me\nhow a heavy thing can still sway.", "sig": true, "cats": ["Seasons & Letters", "Rest & Stillness"]}, {"n": 180, "part": 10, "title": "Dear August, be patient", "slug": "dear-august-be-patient", "stanzas": [["I hope August is patient with you.", "The last long days of summer", "spent at the window,", "watching the road for autumn to come home."]], "text": "I hope August is patient with you.\nThe last long days of summer\nspent at the window,\nwatching the road for autumn to come home.", "sig": true, "cats": ["Seasons & Letters", "Rest & Stillness"]}, {"n": 181, "part": 11, "title": "No one saw the climb", "slug": "no-one-saw-the-climb", "stanzas": [["No one stood with you on the nights", "you kept going on nothing but your own word.", "A man does not need a witness", "to know the weight of his coat."], ["You know the miles.", "That is enough."]], "text": "No one stood with you on the nights\nyou kept going on nothing but your own word.\nA man does not need a witness\nto know the weight of his coat.\nYou know the miles.\nThat is enough.", "sig": true, "cats": ["Honor & Character", "Healing & Endurance", "Worth & Belonging"]}, {"n": 182, "part": 11, "title": "Not the distance", "slug": "not-the-distance", "stanzas": [["Do not measure it by the miles.", "Any highway will carry a man far.", "Measure it by what you kept the whole way", "and never set down."], ["Your name. Your word.", "The one you said you would be."]], "text": "Do not measure it by the miles.\nAny highway will carry a man far.\nMeasure it by what you kept the whole way\nand never set down.\nYour name. Your word.\nThe one you said you would be.", "sig": true, "cats": ["Honor & Character", "Growth & Becoming"]}, {"n": 183, "part": 11, "title": "Ask what held", "slug": "ask-what-held", "stanzas": [["The years will change a man.", "That was never in question.", "Ask instead what held.", "The word he gave and kept,", "the name he answers to,", "the heavy door he pushes open", "on days when showing up is the hard part."], ["Do not ask how the wood warped.", "Ask what the nails held."]], "text": "The years will change a man.\nThat was never in question.\nAsk instead what held.\nThe word he gave and kept,\nthe name he answers to,\nthe heavy door he pushes open\non days when showing up is the hard part.\nDo not ask how the wood warped.\nAsk what the nails held.", "sig": true, "cats": ["Honor & Character", "Growth & Becoming"]}, {"n": 184, "part": 11, "title": "What if it was never the changing", "slug": "what-if-it-was-never-the-changing", "stanzas": [["What if it was the word kept.", "The man who walked up the drive", "at the same hour every year", "and knocked on the door."]], "text": "What if it was the word kept.\nThe man who walked up the drive\nat the same hour every year\nand knocked on the door.", "sig": true, "cats": ["Honor & Character", "Growth & Becoming"]}, {"n": 185, "part": 12, "title": "The fullness of God in a chamomile flower", "slug": "the-fullness-of-god-in-a-chamomile-flower", "stanzas": [["Dried heads in a linen bag,", "small enough to rest on a fingernail.", "The scent takes the whole kitchen", "before the water boils."], ["I spent years working to be large.", "Make me small before You,", "filling the house anyway,", "leaving no distance to cross."]], "text": "Dried heads in a linen bag,\nsmall enough to rest on a fingernail.\nThe scent takes the whole kitchen\nbefore the water boils.\nI spent years working to be large.\nMake me small before You,\nfilling the house anyway,\nleaving no distance to cross.", "sig": true, "cats": ["Faith & Reverence", "Nature as Teacher"]}, {"n": 186, "part": 12, "title": "The way the earth turns", "slug": "the-way-the-earth-turns", "stanzas": [["Winter lays heavy on the coat.", "You did not ask for the snow,", "but you shovel the drive anyway."], ["You step out at six in the morning,", "finding the gray edge of the sun", "the way the earth does.", "Without being told."]], "text": "Winter lays heavy on the coat.\nYou did not ask for the snow,\nbut you shovel the drive anyway.\nYou step out at six in the morning,\nfinding the gray edge of the sun\nthe way the earth does.\nWithout being told.", "sig": true, "cats": ["Faith & Reverence", "Healing & Endurance", "Fortitude & Gentleness"]}, {"n": 187, "part": 12, "title": "Letters I have not opened", "slug": "letters-i-have-not-opened", "stanzas": [["Maybe the questions I cannot answer", "are not asking to be solved.", "Maybe they only ask to be carried."], ["I pack them like sealed letters,", "unread, stowed with the rest of my gear.", "They remind me that when the woods go dark,", "I am not walking them alone."], ["If I carry them long enough,", "I might learn that holding my own mystery", "is the answer to a hunger older than any question.", "It is the unknown in a man that lets him be known."]], "text": "Maybe the questions I cannot answer\nare not asking to be solved.\nMaybe they only ask to be carried.\nI pack them like sealed letters,\nunread, stowed with the rest of my gear.\nThey remind me that when the woods go dark,\nI am not walking them alone.\nIf I carry them long enough,\nI might learn that holding my own mystery\nis the answer to a hunger older than any question.\nIt is the unknown in a man that lets him be known.", "sig": true, "cats": ["Faith & Reverence", "Growth & Becoming"]}, {"n": 188, "part": 13, "title": "Winter still sits in my shoulders", "slug": "winter-still-sits-in-my-shoulders", "stanzas": [["long after my boots have found", "the warm dirt of April."], ["Maybe grief stays loyal", "to the man who carried it", "out into the sun."]], "text": "long after my boots have found\nthe warm dirt of April.\nMaybe grief stays loyal\nto the man who carried it\nout into the sun.", "sig": true, "cats": ["Grief & Loss", "Healing & Endurance"]}, {"n": 189, "part": 13, "title": "What are tears", "slug": "what-are-tears", "stanzas": [["I was taught to keep them.", "I kept them for years", "the way a concrete dam keeps a river", "and called it strength.", "But tears are only love", "that has run out of room", "and taken the only road out."]], "text": "I was taught to keep them.\nI kept them for years\nthe way a concrete dam keeps a river\nand called it strength.\nBut tears are only love\nthat has run out of room\nand taken the only road out.", "sig": true, "cats": ["Grief & Loss", "Fortitude & Gentleness"]}, {"n": 190, "part": 14, "title": "The oak is in no hurry", "slug": "the-oak-is-in-no-hurry", "stanzas": [["Ten minutes, I said,", "between the fence and the gutters,", "and dragged the chair out under the oak."], ["It took a hundred years to hold this much shade.", "It lets it fall on the truck, the dog, the man", "and never asks which of us earned it."], ["The shade has mov     });

    if (inList(SKINS, params.skin)) state.skin = params.skin;
    if (inList(MODELS, params.model)) state.model = params.model;
    if (inList(CONTRASTS, params.contrast)) state.contrast = params.contrast;

    if (params.hue !== undefined && isFinite(h) && h >= 0 && h <= 360) state.hue = h;

  var root = document.documentElement;

    Object.keys(palette).forEach(function (k) { root.style.setProperty(k, palette[k]); });

  function buildSeg(el, list, key) {

  var segSkin = document.getElementById("seg-skin");
  var segModel = document.getElementById("seg-model");
  var segContrast = document.getElementById("seg-contrast");
  var hueInput = document.getElementById("hue");
  var hueOut = document.getElementById("hue-out");
  buildSeg(segMode, MODES, "mode");
  buildSeg(segSkin, SKINS, "skin");
  buildSeg(segModel, MODELS, "model");

  /* ==================================================================
     The book

  var BOOK = JSON.parse(document.getElementById("book").textContent);

  var BT = BOOK.title;
  var MULTI = BOOK.parts.length > 1;
  var bySlug = {}, catBySlug = {}, catByName = {};
  POEMS.forEach(function (p) { bySlug[p.slug] = p; });
  BOOK.cats.forEach(function (c) { catBySlug[c.slug] = c; catByName[c.name] = c; });

  var strip = document.getElementById("strip");

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (ch) {

  }
  function poemHref(p) { return "#/poem/" + p.slug; }
  function catHref(c) { return "#/index/" + c.slug; }
  function partName(n) {
    var part = BOOK.parts.filter(function (x) { return x.n === n; })[0];

  }

  function cover() {
    var C = BOOK.cover;
    var first = POEMS[0];
    var ep = C.epigraph && bySlug[C.epigraph.slug];
    var doors = '<li><a href="' + poemHref(first) + '">Begin with No. 1, “' + esc(first.title) + '”</a></li>';
    (BOOK.parts.length <= 3 ? BOOK.parts.slice(1) : []).forEach(function (part) {
      var p = POEMS.filter(function (x) { return x.part === part.n; })[0];
      if (p) doors += '<li><a href="' + poemHref(p) + '">Begin ' + esc(part.label) + ', “' + esc(p.title) + '”</a></li>';
    });
    doors += '<li><a href="#/contents">Browse the contents</a></li>' +
      '<li><a href="#/index">Browse by category</a></li>';
    (BOOK.siblings || []).forEach(function (s) {
      doors += '<li><a href="' + esc(s.href) + '">Read the shorter book, <cite>' + esc(s.title) + '</cite></a></li>';
    });

      '<h1 class="cover-title" tabindex="-1">' + C.lines.map(function (l) { return '<span>' + esc(l) + '</span>'; }).join('') + '</h1>' +
      '<p class="byline">Poems by P. R. Manjee</p>' +
      '<p class="intro">' + esc(BOOK.intro) + '</p>' +
      (ep ? '<blockquote class="epigraph"><p>' + C.epigraph.lines.map(esc).join('<br>') + '</p>' +
        '<a href="' + poemHref(ep) + '">From “' + esc(ep.title) + ',” No. ' + ep.n + '</a></blockquote>' : '') +
      '<ul class="doors">' + doors + '</ul></div>';
  }

  function contents() {
    var out = '<div class="col wide surface"><h1 class="page-title" tabindex="-1">Contents</h1>' +
      '<p class="lede">' + TOTAL + ' poems' + (MULTI ? ' in ' + BOOK.parts.length + ' groups' : '') + '. Every title opens its poem.</p>';
    BOOK.parts.forEach(function (part) {
      var list = POEMS.filter(function (p) { return p.part === part.n; });
      if (!list.length) return;
      out += (MULTI ? '<section class="part" aria-labelledby="part-' + part.n + '">' +
          '<h2 id="part-' + part.n + '">' + esc(part.title) + '</h2>' +
          '<p class="count">' + list.length + ' poems, Nos. ' + list[0].n + ' to ' + list[list.length - 1].n + '</p>'

        '<ol class="toc" start="' + list[0].n + '">' +
        list.map(function (p) { return '<li><a href="' + poemHref(p) + '">' + esc(p.title) + '</a></li>'; }).join('') +
        '</ol></section>';
    });
    return out + '</div>';
  }

  function sortKey(t) { return t.toLowerCase().replace(/[^\w ]/g, ""); }
  function entry(p) {
    return '<li><a href="' + poemHref(p) + '">' + esc(p.title) + '</a><span class="no">No. ' + p.n + '</span></li>';
  }

  function index() {
    var out = '<div class="col wide surface"><h1 class="page-title" tabindex="-1">Index</h1>' +
      '<p class="lede">' + BOOK.cats.length + ' categories. A poem may sit under more than one. ' +
      'Pick a category to jump to its poems, or find a poem in the <a href="#/index/titles-a-to-z">titles A to Z</a>.</p>' +
      '<ul class="jump">' + BOOK.cats.map(function (c) {
        return '<li><a href="' + catHref(c) + '">' + esc(c.name) + '<small>' + c.poems.length + '</small></a></li>';
      }).join('') + '</ul>';
    BOOK.cats.forEach(function (c) {
      out += '<section class="cat" id="' + c.slug + '" aria-labelledby="h-' + c.slug + '">' +
        '<h2 id="h-' + c.slug + '" tabindex="-1">' + esc(c.name) + '<small>' + c.poems.length + (c.poems.length === 1 ? ' poem' : ' poems') + '</small></h2>' +
        '<ul class="entries">' + c.poems.map(function (n) { return entry(POEMS[n - 1]); }).join('') + '</ul></section>';
    });
    var alpha = POEMS.slice().sort(function (a, b) { return sortKey(a.title) < sortKey(b.title) ? -1 : 1; });
    var groups = [], cur = null;
    alpha.forEach(function (p) {
      var L = sortKey(p.title).charAt(0).toUpperCase();
      if (!cur || cur.letter !== L) { cur = { letter: L, items: [] }; groups.push(cur); }
      cur.items.push(p);
    });

      '<h2 id="h-az" tabindex="-1">Titles A to Z<small>' + TOTAL + ' poems</small></h2>' +
      groups.map(function (g) {

      }).join('') + '</section>' +

  }

  /* One poem, rendered either inside the modal or, at #/only/<slug>, on its own. */

    }).join('');

      return '<a href="' + catHref(catByName[name]) + '">' + esc(name) + '</a>';

      '<h1 tabindex="-1">' + esc(p.title) + '</h1>' +

      (p.sig ? '<p class="sig">-pr</p>' : '') +

          (next ? '<a class="next" rel="next" href="' + poemHref(next) + '"><small>Next, No. ' + next.n + '</small><span>' + esc(next.title) + '</span></a>' : '') +

  function highlight(text, needle) {

  /* ---------- The modal ---------- */

  /* A floating scrollbar drawn over the page, inset from the right edge, in
     the same material as the plates. It appears while its surface is scrolling
     or hovered and fades when idle, and the thumb can be dragged. */
  var GAP = 16;       // distance from the right edge
  var END = 16;       // distance from the top and bottom
  var MIN_THUMB = 32;

  function floatingScrollbar(scroller, isPage) {
    var bar = document.createElement("div");
    bar.className = "sbar";
    bar.setAttribute("aria-hidden", "true");
    var thumb = document.createElement("i");
    bar.appendChild(thumb);
    document.body.appendChild(bar);

    var idle = null, hovering = false, dragging = false, dragFrom = 0, dragTop = 0;

    function metrics() {
      if (isPage) {
        return {
          top: window.pageYOffset || document.documentElement.scrollTop,
          full: document.documentElement.scrollHeight,
          view: window.innerHeight
        };
      }
      return { top: scroller.scrollTop, full: scroller.scrollHeight, view: scroller.clientHeight };
    }
    function place() {
      if (isPage) {
        bar.style.right = GAP + "px";
        bar.style.top = END + "px";
        bar.style.height = Math.max(0, window.innerHeight - END * 2) + "px";
      } else {
        var r = scroller.getBoundingClientRect();
        bar.style.right = Math.max(GAP, window.innerWidth - r.right + 10) + "px";
        bar.style.top = (r.top + 12) + "px";
        bar.style.height = Math.max(0, r.height - 24) + "px";
      }
    }
    function update() {
      var m = metrics();
      if (m.full <= m.view + 1) { bar.classList.remove("on"); return false; }
      var track = bar.clientHeight;
      var h = Math.max(MIN_THUMB, track * (m.view / m.full));
      var top = (m.top / (m.full - m.view)) * (track - h);
      thumb.style.height = h + "px";
      thumb.style.top = (isFinite(top) ? top : 0) + "px";
      return true;
    }
    function show() {
      place();
      if (!update()) return;
      bar.classList.add("on");
      clearTimeout(idle);
      idle = setTimeout(function () {
        if (!hovering && !dragging) bar.classList.remove("on");
      }, 900);
    }

    (isPage ? window : scroller).addEventListener("scroll", show, { passive: true });
    window.addEventListener("resize", show);
    /* Hovering means hovering the scrollbar itself. Hooking this to the
       document or to the scroller kept `hovering` true for as long as the
       pointer was anywhere on the page, so the bar never faded. */
    bar.addEventListener("mouseenter", function () { hovering = true; show(); });
    bar.addEventListener("mouseleave", function () {
      hovering = false;
      clearTimeout(idle);
      idle = setTimeout(function () { if (!dragging) bar.classList.remove("on"); }, 400);
    });

    thumb.addEventListener("pointerdown", function (e) {
      dragging = true;
      dragFrom = e.clientY;
      dragTop = parseFloat(thumb.style.top) || 0;
      bar.classList.add("dragging");
      thumb.setPointerCapture(e.pointerId);
      e.preventDefault();
    });
    thumb.addEventListener("pointermove", function (e) {
      if (!dragging) return;
      var m = metrics();
      var track = bar.clientHeight;
      var h = thumb.offsetHeight;
      var next = Math.min(Math.max(0, dragTop + (e.clientY - dragFrom)), track - h);
      var ratio = next / (track - h);
      var to = ratio * (m.full - m.view);
      if (isPage) window.scrollTo(0, to); else scroller.scrollTop = to;
    });
    thumb.addEventListener("pointerup", function () {
      dragging = false;
      bar.classList.remove("dragging");
      show();
    });

    return { show: show, place: place, update: update };
  }

  var pageBar = floatingScrollbar(window, true);
  var modalBar = floatingScrollbar(modal, false);
  var panelBar = floatingScrollbar(panel, false);
  pageBar.show();

  function setStrip(p) {

  var current = null;
  function route() {
    var h = decodeURIComponent(location.hash.replace(/^#/, ""));
    if (h && h.charAt(0) !== "/") {

      if (catBySlug[h]) { location.replace("#/index/" + h); return; }
    }
    var parts = h.replace(/^\//, "").split("/");
    var name = parts[0] || "";
    var arg = parts.slice(1).join("/");
    var html, title = BT, nav = null, p = null, scrollTarget = null;

    if (name === "random") {

    else if (name === "contents") { html = contents(); title = "Contents | " + BT; nav = "contents"; }

    else if (name === "only" && bySlug[arg]) {

    else if (name === "search") { html = search(arg); title = "Search | " + BT; }

    if (name !== "only") document.body.classList.remove("single");

    /* A poem opens over whatever is behind it. Arriving cold, the contents go
       behind so closing the modal lands somewhere sensible. */
    if (name === "poem" && bySlug[arg]) {
      p = bySlug[arg];
      if (!view.firstChild) { view.innerHTML = contents(); current = "contents/"; }
      openPoem(p);
      document.title = p.title + " | " + BT;
      setNav(null);
      setStrip(p);
      return;
    }
    closePoem();

    if (name !== "search" && document.activeElement !== q) q.value = "";
    var key = name + "/" + (name === "index" ? "" : arg);
    var sameIndex = current === key && name === "index";
    if (!sameIndex) view.innerHTML = html;
    current = key;
    document.title = title;
    setNav(nav);
    setStrip(p);

    if (name === "search" && document.activeElement === q) return;
    var target = scrollTarget && document.getElementById(scrollTarget);
    if (target) {
      target.scrollIntoView({ block: "start" });
      var hd = target.querySelector("h2");
      if (hd) hd.focus({ preventScroll: true });
    } else {
      window.scrollTo(0, 0);
      var h1 = view.querySelector("h1");
      if (h1) h1.focus({ preventScroll: true });
    }
  }
  window.addEventListener("hashchange", route);

  var timer = null;
  q.addEventListener("input", function () {
    clearTimeout(timer);
    timer = setTimeout(function () {
      var v = q.value;
      var target = v.trim() ? "#/search/" + encodeURIComponent(v) : "#/search/";
      if (location.hash.indexOf("#/search") === 0) history.replaceState(null, "", target);
      else history.pushState(null, "", target);
      route();
    }, 140);
  });
  document.getElementById("search-form").addEventListener("submit", function (e) {
    e.preventDefault();
    var first = view.querySelector(".results a");
    if (first) first.focus();
  });

  document.addEventListener("keydown", function (e) {
    var tag = (e.target.tagName || "").toLowerCase();
    if (tag === "input" || tag === "textarea" || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === "/") { e.preventDefault(); q.focus(); return; }
    if (e.key === "Escape" && modalOpen) { leaveModal(); return; }
    var m = location.hash.match(/^#\/poem\/(.+)$/);
    if (!m) return;
    var p = bySlug[decodeURIComponent(m[1])];
    if (!p) return;
    if (e.key === "ArrowRight" && POEMS[p.n]) location.hash = poemHref(POEMS[p.n]);
    if (e.key === "ArrowLeft" && POEMS[p.n - 2]) location.hash = poemHref(POEMS[p.n - 2]);
  });

  if (location.hash.indexOf("#/search/") === 0) q.value = decodeURIComponent(location.hash.slice(9));
  route();
})();
</script>
</body>
</html>
