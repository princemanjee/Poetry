take the absence of pessimism.", "I'll take step one again. Step one again.", "I'll take <em>cautiously not pessimistic<\/em> and frame it."], ["Because here's the arithmetic of the whole thing:", "the count is not a milestone. It's not round.", "It's just the next one. And the <em>nextness<\/em> is the point.", "Recovery is not a place you drive to and park.", "It's a pen mark, then a pen mark, then a pen mark,", "and the mark is always the same mark,", "and the sameness is the whole entire miracle."], ["Has he changed? The man. Has he changed?", "I honestly don't know. The engine's still running.", "Same engine. Installed the day the sky got taken away.", "It doesn't care about direction. It only wants to go.", "But the driver. Maybe the driver.", "Maybe the guy who chooses whether the going", "is running or standing.", "Or maybe that's a story I tell because", "the alternative is a story I can't afford."], ["I don't know.", "And the not knowing is the newest thing I own."], ["So: tomorrow. The pen. The mark. The coffee. The dogs.", "The wind through the walls. The bucket. The lake.", "The city that processes you and does not slow down.", "The fight, which looks like a life, because it is one."], ["The flame's still on.", "Nobody's cooking.", "Somebody could."]], "text": "My mother said a pessimist is just an optimist\nwho got hit enough times to learn to flinch.\nThat's me. That's exactly me. I'd like it on a shirt.\nAn optimist who kept getting punched in the plan\nuntil the optimism ducked on its own.\nBut it's still in there.\nThat's the part they don't put on the shirt.\nYou know a pilot light? Down in the stove,\nthat little blue nothing that nobody looks at,\nburning at three in the morning with no pot on,\nburning through the funeral and the eviction\nand the six months and the drip and the frame,\nnot because anyone asked it to, but because\nthat is what a pilot light does. It stays lit.\nIt waits for someone to turn the knob.\nI asked my lawyer if he was optimistic.\nHe said: I am experiencing the absence of pessimism,\nwhich in this practice is as close as I get.\nI'll take it. I'll take the absence of pessimism.\nI'll take step one again. Step one again.\nI'll take cautiously not pessimistic and frame it.\nBecause here's the arithmetic of the whole thing:\nthe count is not a milestone. It's not round.\nIt's just the next one. And the nextness is the point.\nRecovery is not a place you drive to and park.\nIt's a pen mark, then a pen mark, then a pen mark,\nand the mark is always the same mark,\nand the sameness is the whole entire miracle.\nHas he changed? The man. Has he changed?\nI honestly don't know. The engine's still running.\nSame engine. Installed the day the sky got taken away.\nIt doesn't care about direction. It only wants to go.\nBut the driver. Maybe the driver.\nMaybe the guy who chooses whether the going\nis running or standing.\nOr maybe that's a story I tell because\nthe alternative is a story I can't afford.\nI don't know.\nAnd the not knowing is the newest thing I own.\nSo: tomorrow. The pen. The mark. The coffee. The dogs.\nThe wind through the walls. The bucket. The lake.\nThe city that processes you and does not slow down.\nThe fight, which looks like a life, because it is one.\nThe flame's still on.\nNobody's cooking.\nSomebody could.", "sig": true, "cats": ["Addiction & Recovery", "Growth & Becoming"]}, {"n": 12, "part": 1, "title": "The Handle", "slug": "the-handle", "stanzas": [["I never left a handle on anything.", "Ask anyone. Every decision I ever delivered", "came kindly and completely and sanded smooth,", "no grip, no edge, nothing for the other person", "to get a hand around and pull.", "That was the craft. That was the whole craft."], ["Except with you.", "With you I left a handle on. On purpose.", "I cut a notch in the one thing I'd never notched", "and I said: here. This is where you hold me.", "I pledged the life. I pledged the hope, which is worse,", "because a life can be paid back in installments", "and hope is a lump sum, cash, no receipt."], ["I put the Norman Rockwell on the table.", "The kitchen. The porch. The two kids and the dog", "who is not a rescue, for once, just a dog.", "I said <em>this is where we're going<\/em> and I meant it", "the way I have meant maybe four things in my life,", "and I built the road, because I build roads,", "and I paved it in your direction."], ["You read the room. You always could.", "Kindness that points toward you, my old friend said,", "is sometimes real and sometimes a distraction,", "and the difference is in the timing and the audience.", "You had the timing. You had the audience.", "And I, who swept every doorway I ever walked through,", "who clocked the exits and the leverage and the lie,", "walked into you with my eyes on the horizon", "and never once looked at the floor."], ["That's the joke. That's the good one.", "A man who could read a general's face at forty yards,", "who could smell a bribe before the envelope came out,", "who learned to spot a wire by how a man holds his beer,", "got taken by the one person he stopped scanning.", "I stopped scanning because that's what love is.", "You told me so. It's in the brochure."], ["What you took wasn't the money. There's always money.", "Not the years. I've lost years before. I've got a system.", "You took the version of me I was going to be", "standing next to you. He was a good guy.", "I'd met him a few times. I was looking forward to him.", "He's gone now. He didn't leave a note.", "He just isn't coming, and I keep setting a place."], ["Horses can't be lied to. I've said it my whole life.", "They feel what's true in the body and reject the rest.", "Turns out I'm not a horse. Turns out a man", "will take a hand on the reins that isn't honest", "and call it partnership for years", "if the hand is warm enough", "and he's tired enough", "and the trail is straight enough", "that he stops paying attention."], ["Here's the part I can't fix, so I'll just say it.", "I don't hate you. That's the betrayal in the betrayal.", "Hate would be a handle. I'd have something to hold.", "Instead I've got a smooth, cold, finished thing", "with no grip on it anywhere,", "which is, I'm told, my specialty."], ["You learned it from me.", "You did it better."]], "text": "I never left a handle on anything.\nAsk anyone. Every decision I ever delivered\ncame kindly and completely and sanded smooth,\nno grip, no edge, nothing for the other person\nto get a hand around and pull.\nThat was the craft. That was the whole craft.\nExcept with you.\nWith you I left a handle on. On purpose.\nI cut a notch in the one thing I'd never notched\nand I said: here. This is where you hold me.\nI pledged the life. I pledged the hope, which is worse,\nbecause a life can be paid back in installments\nand hope is a lump sum, cash, no receipt.\nI put the Norman Rockwell on the table.\nThe kitchen. The porch. The two kids and the dog\nwho is not a rescue, for once, just a dog.\nI said this is where we're going and I meant it\nthe way I have meant maybe four things in my life,\nand I built the road, because I build roads,\nand I paved it in your direction.\nYou read the room. You always could.\nKindness that points toward you, my old friend said,\nis sometimes real and sometimes a distraction,\nand the difference is in the timing and the audience.\nYou had the timing. You had the audience.\nAnd I, who swept every doorway I ever walked through,\nwho clocked the exits and the leverage and the lie,\nwalked into you with my eyes on the horizon\nand never once looked at the floor.\nThat's the joke. That's the good one.\nA man who could read a general's face at forty yards,\nwho could smell a bribe before the envelope came out,\nwho learned to spot a wire by how a man holds his beer,\ngot taken by the one person he stopped scanning.\nI stopped scanning because that's what love is.\nYou told me so. It's in the brochure.\nWhat you took wasn't the money. There's always money.\nNot the years. I've lost years before. I've got a system.\nYou took the version of me I was going to be\nstanding next to you. He was a good guy.\nI'd met him a few times. I was looking forward to him.\nHe's gone now. He didn't leave a note.\nHe just isn't coming, and I keep setting a place.\nHorses can't be lied to. I've said it my whole life.\nThey feel what's true in the body and reject the rest.\nTurns out I'm not a horse. Turns out a man\nwill take a hand on the reins that isn't honest\nand call it partnership for years\nif the hand is warm enough\nand he's tired enough\nand the trail is straight enough\nthat he stops paying attention.\nHere's the part I can't fix, so I'll just say it.\nI don't hate you. That's the betrayal in the betrayal.\nHate would be a handle. I'd have something to hold.\nInstead I've got a smooth, cold, finished thing\nwith no grip on it anywhere,\nwhich is, I'm told, my specialty.\nYou learned it from me.\nYou did it better.", "sig": true, "cats": ["Betrayal", "Grief & Loss"]}, {"n": 13, "part": 1, "title": "Two Checks", "slug": "two-checks", "stanzas": [["Lincoln Park. A restaurant too nice for students", "and not nice enough for anyone else.", "Bread basket. Water glasses. Steak, and whatever", "the older one ordered, ordered twice.", "I took out the checkbook. I wrote two checks.", "I slid them across the table between the bread and the water", "like a man passing a note in a class he'd already passed."], ["<em>I can get a job,<\/em> the older one said.", "I said something. I don't remember what.", "Something about architecture. Something about family", "being a building and somebody has to hold up the roof", "and the somebody is always the somebody,", "and the somebody was me,", "and I liked it. God help me, I liked it.", "I liked being the wall."], ["Nine and eight. That's how old they were", "when I walked up the driveway with the news about her", "and they stopped playing and ran over", "and looked up at me with faces that did not yet know", "what a face does when it hears that.", "I told them. I was fourteen.", "I have been telling them things ever since."], ["I paid for the buildings they walked into.", "I paid for the years they spent becoming men.", "I dropped out of the one thing I wanted", "because somebody had to hold it together,", "and the somebody, see above.", "I did not keep a ledger. I want that clear.", "I did not keep a ledger,", "which is why I can't tell you the exact amount", "of what a man is owed for being the wall.", "Nothing, it turns out. The wall is owed nothing.", "The wall is a wall. You lean on it and go inside."], ["And then the roof came down on me instead.", "And I looked around the rubble for the two boys", "whose tuition I wrote between the bread and the water.", "And they were not in the rubble.", "They were not in the doorway.", "They were not on the phone.", "They were somewhere fine. Loyola was fine. DePaul was fine.", "Everything about them, it was generally understood, was fine."], ["I don't know what I expected. A shovel, maybe.", "A hand. A call. A sentence with my name in it", "said to a third party in a tone that wasn't an apology.", "I got the seven-foot pole.", "I got the specific silence of men", "who know exactly what they'd have to say", "and have run the math on saying it", "and found the math unfavorable."], ["They ran the math.", "I taught them the math.", "That's the part that sits in the lower back,", "where the body holds what the mind won't carry.", "I taught them to read a room, to count the cost,", "to be the somebody. And they read the room,", "and they counted the cost, and they decided", "the somebody was not going to be them."], ["Here's the humor. You asked for humor.", "I wrote those checks from a table", "where I would later plan the thing that ended me.", "Same table. Same pen, probably.", "I financed my brothers' futures", "from the same wood where I financed my own past.", "If that's not a punchline I don't know what is.", "I just can't find anyone to laugh."], ["The older one picked up the check with careful hands.", "The younger one put his in his pocket and said nothing.", "They ate like young men eat. Ambition, no ceremony.", "I watched them. I loved them. I still do.", "That's not the problem. That was never the problem.", "The problem is that love was the only thing on the table", "that nobody slid back."]], "text": "Lincoln Park. A restaurant too nice for students\nand not nice enough for anyone else.\nBread basket. Water glasses. Steak, and whatever\nthe older one ordered, ordered twice.\nI took out the checkbook. I wrote two checks.\nI slid them across the table between the bread and the water\nlike a man passing a note in a class he'd already passed.\nI can get a job, the older one said.\nI said something. I don't remember what.\nSomething about architecture. Something about family\nbeing a building and somebody has to hold up the roof\nand the somebody is always the somebody,\nand the somebody was me,\nand I liked it. God help me, I liked it.\nI liked being the wall.\nNine and eight. That's how old they were\nwhen I walked up the driveway with the news about her\nand they stopped playing and ran over\nand looked up at me with faces that did not yet know\nwhat a face does when it hears that.\nI told them. I was fourteen.\nI have been telling them things ever since.\nI paid for the buildings they walked into.\nI paid for the years they spent becoming men.\nI dropped out of the one thing I wanted\nbecause somebody had to hold it together,\nand the somebody, see above.\nI did not keep a ledger. I want that clear.\nI did not keep a ledger,\nwhich is why I can't tell you the exact amount\nof what a man is owed for being the wall.\nNothing, it turns out. The wall is owed nothing.\nThe wall is a wall. You lean on it and go inside.\nAnd then the roof came down on me instead.\nAnd I looked around the rubble for the two boys\nwhose tuition I wrote between the bread and the water.\nAnd they were not in the rubble.\nThey were not in the doorway.\nThey were not on the phone.\nThey were somewhere fine. Loyola was fine. DePaul was fine.\nEverything about them, it was generally understood, was fine.\nI don't know what I expected. A shovel, maybe.\nA hand. A call. A sentence with my name in it\nsaid to a third party in a tone that wasn't an apology.\nI got the seven-foot pole.\nI got the specific silence of men\nwho know exactly what they'd have to say\nand have run the math on saying it\nand found the math unfavorable.\nThey ran the math.\nI taught them the math.\nThat's the part that sits in the lower back,\nwhere the body holds what the mind won't carry.\nI taught them to read a room, to count the cost,\nto be the somebody. And they read the room,\nand they counted the cost, and they decided\nthe somebody was not going to be them.\nHere's the humor. You asked for humor.\nI wrote those checks from a table\nwhere I would later plan the thing that ended me.\nSame table. Same pen, probably.\nI financed my brothers' futures\nfrom the same wood where I financed my own past.\nIf that's not a punchline I don't know what is.\nI just can't find anyone to laugh.\nThe older one picked up the check with careful hands.\nThe younger one put his in his pocket and said nothing.\nThey ate like young men eat. Ambition, no ceremony.\nI watched them. I loved them. I still do.\nThat's not the problem. That was never the problem.\nThe problem is that love was the only thing on the table\nthat nobody slid back.", "sig": true, "cats": ["Betrayal", "Fatherhood & Duty"]}, {"n": 14, "part": 1, "title": "Load-Bearing", "slug": "load-bearing", "stanzas": [["In our house, loyalty was not a virtue.", "It was the plumbing. You did not thank it.", "You did not discuss it. You did not leave,", "because leaving was a verb our family", "had never bothered to conjugate.", "My father built that. My father, who left.", "The rules outlast the man. The building outlasts the architect.", "I walked those halls every day of my life."], ["So when I raised them, I raised them in that building.", "Fed them the plumbing. Taught them the walls.", "Said: this is what a brother does. He shows up.", "He shows up before he's asked, because being asked", "is not the trigger. The need is the trigger.", "You see the ribs, you stop the truck.", "That's the whole religion. I didn't make it up.", "I just made sure they had it memorized."], ["They memorized it.", "They can recite it, I'm sure, at dinner,", "to their own kids, with feeling.", "<em>Your uncle taught us that.<\/em> I bet they say that.", "I bet it lands."], ["Because here's what I got wrong about walls.", "I thought if I was the load-bearing one,", "the others would learn to bear load.", "That's not how buildings work. That's not how anything works.", "If one wall carries everything,", "the other walls learn exactly one thing,", "which is that they don't have to."], ["I taught them I would hold it.", "I taught it so well", "that when I finally couldn't,", "they had no idea what the sound was.", "They thought it was weather.", "They checked the driveway and went back inside."], ["I'm not asking for the money. Let me say that plainly.", "I never once, not one time, asked for it back.", "I'm not asking for the years, or the school I left,", "or the somebody I became so they wouldn't have to.", "I'm asking for one thing and it's so small", "it's almost funny, and here it is:", "I wanted them to stand in my doorway", "the way I stood in theirs when they were nine and eight", "and say the hard thing to my face.", "That's it. That's the invoice. A doorway. A face."], ["Instead I got the architecture of family,", "which is a phrase I used to say with pride,", "and which I now understand", "is what people call the building", "after the wall that held it up", "has been quietly removed from the plans", "and everyone agrees it was always this way."], ["I'm still standing. I want that noted.", "Not because they're holding me up.", "Because I'm a wall. It's the only thing I know how to be.", "A wall does not get to choose its building.", "A wall does not get to ask the roof", "why the roof stopped calling.", "A wall just stands there, in the wind,", "in the middle of a house that used to be full,", "carrying whatever's left", "and pretending the weight is a choice."], ["It's not a choice.", "It's load.", "I was built for it.", "They were built by it.", "There's the difference.", "There's the whole damn difference."]], "text": "In our house, loyalty was not a virtue.\nIt was the plumbing. You did not thank it.\nYou did not discuss it. You did not leave,\nbecause leaving was a verb our family\nhad never bothered to conjugate.\nMy father built that. My father, who left.\nThe rules outlast the man. The building outlasts the architect.\nI walked those halls every day of my life.\nSo when I raised them, I raised them in that building.\nFed them the plumbing. Taught them the walls.\nSaid: this is what a brother does. He shows up.\nHe shows up before he's asked, because being asked\nis not the trigger. The need is the trigger.\nYou see the ribs, you stop the truck.\nThat's the whole religion. I didn't make it up.\nI just made sure they had it memorized.\nThey memorized it.\nThey can recite it, I'm sure, at dinner,\nto their own kids, with feeling.\nYour uncle taught us that. I bet they say that.\nI bet it lands.\nBecause here's what I got wrong about walls.\nI thought if I was the load-bearing one,\nthe others would learn to bear load.\nThat's not how buildings work. That's not how anything works.\nIf one wall carries everything,\nthe other walls learn exactly one thing,\nwhich is that they don't have to.\nI taught them I would hold it.\nI taught it so well\nthat when I finally couldn't,\nthey had no idea what the sound was.\nThey thought it was weather.\nThey checked the driveway and went back inside.\nI'm not asking for the money. Let me say that plainly.\nI never once, not one time, asked for it back.\nI'm not asking for the years, or the school I left,\nor the somebody I became so they wouldn't have to.\nI'm asking for one thing and it's so small\nit's almost funny, and here it is:\nI wanted them to stand in my doorway\nthe way I stood in theirs when they were nine and eight\nand say the hard thing to my face.\nThat's it. That's the invoice. A doorway. A face.\nInstead I got the architecture of family,\nwhich is a phrase I used to say with pride,\nand which I now understand\nis what people call the building\nafter the wall that held it up\nhas been quietly removed from the plans\nand everyone agrees it was always this way.\nI'm still standing. I want that noted.\nNot because they're holding me up.\nBecause I'm a wall. It's the only thing I know how to be.\nA wall does not get to choose its building.\nA wall does not get to ask the roof\nwhy the roof stopped calling.\nA wall just stands there, in the wind,\nin the middle of a house that used to be full,\ncarrying whatever's left\nand pretending the weight is a choice.\nIt's not a choice.\nIt's load.\nI was built for it.\nThey were built by it.\nThere's the difference.\nThere's the whole damn difference.", "sig": true, "cats": ["Betrayal", "Fatherhood & Duty", "Honor & Character"]}, {"n": 15, "part": 2, "title": "The river does not apologize", "slug": "the-river-does-not-apologize", "stanzas": [["Stop apologizing for gentleness,", "as if the river should be sorry", "for bringing water to the low fields,", "as if the porch light should ask pardon."], ["A steady hand is not weakness.", "It is what the work requires."]], "text": "Stop apologizing for gentleness,\nas if the river should be sorry\nfor bringing water to the low fields,\nas if the porch light should ask pardon.\nA steady hand is not weakness.\nIt is what the work requires.", "sig": true, "cats": ["Fortitude & Gentleness", "Worth & Belonging"]}, {"n": 16, "part": 2, "title": "You are allowed to be gentle", "slug": "you-are-allowed-to-be-gentle", "stanzas": [["The world taught you to harden,", "to hold the line and never flinch."], ["Gentleness is not what is left when strength fails.", "It is the heavier tool, chosen."]], "text": "The world taught you to harden,\nto hold the line and never flinch.\nGentleness is not what is left when strength fails.\nIt is the heavier tool, chosen.", "sig": true, "cats": ["Fortitude & Gentleness", "Honor & Character"]}, {"n": 17, "part": 2, "title": "Do not become the cold", "slug": "do-not-become-the-cold", "stanzas": [["I have seen an orchard take the frost", "and set heavy fruit in June.", "It forgives the winter by bearing."], ["Gentleness is not the soft part of a man.", "It is the part that holds."]], "text": "I have seen an orchard take the frost\nand set heavy fruit in June.\nIt forgives the winter by bearing.\nGentleness is not the soft part of a man.\nIt is the part that holds.", "sig": true, "cats": ["Fortitude & Gentleness", "Grace & Self-Forgiveness", "Nature as Teacher"]}, {"n": 18, "part": 2, "title": "Sowing in winter", "slug": "sowing-in-winter", "stanzas": [["You talk about tomorrow like a coming flood.", "Yet you leave five dollars on the diner table", "and fix the loose hinge on the screen door."], ["You put seed in the ground with frost still on it.", "A man expecting the end of the world", "does not bother with the door."]], "text": "You talk about tomorrow like a coming flood.\nYet you leave five dollars on the diner table\nand fix the loose hinge on the screen door.\nYou put seed in the ground with frost still on it.\nA man expecting the end of the world\ndoes not bother with the door.", "sig": true, "cats": ["Fortitude & Gentleness", "Growth & Becoming"]}, {"n": 19, "part": 2, "title": "Tempered, not hardened", "slug": "tempered-not-hardened", "stanzas": [["The fire does not make a man strong.", "Heat makes iron hard,", "and a brittle blade snaps on the first swing."], ["You are strong because you took the heat", "and still know how to bend.", "You can hold a child's hand", "without closing yours into a fist."]], "text": "The fire does not make a man strong.\nHeat makes iron hard,\nand a brittle blade snaps on the first swing.\nYou are strong because you took the heat\nand still know how to bend.\nYou can hold a child's hand\nwithout closing yours into a fist.", "sig": true, "cats": ["Fortitude & Gentleness", "Healing & Endurance"]}, {"n": 20, "part": 2, "title": "Let the weather come", "slug": "let-the-weather-come", "stanzas": [["The field takes what the sky sends.", "It takes the long rain and the frost,", "and by harvest is more itself, not less."], ["Stand in it.", "No weather stays.", "What you are meant to be", "is whatever is still standing", "when the snow starts."]], "text": "The field takes what the sky sends.\nIt takes the long rain and the frost,\nand by harvest is more itself, not less.\nStand in it.\nNo weather stays.\nWhat you are meant to be\nis whatever is still standing\nwhen the snow starts.", "sig": true, "cats": ["Fortitude & Gentleness", "Nature as Teacher", "Growth & Becoming"]}, {"n": 21, "part": 2, "title": "Keep what they could not hold", "slug": "keep-what-they-could-not-hold", "stanzas": [["Keep the gentleness you carried", "through hands that did not know its worth.", "It was not theirs to keep, or to break."], ["The field lies bare the whole of winter", "and remembers the wheat by spring."]], "text": "Keep the gentleness you carried\nthrough hands that did not know its worth.\nIt was not theirs to keep, or to break.\nThe field lies bare the whole of winter\nand remembers the wheat by spring.", "sig": true, "cats": ["Fortitude & Gentleness", "Healing & Endurance", "Nature as Teacher"]}, {"n": 22, "part": 2, "title": "The door left unbarred", "slug": "the-door-left-unbarred", "stanzas": [["Remember the cost to leave the door unbarred", "after what once came through it.", "Any man can throw a bolt.", "You kept yours open."], ["Nothing you did took more nerve."]], "text": "Remember the cost to leave the door unbarred\nafter what once came through it.\nAny man can throw a bolt.\nYou kept yours open.\nNothing you did took more nerve.", "sig": true, "cats": ["Fortitude & Gentleness", "Honor & Character"]}, {"n": 23, "part": 2, "title": "Kindness after the blow", "slug": "kindness-after-the-blow", "stanzas": [["You were not strong enough to keep the pain out.", "No one is."], ["The test came after, when they handed you", "every reason to turn to stone, and you set them down.", "You stayed kind in a bitter place.", "That is the harder discipline."]], "text": "You were not strong enough to keep the pain out.\nNo one is.\nThe test came after, when they handed you\nevery reason to turn to stone, and you set them down.\nYou stayed kind in a bitter place.\nThat is the harder discipline.", "sig": true, "cats": ["Fortitude & Gentleness", "Healing & Endurance", "Honor & Character"]}, {"n": 24, "part": 2, "title": "What the break did not take", "slug": "what-the-break-did-not-take", "stanzas": [["Anyone can come out of a loss with harder hands.", "That was never the work."], ["The work is the part the break did not reach.", "You still open the door. You still answer the call.", "The difference was not the armor.", "It was the part you refused to cover."]], "text": "Anyone can come out of a loss with harder hands.\nThat was never the work.\nThe work is the part the break did not reach.\nYou still open the door. You still answer the call.\nThe difference was not the armor.\nIt was the part you refused to cover.", "sig": true, "cats": ["Fortitude & Gentleness", "Healing & Endurance"]}, {"n": 25, "part": 2, "title": "No apology for the shade", "slug": "no-apology-for-the-shade", "stanzas": [["The oak owes no one an explanation", "for the shade it throws across the yard.", "The well is not sorry for the water", "it gives to whoever lowers the bucket."], ["Gentleness is not a leak in a man.", "It is what he built himself to hold."]], "text": "The oak owes no one an explanation\nfor the shade it throws across the yard.\nThe well is not sorry for the water\nit gives to whoever lowers the bucket.\nGentleness is not a leak in a man.\nIt is what he built himself to hold.", "sig": true, "cats": ["Fortitude & Gentleness", "Worth & Belonging", "Honor & Character"]}, {"n": 26, "part": 2, "title": "What the blow did not take", "slug": "what-the-blow-did-not-take", "stanzas": [["Anyone can be hardened.", "The blow does that on its own.", "The rarer thing is the man who takes it", "and still lowers his voice for a toddler,", "still opens his hand to feed a stray,", "still chooses the quiet room when shouting is easy."], ["Strength was never the question.", "The question is what you kept."]], "text": "Anyone can be hardened.\nThe blow does that on its own.\nThe rarer thing is the man who takes it\nand still lowers his voice for a toddler,\nstill opens his hand to feed a stray,\nstill chooses the quiet room when shouting is easy.\nStrength was never the question.\nThe question is what you kept.", "sig": true, "cats": ["Fortitude & Gentleness", "Honor & Character"]}, {"n": 27, "part": 2, "title": "Trust the gentleness in you", "slug": "trust-the-gentleness-in-you", "stanzas": [["Trust the gentleness.", "It has outlasted hands that did not know", "how to hold it, and it is still here.", "It is not a soft metal.", "It is the tempered blade,", "heated, struck, and cooled in oil,", "still careful with what it touches."]], "text": "Trust the gentleness.\nIt has outlasted hands that did not know\nhow to hold it, and it is still here.\nIt is not a soft metal.\nIt is the tempered blade,\nheated, struck, and cooled in oil,\nstill careful with what it touches.", "sig": true, "cats": ["Fortitude & Gentleness", "Worth & Belonging"]}, {"n": 28, "part": 2, "title": "Feeling deeply is not the flaw", "slug": "feeling-deeply-is-not-the-flaw", "stanzas": [["The man who notices the flinch,", "the scrape of a chair,", "the silence at the dinner table,", "is carrying more than the man who does not."], ["Call it what it is.", "Not a weakness.", "Strength that has learned to keep its voice down."]], "text": "The man who notices the flinch,\nthe scrape of a chair,\nthe silence at the dinner table,\nis carrying more than the man who does not.\nCall it what it is.\nNot a weakness.\nStrength that has learned to keep its voice down.", "sig": true, "cats": ["Fortitude & Gentleness", "Worth & Belonging"]}, {"n": 29, "part": 2, "title": "Strength is what you kept open", "slug": "strength-is-what-you-kept-open", "stanzas": [["Do not measure yourself by the walls.", "Any man can stack brick", "after the first blow lands.", "Measure what you left open on purpose."], ["The hand that still unclenches,", "the front door you still answer,", "the voice you never let harden.", "That took more than the masonry."]], "text": "Do not measure yourself by the walls.\nAny man can stack brick\nafter the first blow lands.\nMeasure what you left open on purpose.\nThe hand that still unclenches,\nthe front door you still answer,\nthe voice you never let harden.\nThat took more than the masonry.", "sig": true, "cats": ["Fortitude & Gentleness", "Honor & Character"]}, {"n": 30, "part": 2, "title": "Gentleness is a decision", "slug": "gentleness-is-a-decision", "stanzas": [["Do not mistake a quiet hand for a weak one.", "The river takes its time and carves the limestone.", "A man who could strike and does not", "carries more in his open palm", "than a fist ever held."]], "text": "Do not mistake a quiet hand for a weak one.\nThe river takes its time and carves the limestone.\nA man who could strike and does not\ncarries more in his open palm\nthan a fist ever held.", "sig": true, "cats": ["Fortitude & Gentleness", "Honor & Character"]}, {"n": 31, "part": 2, "title": "Do not apologize for gentleness", "slug": "do-not-apologize-for-gentleness", "stanzas": [["The rain does not feel shame", "for watering the neighbor's wheat.", "The sun does not ask permission", "before it warms a stranger's neck on the train.", "A gentle hand is not a flaw in a man.", "It is a discipline he kept."]], "text": "The rain does not feel shame\nfor watering the neighbor's wheat.\nThe sun does not ask permission\nbefore it warms a stranger's neck on the train.\nA gentle hand is not a flaw in a man.\nIt is a discipline he kept.", "sig": true, "cats": ["Fortitude & Gentleness", "Honor & Character"]}, {"n": 32, "part": 2, "title": "When you love more than comes back to you", "slug": "when-you-love-more-than-comes-back-to-you", "stanzas": [["It is how an oak is built.", "The roots push further into the dark dirt", "than any branch reaches into the air.", "The trunk stands on what you cannot see."]], "text": "It is how an oak is built.\nThe roots push further into the dark dirt\nthan any branch reaches into the air.\nThe trunk stands on what you cannot see.", "sig": true, "cats": ["Fortitude & Gentleness", "Worth & Belonging", "Healing & Endurance"]}, {"n": 33, "part": 2, "title": "The bravest thing you ever did", "slug": "the-bravest-thing-you-ever-did", "stanzas": [["It was not what you took.", "It was what you kept open afterward.", "The front door.", "The hand resting on the table."]], "text": "It was not what you took.\nIt was what you kept open afterward.\nThe front door.\nThe hand resting on the table.", "sig": true, "cats": ["Fortitude & Gentleness", "Honor & Character"]}, {"n": 34, "part": 2, "title": "When the name you carry grows heavy", "slug": "when-the-name-you-carry-grows-heavy", "stanzas": [["Lie flat on the dirt.", "The earth has taken the weight", "of every man who ever knelt on it.", "It asked him nothing.", "It held him until he stood,", "then let him walk away."]], "text": "Lie flat on the dirt.\nThe earth has taken the weight\nof every man who ever knelt on it.\nIt asked him nothing.\nIt held him until he stood,\nthen let him walk away.", "sig": true, "cats": ["Fortitude & Gentleness", "Healing & Endurance", "Nature as Teacher"]}, {"n": 35, "part": 2, "title": "What survives rough hands", "slug": "what-survives-rough-hands", "stanzas": [["The quiet in you was never weak.", "It outlasted men who did not know", "how to hold a delicate thing."], ["Trust it the way you trust a March field.", "Under the frost and the flattened stems", "the roots are already pulling water."]], "text": "The quiet in you was never weak.\nIt outlasted men who did not know\nhow to hold a delicate thing.\nTrust it the way you trust a March field.\nUnder the frost and the flattened stems\nthe roots are already pulling water.", "sig": true, "cats": ["Fortitude & Gentleness", "Healing & Endurance", "Nature as Teacher"]}, {"n": 36, "part": 2, "title": "What it did not take", "slug": "what-it-did-not-take", "stanzas": [["It is not the iron it left in you.", "Not the anvil you learned to lift", "without making a sound."], ["It is what you refused to surrender.", "The open hand.", "The level voice."]], "text": "It is not the iron it left in you.\nNot the anvil you learned to lift\nwithout making a sound.\nIt is what you refused to surrender.\nThe open hand.\nThe level voice.", "sig": true, "cats": ["Fortitude & Gentleness", "Healing & Endurance"]}, {"n": 37, "part": 2, "title": "Hope is a discipline", "slug": "hope-is-a-discipline", "stanzas": [["Worry is the imagination losing its faith.", "Hope is the same imagination", "ordered back to its post."]], "text": "Worry is the imagination losing its faith.\nHope is the same imagination\nordered back to its post.", "sig": true, "cats": ["Fortitude & Gentleness", "Faith & Reverence"]}, {"n": 38, "part": 2, "title": "After all of it", "slug": "after-all-of-it", "stanzas": [["After the years that asked for more than you had,", "if you can still be moved,", "if a stranger's trouble still reaches you,", "if your hand is still open and not a fist,", "that is enough.", "That is the whole account."]], "text": "After the years that asked for more than you had,\nif you can still be moved,\nif a stranger's trouble still reaches you,\nif your hand is still open and not a fist,\nthat is enough.\nThat is the whole account.", "sig": true, "cats": ["Fortitude & Gentleness", "Grace & Self-Forgiveness"]}, {"n": 39, "part": 2, "title": "The strongest kind of man", "slug": "the-strongest-kind-of-man", "stanzas": [["Any man can go hard.", "It costs him nothing.", "The rare one carries the years on his back", "and still sets a coffee cup down without a sound.", "If your hands have borne that much", "and stayed careful,", "you are the strongest kind there is."]], "text": "Any man can go hard.\nIt costs him nothing.\nThe rare one carries the years on his back\nand still sets a coffee cup down without a sound.\nIf your hands have borne that much\nand stayed careful,\nyou are the strongest kind there is.", "sig": true, "cats": ["Fortitude & Gentleness", "Honor & Character"]}, {"n": 40, "part": 2, "title": "Let it begin with your hands", "slug": "let-it-begin-with-your-hands", "stanzas": [["Notice the dew set down on the grass", "before anyone is awake.", "Notice the spring wind carrying a cardinal's song", "across the yard,", "and the oak tree holding a place", "for whoever needs to sit."], ["On the days when kindness seems too far off to reach,", "look at your own two hands.", "They have carried worse than this.", "Put them to work."]], "text": "Notice the dew set down on the grass\nbefore anyone is awake.\nNotice the spring wind carrying a cardinal's song\nacross the yard,\nand the oak tree holding a place\nfor whoever needs to sit.\nOn the days when kindness seems too far off to reach,\nlook at your own two hands.\nThey have carried worse than this.\nPut them to work.", "sig": true, "cats": ["Fortitude & Gentleness", "Nature as Teacher"]}, {"n": 41, "part": 2, "title": "Put the stones down", "slug": "put-the-stones-down", "stanzas": [["You do not have to prove your strength", "to anyone after being broken.", "You do not have to stack walls around yourself", "with hands that have already worked too hard."], ["Put the stones down.", "Tend what is still standing at your feet,", "the small green shoots that came through", "the same winter you did.", "It was never about how hard the hurt made you.", "It was about how much gentleness you kept", "when freezing would have been easier."]], "text": "You do not have to prove your strength\nto anyone after being broken.\nYou do not have to stack walls around yourself\nwith hands that have already worked too hard.\nPut the stones down.\nTend what is still standing at your feet,\nthe small green shoots that came through\nthe same winter you did.\nIt was never about how hard the hurt made you.\nIt was about how much gentleness you kept\nwhen freezing would have been easier.", "sig": true, "cats": ["Fortitude & Gentleness", "Healing & Endurance", "Grace & Self-Forgiveness"]}, {"n": 42, "part": 2, "title": "Gentleness is not weakness", "slug": "gentleness-is-not-weakness", "stanzas": [["Gentleness is not weakness.", "It is the quiet nerve of every field", "that greens again after the fire", "has had its say."]], "text": "Gentleness is not weakness.\nIt is the quiet nerve of every field\nthat greens again after the fire\nhas had its say.", "sig": true, "cats": ["Fortitude & Gentleness", "Nature as Teacher"]}, {"n": 43, "part": 2, "title": "The measure was never hardness", "slug": "the-measure-was-never-hardness", "stanzas": [["The measure was never how hard the fire made you.", "Good steel takes the blow,", "bends,", "and comes back true."]], "text": "The measure was never how hard the fire made you.\nGood steel takes the blow,\nbends,\nand comes back true.", "sig": true, "cats": ["Fortitude & Gentleness", "Healing & Endurance", "Honor & Character"]}, {"n": 44, "part": 2, "title": "If the door still opens", "slug": "if-the-door-still-opens", "stanzas": [["After all of it,", "if your front door still opens when a neighbor knocks,", "if you still get out of the chair and answer,", "that is enough.", "That was the whole of the work."]], "text": "After all of it,\nif your front door still opens when a neighbor knocks,\nif you still get out of the chair and answer,\nthat is enough.\nThat was the whole of the work.", "sig": true, "cats": ["Fortitude & Gentleness", "Worth & Belonging"]}, {"n": 45, "part": 2, "title": "The bravest thing you did", "slug": "the-bravest-thing-you-did", "stanzas": [["When they tally what you stood through,", "the bravest thing you ever did", "was not the ground you held.", "It was the front door you left unbolted", "after you had every reason to slide the iron home."]], "text": "When they tally what you stood through,\nthe bravest thing you ever did\nwas not the ground you held.\nIt was the front door you left unbolted\nafter you had every reason to slide the iron home.", "sig": true, "cats": ["Fortitude & Gentleness", "Honor & Character"]}, {"n": 46, "part": 2, "title": "Not how strong it made you", "slug": "not-how-strong-it-made-you", "stanzas": [["Anything left in a fire comes out harder.", "That is not the measure.", "It is what you carried out unburnt.", "The even voice.", "The open hand.", "The mercy you still had for the next man in line."]], "text": "Anything left in a fire comes out harder.\nThat is not the measure.\nIt is what you carried out unburnt.\nThe even voice.\nThe open hand.\nThe mercy you still had for the next man in line.", "sig": true, "cats": ["Fortitude & Gentleness", "Healing & Endurance"]}, {"n": 47, "part": 2, "title": "Look at you, still standing", "slug": "look-at-you-still-standing", "stanzas": [["The whole load on your back.", "Nothing set down,", "nothing handed off.", "And still you find the sun", "and turn your face to it."]], "text": "The whole load on your back.\nNothing set down,\nnothing handed off.\nAnd still you find the sun\nand turn your face to it.", "sig": true, "cats": ["Fortitude & Gentleness", "Healing & Endurance"]}, {"n": 48, "part": 2, "title": "What if the measure was never strength", "slug": "what-if-the-measure-was-never-strength", "stanzas": [["What if the measure was never", "how hard it made you,", "but how much you carried out", "with your hands still open."]], "text": "What if the measure was never\nhow hard it made you,\nbut how much you carried out\nwith your hands still open.", "sig": true, "cats": ["Fortitude & Gentleness", "Healing & Endurance"]}, {"n": 49, "part": 2, "title": "A gentle man was not spared", "slug": "a-gentle-man-was-not-spared", "stanzas": [["A gentle man is not one", "the world went easy on.", "He has met all of it,", "and refused it a room in his house."]], "text": "A gentle man is not one\nthe world went easy on.\nHe has met all of it,\nand refused it a room in his house.", "sig": true, "cats": ["Fortitude & Gentleness", "Honor & Character"]}, {"n": 50, "part": 2, "title": "What held the wall", "slug": "what-held-the-wall", "stanzas": [["What if the gentleness in you", "was never the crack in the wall,", "but the mortar.", "The thing that held the stones", "when everything else gave way."]], "text": "What if the gentleness in you\nwas never the crack in the wall,\nbut the mortar.\nThe thing that held the stones\nwhen everything else gave way.", "sig": true, "cats": ["Fortitude & Gentleness", "Healing & Endurance"]}, {"n": 51, "part": 2, "title": "The strength it took", "slug": "the-strength-it-took", "stanzas": [["Gentleness is not the absence of strength.", "Consider what he walked through,", "what it should have made of him,", "and what he chose to remain."], ["Staying gentle was the harder work."]], "text": "Gentleness is not the absence of strength.\nConsider what he walked through,\nwhat it should have made of him,\nand what he chose to remain.\nStaying gentle was the harder work.", "sig": true, "cats": ["Fortitude & Gentleness", "Honor & Character"]}, {"n": 52, "part": 2, "title": "Keep your heart from hardening", "slug": "keep-your-heart-from-hardening", "stanzas": [["Keep your heart from hardening.", "Kindness is always looking", "for steady ground to land on.", "Be that ground."]], "text": "Keep your heart from hardening.\nKindness is always looking\nfor steady ground to land on.\nBe that ground.", "sig": true, "cats": ["Fortitude & Gentleness", "Honor & Character"]}, {"n": 53, "part": 3, "title": "Only to keep turning", "slug": "only-to-keep-turning", "stanzas": [["Winter has settled on you", "like a coat you never bought", "and cannot take off."], ["Each morning you find which way is south", "by the half of the roof the frost quits first,", "and set your face to it."], ["No one asked you to be warm yet.", "Only to keep turning."]], "text": "Winter has settled on you\nlike a coat you never bought\nand cannot take off.\nEach morning you find which way is south\nby the half of the roof the frost quits first,\nand set your face to it.\nNo one asked you to be warm yet.\nOnly to keep turning.", "sig": true, "cats": ["Healing & Endurance", "Fortitude & Gentleness"]}, {"n": 54, "part": 3, "title": "Let the body do its part", "slug": "let-the-body-do-its-part", "stanzas": [["A man who blocks the wind", "still has to stand in it."], ["When your hands shake after the fact,", "do not call it weakness.", "The body is only taking its share of a load", "you refused to put down."]], "text": "A man who blocks the wind\nstill has to stand in it.\nWhen your hands shake after the fact,\ndo not call it weakness.\nThe body is only taking its share of a load\nyou refused to put down.", "sig": true, "cats": ["Healing & Endurance", "Fortitude & Gentleness"]}, {"n": 55, "part": 3, "title": "Let it move through", "slug": "let-it-move-through", "stanzas": [["The ache of the year is a river, not a lake.", "Dam it up in your chest", "and it will flood the basement."], ["Give it a channel.", "Sit on the back step. Look at the pines.", "Let the water pass."]], "text": "The ache of the year is a river, not a lake.\nDam it up in your chest\nand it will flood the basement.\nGive it a channel.\nSit on the back step. Look at the pines.\nLet the water pass.", "sig": true, "cats": ["Healing & Endurance", "Nature as Teacher"]}, {"n": 56, "part": 3, "title": "Healing is not the pain leaving", "slug": "healing-is-not-the-pain-leaving", "stanzas": [["I used to think a fixed bone would stop hurting.", "It aches every time it rains."], ["Healing is not a clean slate.", "It is pulling out a chair at the kitchen table,", "letting the grief sit down with you,", "and pouring the coffee anyway."]], "text": "I used to think a fixed bone would stop hurting.\nIt aches every time it rains.\nHealing is not a clean slate.\nIt is pulling out a chair at the kitchen table,\nletting the grief sit down with you,\nand pouring the coffee anyway.", "sig": true, "cats": ["Healing & Endurance", "Fortitude & Gentleness", "Faith & Reverence"]}, {"n": 57, "part": 3, "title": "What the dark still holds", "slug": "what-the-dark-still-holds", "stanzas": [["It may not be as bad as it looks.", "I have stood in nights I was sure were empty,", "looking east for a sun that keeps its own hours,", "and missed the porch light two doors down,", "the neighbor's cigarette on his back step,", "the kitchen window somebody left burning."], ["Kindness keeps the same hours as the dark.", "Turn your back on the sun a minute.", "Your eyes will find the rest."]], "text": "It may not be as bad as it looks.\nI have stood in nights I was sure were empty,\nlooking east for a sun that keeps its own hours,\nand missed the porch light two doors down,\nthe neighbor's cigarette on his back step,\nthe kitchen window somebody left burning.\nKindness keeps the same hours as the dark.\nTurn your back on the sun a minute.\nYour eyes will find the rest.", "sig": true, "cats": ["Healing & Endurance", "Nature as Teacher"]}, {"n": 58, "part": 3, "title": "What did not harden", "slug": "what-did-not-harden", "stanzas": [["Healing is not forgetting the fire.", "It is standing on the far side of it", "and finding your hands still open,", "your voice still low,", "your word still good."], ["The heat had every chance to turn you to iron.", "That it did not is the whole difference."]], "text": "Healing is not forgetting the fire.\nIt is standing on the far side of it\nand finding your hands still open,\nyour voice still low,\nyour word still good.\nThe heat had every chance to turn you to iron.\nThat it did not is the whole difference.", "sig": true, "cats": ["Healing & Endurance", "Fortitude & Gentleness"]}, {"n": 59, "part": 3, "title": "Set the bone first", "slug": "set-the-bone-first", "stanzas": [["You chose to mend before you moved,", "to set the bone before you put weight on it.", "Call that patience, not delay."], ["A man who means to walk the whole road", "makes sure the leg will hold."]], "text": "You chose to mend before you moved,\nto set the bone before you put weight on it.\nCall that patience, not delay.\nA man who means to walk the whole road\nmakes sure the leg will hold.", "sig": true, "cats": ["Healing & Endurance", "Growth & Becoming", "Rest & Stillness"]}, {"n": 60, "part": 3, "title": "Put down the act", "slug": "put-down-the-act", "stanzas": [["Healing is not forgetting.", "It is putting down the act."], ["A man can walk around for years", "with one hand pressed to his side,", "lift the couch one-armed,", "never say why, not to anyone,", "not at night, not to the ceiling,", "and call that strength.", "He is the only one it fools."], ["Say it plainly. That hurt.", "The hand comes away on its own."]], "text": "Healing is not forgetting.\nIt is putting down the act.\nA man can walk around for years\nwith one hand pressed to his side,\nlift the couch one-armed,\nnever say why, not to anyone,\nnot at night, not to the ceiling,\nand call that strength.\nHe is the only one it fools.\nSay it plainly. That hurt.\nThe hand comes away on its own.", "sig": true, "cats": ["Healing & Endurance", "Grace & Self-Forgiveness", "Honor & Character"]}, {"n": 61, "part": 3, "title": "The reason came after", "slug": "the-reason-came-after", "stanzas": [["Nothing sent the storm.", "Some things just fall,", "and there is no reason in the falling."], ["The reason came after,", "when you knelt in the wet dirt", "and built something a man could stand on."]], "text": "Nothing sent the storm.\nSome things just fall,\nand there is no reason in the falling.\nThe reason came after,\nwhen you knelt in the wet dirt\nand built something a man could stand on.", "sig": true, "cats": ["Healing & Endurance", "Growth & Becoming"]}, {"n": 62, "part": 3, "title": "Not to make you stronger", "slug": "not-to-make-you-stronger", "stanzas": [["The break was not sent to make you stronger.", "It only split the wood to show what held it together.", "The oak takes lightning down one side", "and comes up green in April anyway."], ["Nothing good left when it split.", "It only needed the light."]], "text": "The break was not sent to make you stronger.\nIt only split the wood to show what held it together.\nThe oak takes lightning down one side\nand comes up green in April anyway.\nNothing good left when it split.\nIt only needed the light.", "sig": true, "cats": ["Healing & Endurance", "Grief & Loss", "Nature as Teacher"]}, {"n": 63, "part": 3, "title": "The weight no one lifted", "slug": "the-weight-no-one-lifted", "stanzas": [["You are tired the way a beam is tired,", "having held the roof through every storm", "while the house slept beneath it."], ["You carried everyone who asked", "and a few who never did.", "It is no shame to say your arms ache.", "It is the truth about the load."]], "text": "You are tired the way a beam is tired,\nhaving held the roof through every storm\nwhile the house slept beneath it.\nYou carried everyone who asked\nand a few who never did.\nIt is no shame to say your arms ache.\nIt is the truth about the load.", "sig": true, "cats": ["Healing & Endurance", "Fatherhood & Duty", "Fortitude & Gentleness"]}, {"n": 64, "part": 3, "title": "Spring does not ask for an apology", "slug": "spring-does-not-ask-for-an-apology", "stanzas": [["Spring does not ask the winter to apologize for the cold.", "It does not stand at the fence waiting for the frost", "to explain itself."], ["The ground softens, and the work begins.", "Take the thaw as it comes and plant again."]], "text": "Spring does not ask the winter to apologize for the cold.\nIt does not stand at the fence waiting for the frost\nto explain itself.\nThe ground softens, and the work begins.\nTake the thaw as it comes and plant again.", "sig": true, "cats": ["Healing & Endurance", "Seasons & Letters", "Nature as Teacher"]}, {"n": 65, "part": 3, "title": "Count the harvest, not the rain", "slug": "count-the-harvest-not-the-rain", "stanzas": [["Do not measure the years by how hard it rained.", "Rain is only weather.", "Walk the rows instead.", "Count the corn that came up", "out of that mud and stood."], ["That is what shaped you.", "Not the storm. The harvest."]], "text": "Do not measure the years by how hard it rained.\nRain is only weather.\nWalk the rows instead.\nCount the corn that came up\nout of that mud and stood.\nThat is what shaped you.\nNot the storm. The harvest.", "sig": true, "cats": ["Healing & Endurance", "Growth & Becoming", "Nature as Teacher"]}, {"n": 66, "part": 3, "title": "A chair for the pain", "slug": "a-chair-for-the-pain", "stanzas": [["Healing is not prying the ache out", "like a bent nail from a floorboard.", "It is pulling out a wooden chair,", "letting it sit at your table,", "and finishing your plate."], ["It will stay as long as it stays.", "So will you."]], "text": "Healing is not prying the ache out\nlike a bent nail from a floorboard.\nIt is pulling out a wooden chair,\nletting it sit at your table,\nand finishing your plate.\nIt will stay as long as it stays.\nSo will you.", "sig": true, "cats": ["Healing & Endurance", "Fortitude & Gentleness"]}, {"n": 67, "part": 3, "title": "You have not lost the light", "slug": "you-have-not-lost-the-light", "stanzas": [["The sky has been low a long while,", "that is all.", "Wait for one clear night.", "The moon has never seen its own face.", "It only knows it shines by the river,", "by the slate rooftops,", "by the gravel road turned silver to your door."], ["Look at what stands lit around you.", "That is yours."]], "text": "The sky has been low a long while,\nthat is all.\nWait for one clear night.\nThe moon has never seen its own face.\nIt only knows it shines by the river,\nby the slate rooftops,\nby the gravel road turned silver to your door.\nLook at what stands lit around you.\nThat is yours.", "sig": true, "cats": ["Healing & Endurance", "Worth & Belonging", "Nature as Teacher"]}, {"n": 68, "part": 3, "title": "A steady love will find you", "slug": "a-steady-love-will-find-you", "stanzas": [["Believe this, even in February.", "A steady love is on its way.", "Not loud. Not sudden."], ["It will come the way the first warm day comes", "after a winter you were sure would not end,", "when you step out onto the porch without your coat", "and the air, for once, does not fight you."]], "text": "Believe this, even in February.\nA steady love is on its way.\nNot loud. Not sudden.\nIt will come the way the first warm day comes\nafter a winter you were sure would not end,\nwhen you step out onto the porch without your coat\nand the air, for once, does not fight you.", "sig": true, "cats": ["Healing & Endurance", "Worth & Belonging", "Seasons & Letters"]}, {"n": 69, "part": 3, "title": "Not how much, but how", "slug": "not-how-much-but-how", "stanzas": [["It was never the weight you carried.", "Plenty of men stand under worse", "and come out as stone.", "It was how you walked through it.", "You kept a steady hand on your own shoulder", "the whole way down into the cellar,", "and the whole way back up the stairs."]], "text": "It was never the weight you carried.\nPlenty of men stand under worse\nand come out as stone.\nIt was how you walked through it.\nYou kept a steady hand on your own shoulder\nthe whole way down into the cellar,\nand the whole way back up the stairs.", "sig": true, "cats": ["Healing & Endurance", "Fortitude & Gentleness"]}, {"n": 70, "part": 3, "title": "Healing does not remove the weight", "slug": "healing-does-not-remove-the-weight", "stanzas": [["I waited for the pain to leave the house.", "It stayed.", "So I pulled up a second chair.", "I learned to work with it at the table.", "Healing is not the absence of the anvil.", "It is a back that has learned to carry it."]], "text": "I waited for the pain to leave the house.\nIt stayed.\nSo I pulled up a second chair.\nI learned to work with it at the table.\nHealing is not the absence of the anvil.\nIt is a back that has learned to carry it.", "sig": true, "cats": ["Healing & Endurance", "Fortitude & Gentleness"]}, {"n": 71, "part": 3, "title": "Be home when it arrives", "slug": "be-home-when-it-arrives", "stanzas": [["Pain has one use.", "It calls a man back into his own body,", "back to the breath, the knuckles,", "the pine floor under his boots.", "Stay there. Sweep the kitchen.", "Keep the house in order.", "When healing knocks,", "let it find someone home."]], "text": "Pain has one use.\nIt calls a man back into his own body,\nback to the breath, the knuckles,\nthe pine floor under his boots.\nStay there. Sweep the kitchen.\nKeep the house in order.\nWhen healing knocks,\nlet it find someone home.", "sig": true, "cats": ["Healing & Endurance", "Rest & Stillness"]}, {"n": 72, "part": 3, "title": "You do not have to hold it all together", "slug": "you-do-not-have-to-hold-it-all-together", "stanzas": [["You are the field and the weather over it.", "When the rain breaks, let it fall.", "The ground is not weakened by taking water.", "It goes on holding the foundation of the house."]], "text": "You are the field and the weather over it.\nWhen the rain breaks, let it fall.\nThe ground is not weakened by taking water.\nIt goes on holding the foundation of the house.", "sig": true, "cats": ["Healing & Endurance", "Grace & Self-Forgiveness", "Fortitude & Gentleness"]}, {"n": 73, "part": 3, "title": "Give the pain a chair", "slug": "give-the-pain-a-chair", "stanzas": [["Do not rush it out the door.", "Seat it at the table", "like a traveler passing through.", "Let it drink from your cup."], ["A guest kept in a steady house", "sets down his knife in time."]], "text": "Do not rush it out the door.\nSeat it at the table\nlike a traveler passing through.\nLet it drink from your cup.\nA guest kept in a steady house\nsets down his knife in time.", "sig": true, "cats": ["Healing & Endurance", "Fortitude & Gentleness", "Grace & Self-Forgiveness"]}, {"n": 74, "part": 3, "title": "Some days are for holding the line", "slug": "some-days-are-for-holding-the-line", "stanzas": [["Not every day is for growth you can measure.", "Not every sunrise asks you to be more", "than the man you were last night.", "Some days the whole work is to stand", "where you stood,", "and be standing there at dark."]], "text": "Not every day is for growth you can measure.\nNot every sunrise asks you to be more\nthan the man you were last night.\nSome days the whole work is to stand\nwhere you stood,\nand be standing there at dark.", "sig": true, "cats": ["Healing & Endurance", "Grace & Self-Forgiveness"]}, {"n": 75, "part": 3, "title": "How the orchard forgives the frost", "slug": "how-the-orchard-forgives-the-frost", "stanzas": [["Trust your heart to hold its worth after the break,", "the way a mended keel still holds the sea.", "Then learn from the orchard", "how to forgive the frost.", "It does not argue.", "It bears apples again."]], "text": "Trust your heart to hold its worth after the break,\nthe way a mended keel still holds the sea.\nThen learn from the orchard\nhow to forgive the frost.\nIt does not argue.\nIt bears apples again.", "sig": true, "cats": ["Healing & Endurance", "Nature as Teacher", "Grace & Self-Forgiveness"]}, {"n": 76, "part": 3, "title": "One day the ledger balances", "slug": "one-day-the-ledger-balances", "stanzas": [["One day you will sit with the years", "and do the honest accounting.", "You will find nothing went to waste.", "Every loss bought something.", "If what it bought was a man", "who finally treats himself as worth keeping,", "the books close square."]], "text": "One day you will sit with the years\nand do the honest accounting.\nYou will find nothing went to waste.\nEvery loss bought something.\nIf what it bought was a man\nwho finally treats himself as worth keeping,\nthe books close square.", "sig": true, "cats": ["Healing & Endurance", "Grace & Self-Forgiveness", "Growth & Becoming"]}, {"n": 77, "part": 3, "title": "The well still gives", "slug": "the-well-still-gives", "stanzas": [["After the dry years,", "after all that was asked of you and taken,", "lower the bucket.", "If it comes up heavy with water,", "if there is still some for the neighbor who comes thirsty,", "then nothing that matters was lost."]], "text": "After the dry years,\nafter all that was asked of you and taken,\nlower the bucket.\nIf it comes up heavy with water,\nif there is still some for the neighbor who comes thirsty,\nthen nothing that matters was lost.", "sig": true, "cats": ["Healing & Endurance", "Fortitude & Gentleness"]}, {"n": 78, "part": 3, "title": "You do not have to prove it", "slug": "you-do-not-have-to-prove-it", "stanzas": [["After all of it, if you are still kind,", "that is enough.", "You do not have to lay stone around your heart", "with hands gone hard from the work."], ["Tend what is still at your feet.", "The rows that survived.", "The boy who needs you.", "The friend who kept calling."], ["You will not find your proof", "in how hard the pain made you.", "You will find it in what was left standing,", "still gentle, still yours."]], "text": "After all of it, if you are still kind,\nthat is enough.\nYou do not have to lay stone around your heart\nwith hands gone hard from the work.\nTend what is still at your feet.\nThe rows that survived.\nThe boy who needs you.\nThe friend who kept calling.\nYou will not find your proof\nin how hard the pain made you.\nYou will find it in what was left standing,\nstill gentle, still yours.", "sig": true, "cats": ["Healing & Endurance", "Fortitude & Gentleness", "Grace & Self-Forgiveness"]}, {"n": 79, "part": 3, "title": "I told my heart to keep going", "slug": "i-told-my-heart-to-keep-going", "stanzas": [["I told my heart it could keep going.", "It took me at my word.", "I have made harder promises", "and kept them for less reason."]], "text": "I told my heart it could keep going.\nIt took me at my word.\nI have made harder promises\nand kept them for less reason.", "sig": true, "cats": ["Healing & Endurance", "Honor & Character"]}, {"n": 80, "part": 4, "title": "I once thought winter was a boy like me", "slug": "i-once-thought-winter-was-a-boy-like-me", "stanzas": [["restless for spring,", "checking the ground for green."], ["But who is this", "frosting the window,", "carrying what he does not know", "the way a man carries a pocket watch,", "close to the chest, without checking it."], ["He is in no hurry to be understood.", "That is the man I want to be."]], "text": "restless for spring,\nchecking the ground for green.\nBut who is this\nfrosting the window,\ncarrying what he does not know\nthe way a man carries a pocket watch,\nclose to the chest, without checking it.\nHe is in no hurry to be understood.\nThat is the man I want to be.", "sig": true, "cats": ["Growth & Becoming", "Honor & Character", "Seasons & Letters"]}, {"n": 81, "part": 4, "title": "Let me wear the new day", "slug": "let-me-wear-the-new-day", "stanzas": [["the way the pasture wears the dew,", "carrying what fell in the night", "without complaint.", "Let gentleness have the first word", "and resolve the last."]], "text": "the way the pasture wears the dew,\ncarrying what fell in the night\nwithout complaint.\nLet gentleness have the first word\nand resolve the last.", "sig": true, "cats": ["Growth & Becoming", "Fortitude & Gentleness"]}, {"n": 82, "part": 4, "title": "Ask what the fear is made of", "slug": "ask-what-the-fear-is-made-of", "stanzas": [["Are you afraid of the next step,", "or only a stranger to where it lands?"], ["Every road I trust now", "was dirt the first time I walked it.", "Fear and unfamiliarity wear the same heavy coat.", "Take the step. The ground will tell you which."]], "text": "Are you afraid of the next step,\nor only a stranger to where it lands?\nEvery road I trust now\nwas dirt the first time I walked it.\nFear and unfamiliarity wear the same heavy coat.\nTake the step. The ground will tell you which.", "sig": true, "cats": ["Growth & Becoming", "Fortitude & Gentleness"]}, {"n": 83, "part": 4, "title": "The acres you have not walked", "slug": "the-acres-you-have-not-walked", "stanzas": [["You only work the near field.", "The dirt you can see from the porch."], ["There is wind moving in the far acres.", "The deed is in your name.", "Walk out and lie down in the grass you own."]], "text": "You only work the near field.\nThe dirt you can see from the porch.\nThere is wind moving in the far acres.\nThe deed is in your name.\nWalk out and lie down in the grass you own.", "sig": true, "cats": ["Growth & Becoming", "Rest & Stillness", "Nature as Teacher"]}, {"n": 84, "part": 4, "title": "Unfamiliar ground", "slug": "unfamiliar-ground", "stanzas": [["Ask yourself whether it is fear,", "or only that you have never stood there.", "Every good road I have taken", "felt strange under my boots for the first mile."], ["The gravel shifts.", "Strange is not the same as wrong."]], "text": "Ask yourself whether it is fear,\nor only that you have never stood there.\nEvery good road I have taken\nfelt strange under my boots for the first mile.\nThe gravel shifts.\nStrange is not the same as wrong.", "sig": true, "cats": ["Growth & Becoming", "Fortitude & Gentleness"]}, {"n": 85, "part": 4, "title": "The field was never dead", "slug": "the-field-was-never-dead", "stanzas": [["The field was never dead. It was only waiting.", "The roots kept working in the dark", "through months no one looked at them."], ["Whatever you buried to survive the cold", "is moving now beneath the topsoil.", "Give it time to break the dirt."]], "text": "The field was never dead. It was only waiting.\nThe roots kept working in the dark\nthrough months no one looked at them.\nWhatever you buried to survive the cold\nis moving now beneath the topsoil.\nGive it time to break the dirt.", "sig": true, "cats": ["Growth & Becoming", "Seasons & Letters", "Nature as Teacher"]}, {"n": 86, "part": 4, "title": "Patience at the forge", "slug": "patience-at-the-forge", "stanzas": [["Give yourself the patience you give the steel.", "The slow heat, the long wait,", "the strike that comes only when the iron glows orange."], ["Nothing worth holding was hammered cold.", "Take the time the work takes.", "You are the work."]], "text": "Give yourself the patience you give the steel.\nThe slow heat, the long wait,\nthe strike that comes only when the iron glows orange.\nNothing worth holding was hammered cold.\nTake the time the work takes.\nYou are the work.", "sig": true, "cats": ["Growth & Becoming", "Grace & Self-Forgiveness"]}, {"n": 87, "part": 4, "title": "No one calls the wheat slow", "slug": "no-one-calls-the-wheat-slow", "stanzas": [["Winter wheat goes in before the frost", "and sits under the snow for months.", "No farmer stands at the edge of the field calling it slow."], ["Time is not a wage you have to earn.", "It is the dirt you were given.", "Stand in it."]], "text": "Winter wheat goes in before the frost\nand sits under the snow for months.\nNo farmer stands at the edge of the field calling it slow.\nTime is not a wage you have to earn.\nIt is the dirt you were given.\nStand in it.", "sig": true, "cats": ["Growth & Becoming", "Nature as Teacher", "Rest & Stillness"]}, {"n": 88, "part": 4, "title": "Not starting over", "slug": "not-starting-over", "stanzas": [["You are not starting over.", "You are walking back to a man you left standing at the gate,", "the one who held the post while you were gone."], ["He is not angry. He kept the place.", "Shake his hand. You know him."]], "text": "You are not starting over.\nYou are walking back to a man you left standing at the gate,\nthe one who held the post while you were gone.\nHe is not angry. He kept the place.\nShake his hand. You know him.", "sig": true, "cats": ["Growth & Becoming", "Grace & Self-Forgiveness"]}, {"n": 89, "part": 4, "title": "The river keeps its name", "slug": "the-river-keeps-its-name", "stanzas": [["Look for yourself in the river, not the mirror.", "The glass holds still and tells you nothing.", "The water takes your face apart", "and gathers it again.", "It is never the same water,", "and you are never quite the same man."], ["Every season brings a new current,", "every bend shifts the bank,", "and still the river keeps its name.", "It still knows the way down to the gulf."]], "text": "Look for yourself in the river, not the mirror.\nThe glass holds still and tells you nothing.\nThe water takes your face apart\nand gathers it again.\nIt is never the same water,\nand you are never quite the same man.\nEvery season brings a new current,\nevery bend shifts the bank,\nand still the river keeps its name.\nIt still knows the way down to the gulf.", "sig": true, "cats": ["Growth & Becoming", "Nature as Teacher"]}, {"n": 90, "part": 4, "title": "The tools are where you left them", "slug": "the-tools-are-where-you-left-them", "stanzas": [["The life you stopped making plans for has not gone anywhere.", "It is a workshop with the door unlocked,", "the wrenches on the bench,", "the sawdust only sawdust."], ["Go back in. Pick one up.", "The wooden handle will remember your grip."]], "text": "The life you stopped making plans for has not gone anywhere.\nIt is a workshop with the door unlocked,\nthe wrenches on the bench,\nthe sawdust only sawdust.\nGo back in. Pick one up.\nThe wooden handle will remember your grip.", "sig": true, "cats": ["Growth & Becoming", "Healing & Endurance"]}, {"n": 91, "part": 4, "title": "The next step", "slug": "the-next-step", "stanzas": [["Ask yourself plainly.", "Is it the step you fear,", "or the man standing on the far side of the river.", "He has already done what you are still deciding.", "You will not know his name until you cross."]], "text": "Ask yourself plainly.\nIs it the step you fear,\nor the man standing on the far side of the river.\nHe has already done what you are still deciding.\nYou will not know his name until you cross.", "sig": true, "cats": ["Growth & Becoming", "Fortitude & Gentleness"]}, {"n": 92, "part": 4, "title": "Starting over is not defeat", "slug": "starting-over-is-not-defeat", "stanzas": [["The field is turned under every November.", "The forge is banked at night", "and lit again with the sun.", "Nobody calls the farmer a failure.", "Nobody calls the blacksmith a coward.", "Laying the first stone twice", "takes more nerve than laying it once."]], "text": "The field is turned under every November.\nThe forge is banked at night\nand lit again with the sun.\nNobody calls the farmer a failure.\nNobody calls the blacksmith a coward.\nLaying the first stone twice\ntakes more nerve than laying it once.", "sig": true, "cats": ["Growth & Becoming", "Healing & Endurance"]}, {"n": 93, "part": 4, "title": "Remember there is no hurry", "slug": "remember-there-is-no-hurry", "stanzas": [["The ground has waited", "on slower things than a man.", "An elm does not ask your name", "before it drops its shade.", "It drops it on whoever stands there."]], "text": "The ground has waited\non slower things than a man.\nAn elm does not ask your name\nbefore it drops its shade.\nIt drops it on whoever stands there.", "sig": true, "cats": ["Growth & Becoming", "Nature as Teacher", "Rest & Stillness"]}, {"n": 94, "part": 4, "title": "Set the seed in unfamiliar ground", "slug": "set-the-seed-in-unfamiliar-ground", "stanzas": [["Take what you have left", "and press it into a new field.", "Turn the dirt with the spade.", "Wait on the rain."], ["Come back the slow way,", "one green inch at a time."]], "text": "Take what you have left\nand press it into a new field.\nTurn the dirt with the spade.\nWait on the rain.\nCome back the slow way,\none green inch at a time.", "sig": true, "cats": ["Growth & Becoming", "Grace & Self-Forgiveness", "Letting Go"]}, {"n": 95, "part": 4, "title": "A seat at the table", "slug": "a-seat-at-the-table", "stanzas": [["This hard season will not last,", "and neither will the man I am inside it.", "I want to give him room to breathe,", "before the next one takes his place.", "I want to stay on speaking terms", "with every man I have been."], ["When the work is done,", "I hope they sit at one long table in the low light,", "glad I pulled up a chair for this one too.", "Maybe that is what the dark is for.", "Not to find your way back into your body,", "but to gather every man it has had to be."]], "text": "This hard season will not last,\nand neither will the man I am inside it.\nI want to give him room to breathe,\nbefore the next one takes his place.\nI want to stay on speaking terms\nwith every man I have been.\nWhen the work is done,\nI hope they sit at one long table in the low light,\nglad I pulled up a chair for this one too.\nMaybe that is what the dark is for.\nNot to find your way back into your body,\nbut to gather every man it has had to be.", "sig": true, "cats": ["Growth & Becoming", "Healing & Endurance", "Grace & Self-Forgiveness"]}, {"n": 96, "part": 4, "title": "You were never behind", "slug": "you-were-never-behind", "stanzas": [["No one is timing you.", "The sun was never late.", "The river never hurried toward a sea", "that was not going anywhere.", "You were never behind.", "You are only learning to carry", "what is yours."]], "text": "No one is timing you.\nThe sun was never late.\nThe river never hurried toward a sea\nthat was not going anywhere.\nYou were never behind.\nYou are only learning to carry\nwhat is yours.", "sig": true, "cats": ["Growth & Becoming", "Grace & Self-Forgiveness"]}, {"n": 97, "part": 4, "title": "Eighty beats a second", "slug": "eighty-beats-a-second", "stanzas": [["A hummingbird's wings beat eighty times a second.", "The motion vanishes.", "You see a bird holding still in the air", "to hover at one flower and drink.", "The work no one watches", "is what lets you hold steady.", "Do not apologize for the labor it takes", "to arrive at a stillness", "anyone would mistake for ease."]], "text": "A hummingbird's wings beat eighty times a second.\nThe motion vanishes.\nYou see a bird holding still in the air\nto hover at one flower and drink.\nThe work no one watches\nis what lets you hold steady.\nDo not apologize for the labor it takes\nto arrive at a stillness\nanyone would mistake for ease.", "sig": true, "cats": ["Growth & Becoming", "Nature as Teacher"]}, {"n": 98, "part": 4, "title": "Every man I have been", "slug": "every-man-i-have-been", "stanzas": [["This hard season will pass,", "and so will the man standing in it.", "While he is here I want to give him air.", "I leave the line open to every man I have been.", "The one who had nothing,", "the one who nearly quit.", "When the last of the work is done", "we can all stand on the same porch.", "None of us left out in the yard."]], "text": "This hard season will pass,\nand so will the man standing in it.\nWhile he is here I want to give him air.\nI leave the line open to every man I have been.\nThe one who had nothing,\nthe one who nearly quit.\nWhen the last of the work is done\nwe can all stand on the same porch.\nNone of us left out in the yard.", "sig": true, "cats": ["Growth & Becoming", "Grace & Self-Forgiveness"]}, {"n": 99, "part": 4, "title": "The shape already in the iron", "slug": "the-shape-already-in-the-iron", "stanzas": [["The ore does not reach for the blade.", "The blade is in it already,", "waiting on heat and a heavy hammer.", "What you are becoming", "is not a thing to chase down the road.", "It has been walking toward you the whole time,", "carrying your name.", "Your work is not to strain.", "Your work is to stand in the fire", "and let it find you."]], "text": "The ore does not reach for the blade.\nThe blade is in it already,\nwaiting on heat and a heavy hammer.\nWhat you are becoming\nis not a thing to chase down the road.\nIt has been walking toward you the whole time,\ncarrying your name.\nYour work is not to strain.\nYour work is to stand in the fire\nand let it find you.", "sig": true, "cats": ["Growth & Becoming", "Faith & Reverence"]}, {"n": 100, "part": 4, "title": "One day you will see it plainly", "slug": "one-day-you-will-see-it-plainly", "stanzas": [["One day you will see it plainly.", "None of it was lost.", "Not the long hours, not the hard ground,", "if they taught you to speak to yourself", "the way you speak to a man you respect."]], "text": "One day you will see it plainly.\nNone of it was lost.\nNot the long hours, not the hard ground,\nif they taught you to speak to yourself\nthe way you speak to a man you respect.", "sig": true, "cats": ["Growth & Becoming", "Grace & Self-Forgiveness"]}, {"n": 101, "part": 4, "title": "Have patience with yourself", "slug": "have-patience-with-yourself", "stanzas": [["Iron takes its time to cool", "and is stronger for the waiting.", "The road was not laid in a morning."], ["Grant yourself the same patience", "you would grant any honest work.", "Time was given to you.", "Take it."]], "text": "Iron takes its time to cool\nand is stronger for the waiting.\nThe road was not laid in a morning.\nGrant yourself the same patience\nyou would grant any honest work.\nTime was given to you.\nTake it.", "sig": true, "cats": ["Growth & Becoming", "Grace & Self-Forgiveness"]}, {"n": 102, "part": 5, "title": "Every phase carries light", "slug": "every-phase-carries-light", "stanzas": [["The moon comes up over the shed", "thin as a nail paring,", "and nobody walks out to the yard", "to tell it to try harder."], ["You stand under it with the porch light off", "and will not sign your own pardon,", "as if a man carries light", "only when he is full."], ["Half of it is lit the whole time.", "The dark is only where you stand."]], "text": "The moon comes up over the shed\nthin as a nail paring,\nand nobody walks out to the yard\nto tell it to try harder.\nYou stand under it with the porch light off\nand will not sign your own pardon,\nas if a man carries light\nonly when he is full.\nHalf of it is lit the whole time.\nThe dark is only where you stand.", "sig": true, "cats": ["Grace & Self-Forgiveness", "Nature as Teacher"]}, {"n": 103, "part": 5, "title": "Grace for this body", "slug": "grace-for-this-body", "stanzas": [["I will let it tire.", "I will let it set the sack of cement down", "two steps short of the post hole", "and call that far enough.", "I will let it hold the banister."], ["When it falters on the landing", "I will remember", "it has never been this old either."]], "text": "I will let it tire.\nI will let it set the sack of cement down\ntwo steps short of the post hole\nand call that far enough.\nI will let it hold the banister.\nWhen it falters on the landing\nI will remember\nit has never been this old either.", "sig": true, "cats": ["Grace & Self-Forgiveness", "Healing & Endurance"]}, {"n": 104, "part": 5, "title": "The oak is not late", "slug": "the-oak-is-not-late", "stanzas": [["Have patience with yourself,", "the way you have it for the south field,", "for the white oak that takes a hundred years", "and is not late."]], "text": "Have patience with yourself,\nthe way you have it for the south field,\nfor the white oak that takes a hundred years\nand is not late.", "sig": true, "cats": ["Grace & Self-Forgiveness", "Growth & Becoming", "Nature as Teach
