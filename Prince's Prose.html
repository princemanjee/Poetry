<!DOCTYPE html>
<html lang="en" data-theme="system" data-skin="glass">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prince&#x27;s Prose</title>
<meta name="description" content="191 poems by P. R. Manjee, gathered in groups. It opens with “The Undertow of Grace” and the thirteen new poems on loss, addiction, recovery and betrayal. The rest follow by theme. With contents and an index by category.">
<meta name="theme-color" content="#0a0e27">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Inter:wght@400;500;600&family=Spectral:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap" rel="stylesheet">
<style>
  /* ------------------------------------------------------------------
     Tokens carry the same names as the Prism design system on
     princerehman.com (src/styles/tokens.css), so the palette generator
     ported into the script below can override them directly on <html>,
     exactly as prism-runtime.ts does on the site.

     Themes: light, dark, hybrid, system.
     Surfaces (data-skin): glass, prism, clay, neo, 3d, steel.
     ------------------------------------------------------------------ */
  :root {
    --font-display: "Cormorant Garamond", "Palatino Linotype", Palatino, Georgia, serif;
    --font-poem: "Spectral", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
    --font-ui: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;

    --space-xs: .5rem;
    --space-sm: .75rem;
    --space-md: 1rem;
    --space-lg: 1.5rem;
    --space-xl: 2rem;

    --radius-sm: 8px;
    --radius-md: 16px;
    --radius-lg: 24px;
    --radius-full: 9999px;

    --duration-fast: .15s;
    --duration-base: .3s;
    --easing-out: cubic-bezier(.16, 1, .3, 1);
    /* The poem opens and closes at the same speed. */
    --dur: 1500ms;
    --ease-modal: cubic-bezier(.22, .82, .18, 1);

    --glass-blur: 8px;
    --glass-saturate: 140%;

    --aurora-alpha: 0;
    --aurora-blur: 90px;
    --a-mint: #3EE9A4;
    --a-cyan: #38D0FF;
    --a-violet: #7C5CFF;
    --a-rose: #FF5EA8;
  }

  /* DARK, the default */
  :root,
  :root[data-theme="dark"] {
    --bg-1: oklch(0.135 0.052 271);
    --bg-2: oklch(0.210 0.052 263);
    --bg-3: oklch(0.190 0.067 265);
    --bg-4: oklch(0.165 0.066 285);
    --bg-overlay-1: oklch(0.700 0.180 263 / 0.12);
    --bg-overlay-2: oklch(0.550 0.160 305 / 0.10);

    --accent-royal: oklch(0.605 0.222 263);
    --accent-royal-bright: oklch(0.690 0.175 263);
    --accent-royal-deep: oklch(0.485 0.231 263);
    --accent-emerald: oklch(0.730 0.130 152);
    --accent-emerald-bright: oklch(0.855 0.135 153);
    --accent-emerald-deep: oklch(0.570 0.118 153);

    --glass-bg: oklch(1 0 0 / 0.04);
    --glass-bg-hover: oklch(1 0 0 / 0.08);
    --glass-border: oklch(1 0 0 / 0.10);
    --glass-border-strong: oklch(1 0 0 / 0.20);
    --glass-blur: 8px;
    --glass-saturate: 140%;

    --highlight-top: oklch(1 0 0 / 0.95);
    --highlight-top-soft: oklch(1 0 0 / 0.25);
    --highlight-bottom: oklch(1 0 0 / 0.55);
    --highlight-bottom-soft: oklch(1 0 0 / 0.12);
    --shadow-side: oklch(0 0 0 / 0.10);
    --shadow-drop: oklch(0 0 0 / 0.55);

    --color-fg-primary: oklch(1 0 0 / 0.96);
    --color-fg-secondary: oklch(1 0 0 / 0.86);
    --color-fg-tertiary: oklch(0.910 0.020 247 / 0.78);
    --color-fg-muted: oklch(0.880 0.020 247 / 0.62);

    --brand-color: oklch(0.945 0.020 245 / 0.92);
    --brand-glow: oklch(0.870 0.060 250 / 0.55);
    color-scheme: dark;
  }

  /* LIGHT */
  :root[data-theme="light"] {
    --bg-1: oklch(0.985 0.005 250);
    --bg-2: oklch(0.955 0.015 250);
    --bg-3: oklch(0.970 0.010 220);
    --bg-4: oklch(0.960 0.012 280);
    --bg-overlay-1: oklch(0.650 0.180 263 / 0.10);
    --bg-overlay-2: oklch(0.680 0.140 305 / 0.07);

    --accent-royal: oklch(0.500 0.215 263);
    --accent-royal-bright: oklch(0.420 0.230 263);
    --accent-royal-deep: oklch(0.420 0.230 263);
    --accent-emerald: oklch(0.620 0.135 153);
    --accent-emerald-bright: oklch(0.490 0.125 154);
    --accent-emerald-deep: oklch(0.490 0.125 154);

    --glass-bg: oklch(1 0 0 / 0.55);
    --glass-bg-hover: oklch(1 0 0 / 0.75);
    --glass-border: oklch(0.20 0.020 270 / 0.12);
    --glass-border-strong: oklch(0.20 0.020 270 / 0.22);
    --glass-blur: 12px;
    --glass-saturate: 160%;

    --highlight-top: oklch(1 0 0 / 0.95);
    --highlight-top-soft: oklch(1 0 0 / 0.55);
    --highlight-bottom: oklch(0.95 0 0 / 0.30);
    --highlight-bottom-soft: oklch(0.95 0 0 / 0.10);
    --shadow-side: oklch(0.20 0.020 270 / 0.08);
    --shadow-drop: oklch(0.20 0.020 270 / 0.22);

    --color-fg-primary: oklch(0.220 0.022 270);
    --color-fg-secondary: oklch(0.355 0.022 270);
    --color-fg-tertiary: oklch(0.475 0.020 250);
    --color-fg-muted: oklch(0.610 0.018 250);

    --brand-color: oklch(0.320 0.180 263 / 0.95);
    --brand-glow: oklch(0.520 0.210 263 / 0.30);
    color-scheme: light;
  }

  /* HYBRID, the dusk mid-tone */
  :root[data-theme="hybrid"] {
    --bg-1: oklch(0.400 0.030 260);
    --bg-2: oklch(0.450 0.028 250);
    --bg-3: oklch(0.420 0.040 270);
    --bg-4: oklch(0.435 0.035 280);
    --bg-overlay-1: oklch(0.700 0.180 263 / 0.10);
    --bg-overlay-2: oklch(0.570 0.150 305 / 0.08);

    --accent-royal: oklch(0.625 0.220 263);
    --accent-royal-bright: oklch(0.790 0.150 263);
    --accent-royal-deep: oklch(0.505 0.230 263);
    --accent-emerald: oklch(0.730 0.130 152);
    --accent-emerald-bright: oklch(0.840 0.135 153);
    --accent-emerald-deep: oklch(0.570 0.118 153);

    --glass-bg: oklch(1 0 0 / 0.08);
    --glass-bg-hover: oklch(1 0 0 / 0.14);
    --glass-border: oklch(1 0 0 / 0.32);
    --glass-border-strong: oklch(1 0 0 / 0.46);
    --glass-blur: 10px;
    --glass-saturate: 150%;

    --highlight-top: oklch(1 0 0 / 0.90);
    --highlight-top-soft: oklch(1 0 0 / 0.35);
    --highlight-bottom: oklch(1 0 0 / 0.50);
    --highlight-bottom-soft: oklch(1 0 0 / 0.14);
    --shadow-side: oklch(0 0 0 / 0.12);
    --shadow-drop: oklch(0 0 0 / 0.45);

    --color-fg-primary: oklch(0.975 0.005 250);
    --color-fg-secondary: oklch(0.890 0.010 250);
    --color-fg-tertiary: oklch(0.790 0.020 247);
    --color-fg-muted: oklch(0.700 0.025 247);

    --brand-color: oklch(0.950 0.020 245 / 0.95);
    --brand-glow: oklch(0.760 0.130 252 / 0.45);
    color-scheme: dark;
  }

  /* SYSTEM resolves through prefers-color-scheme. The generator resolves it
     the same way before producing a palette. */
  @media (prefers-color-scheme: light) {
    :root[data-theme="system"] {
      --bg-1: oklch(0.985 0.005 250);
      --bg-2: oklch(0.955 0.015 250);
      --bg-3: oklch(0.970 0.010 220);
      --bg-4: oklch(0.960 0.012 280);
      --bg-overlay-1: oklch(0.650 0.180 263 / 0.10);
      --bg-overlay-2: oklch(0.680 0.140 305 / 0.07);
      --accent-royal: oklch(0.500 0.215 263);
      --accent-royal-bright: oklch(0.420 0.230 263);
      --accent-royal-deep: oklch(0.420 0.230 263);
      --accent-emerald: oklch(0.620 0.135 153);
      --accent-emerald-bright: oklch(0.490 0.125 154);
      --accent-emerald-deep: oklch(0.490 0.125 154);
      --glass-bg: oklch(1 0 0 / 0.55);
      --glass-bg-hover: oklch(1 0 0 / 0.75);
      --glass-border: oklch(0.20 0.020 270 / 0.12);
      --glass-border-strong: oklch(0.20 0.020 270 / 0.22);
      --glass-blur: 12px;
      --glass-saturate: 160%;
      --highlight-top: oklch(1 0 0 / 0.95);
      --highlight-top-soft: oklch(1 0 0 / 0.55);
      --highlight-bottom: oklch(0.95 0 0 / 0.30);
      --highlight-bottom-soft: oklch(0.95 0 0 / 0.10);
      --shadow-side: oklch(0.20 0.020 270 / 0.08);
      --shadow-drop: oklch(0.20 0.020 270 / 0.22);
      --color-fg-primary: oklch(0.220 0.022 270);
      --color-fg-secondary: oklch(0.355 0.022 270);
      --color-fg-tertiary: oklch(0.475 0.020 250);
      --color-fg-muted: oklch(0.610 0.018 250);
      --brand-color: oklch(0.320 0.180 263 / 0.95);
      --brand-glow: oklch(0.520 0.210 263 / 0.30);
      color-scheme: light;
    }
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    color: var(--color-fg-primary);
    font: 400 1rem/1.55 var(--font-ui);
    -webkit-font-smoothing: antialiased;
    background:
      radial-gradient(ellipse at 20% 0%, var(--bg-overlay-1) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 100%, var(--bg-overlay-2) 0%, transparent 55%),
      linear-gradient(135deg, var(--bg-1) 0%, var(--bg-2) 35%, var(--bg-3) 70%, var(--bg-4) 100%);
    background-attachment: fixed;
  }
  a { color: var(--accent-royal-bright); text-decoration-thickness: 1px; text-underline-offset: .18em; }
  a:hover { color: var(--color-fg-primary); }
  :focus-visible { outline: 2px solid var(--accent-royal-bright); outline-offset: 3px; border-radius: 4px; }
  [tabindex="-1"]:focus { outline: none; }
  ::selection { background: var(--accent-royal); color: #fff; }
  .skip { position: absolute; left: -999px; top: 8px; background: var(--color-fg-primary); color: var(--bg-1); padding: 8px 12px; z-index: 40; }
  .skip:focus { left: 14px; }

  /* ---------- Aurora field, Prism V2 surface only ---------- */
  .aurora { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
  .aurora i {
    position: absolute; display: block; border-radius: 50%;
    filter: blur(var(--aurora-blur));
    opacity: var(--aurora-alpha);
    transition: opacity var(--duration-base) var(--easing-out);
    will-change: transform;
  }
  .aurora i:nth-child(1) { width: 58vw; height: 40vw; top: -12vw; left: -8vw; background: var(--a-mint); animation: drift1 46s ease-in-out infinite alternate; }
  .aurora i:nth-child(2) { width: 52vw; height: 44vw; top: 4vw; right: -14vw; background: var(--a-violet); animation: drift2 54s ease-in-out infinite alternate; }
  .aurora i:nth-child(3) { width: 46vw; height: 30vw; bottom: -10vw; left: 14vw; background: var(--a-cyan); animation: drift3 60s ease-in-out infinite alternate; }
  .aurora i:nth-child(4) { width: 36vw; height: 28vw; bottom: 6vw; right: 4vw; background: var(--a-rose); animation: drift4 50s ease-in-out infinite alternate; }
  @keyframes drift1 { to { transform: translate(10vw, 8vw) rotate(12deg) scale(1.12); } }
  @keyframes drift2 { to { transform: translate(-12vw, 10vw) rotate(-10deg) scale(1.08); } }
  @keyframes drift3 { to { transform: translate(14vw, -8vw) rotate(8deg) scale(1.15); } }
  @keyframes drift4 { to { transform: translate(-10vw, -12vw) rotate(-14deg) scale(1.1); } }
  :root[data-skin="prism"] { --aurora-alpha: .34; }
  :root[data-skin="prism"][data-theme="dark"] { --aurora-alpha: .42; }

  /* ---------- Surfaces ---------- */
  .surface {
    position: relative;
    border-radius: var(--radius-lg);
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    box-shadow: 0 18px 40px -24px var(--shadow-drop);
    transition: background var(--duration-base) var(--easing-out),
                box-shadow var(--duration-base) var(--easing-out);
  }
  .surface > * { position: relative; z-index: 1; }
  /* Finish: top gloss plus a diagonal reflection streak, as on the site */
  .surface::after {
    content: ""; position: absolute; inset: 0; border-radius: inherit;
    pointer-events: none; z-index: 0;
    background:
      linear-gradient(125deg, oklch(1 0 0 / 0.16) 0%, oklch(1 0 0 / 0.06) 13%, transparent 33%),
      linear-gradient(180deg, oklch(1 0 0 / 0.10) 0%, oklch(1 0 0 / 0.03) 11%, transparent 28%);
  }
  :root[data-skin="glass"] .surface,
  :root[data-skin="prism"] .surface {
    -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-saturate));
    backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-saturate));
  }
  /* Steel is milled metal, not glass. Blurring the backdrop made the face
     sample the body sitting behind it, which is what turned every plate grey. */
  :root[data-skin="steel"] .surface {
    -webkit-backdrop-filter: none;
    backdrop-filter: none;
  }
  :root[data-skin="prism"] .surface::before {
    content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px;
    background: linear-gradient(120deg, var(--a-mint), var(--a-cyan) 35%, transparent 55%, var(--a-violet) 80%, var(--a-rose));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    opacity: .55; pointer-events: none; z-index: 0;
  }
  :root[data-skin="clay"] { --radius-lg: 30px; --radius-md: 20px; }
  :root[data-skin="clay"] .surface {
    background: color-mix(in oklch, var(--bg-2) 82%, var(--accent-royal) 18%);
    border-color: transparent;
    box-shadow: inset -8px -8px 18px var(--shadow-side),
                inset 8px 8px 18px var(--highlight-bottom-soft),
                12px 16px 30px -18px var(--shadow-drop);
  }
  :root[data-skin="clay"] .surface::after { background: none; }
  :root[data-skin="neo"] .surface {
    background: color-mix(in oklch, var(--bg-2) 92%, var(--color-fg-primary) 8%);
    border-color: transparent;
    box-shadow: 10px 10px 22px var(--shadow-drop), -10px -10px 22px var(--highlight-bottom-soft);
  }
  :root[data-skin="neo"] .surface::after { background: none; }
  /* Depth comes from thickness, not from rotation. Rotating a panel that is
     thousands of pixels tall throws its far end into the distance, drifts off
     screen as you scroll, and reads as one tilted sheet rather than a plate.
     Each plate is a lit face, a side wall protruding below it, and a contact
     shadow, so it reads as an object at any height. */
  /* One plate, not two panels. The side wall is a stack of solid shadows, each
     a pixel further than the last, so it is continuous with the face and
     follows the rounded corners instead of sitting behind it as a second slab. */
  :root[data-skin="3d"], :root[data-skin="steel"] {
    --edge: color-mix(in oklch, var(--bg-1) 45%, black 55%);
    --edge-stack:
      1px 1px 0 var(--edge), 2px 2px 0 var(--edge), 3px 3px 0 var(--edge),
      4px 4px 0 var(--edge), 5px 5px 0 var(--edge), 6px 6px 0 var(--edge),
      7px 7px 0 var(--edge), 8px 8px 0 var(--edge), 9px 9px 0 var(--edge),
      10px 10px 0 var(--edge), 11px 11px 0 var(--edge), 12px 12px 0 var(--edge);
  }
  :root[data-skin="3d"] { --radius-lg: 14px; --radius-md: 10px; --bloom: 64px; }
  :root[data-skin="3d"] .surface {
    background: linear-gradient(150deg,
      color-mix(in oklch, var(--bg-2) 80%, var(--color-fg-primary) 10%) 0%,
      color-mix(in oklch, var(--bg-2) 94%, var(--color-fg-primary) 2%) 62%);
    border-color: transparent;
    box-shadow:
      inset 1px 1px 0 var(--highlight-top),
      inset -1px -1px 0 var(--shadow-side),
      var(--edge-stack),
      0 0 var(--bloom) -12px var(--accent-royal-bright),
      0 34px 46px -28px var(--shadow-drop);
  }
  /* Steel Plate: glass and 3D together. Brushed translucent plate in
     perspective, machined edge, specular line along the top. */
  :root[data-skin="steel"] { --radius-lg: 12px; --radius-md: 9px; --bloom: 56px; }
  :root[data-skin="steel"] .surface {
    background:
      repeating-linear-gradient(103deg, oklch(1 0 0 / 0.055) 0 2px, transparent 2px 6px),
      linear-gradient(150deg, var(--glass-bg-hover) 0%, var(--glass-bg) 52%, transparent 100%);
    border-color: transparent;
    box-shadow:
      inset 1px 1px 0 var(--highlight-top),
      inset 2px 2px 0 -1px var(--highlight-top-soft),
      inset -1px -1px 0 var(--shadow-side),
      var(--edge-stack),
      0 0 var(--bloom) -14px var(--highlight-top-soft),
      0 28px 38px -24px var(--shadow-drop);
  }

  /* Light mode needs its own metal. The dark recipe fades the face to
     transparent, which over a near-white page turns the plate into a grey
     smear and drops the text contrast with it. Here the face stays opaque and
     pale, the rim is white, and the body is a warm grey rather than near-black
     so it reads as an edge catching shadow instead of a dropped shadow. */
  :root[data-theme="light"][data-skin="steel"] .surface,
  :root[data-theme="light"][data-skin="3d"] .surface {
    /* Opaque face, no backdrop blur. A translucent face over the body sitting
       behind it let the body's grey read straight through and turned the plate
       into a smear. */
    background:
      repeating-linear-gradient(103deg, oklch(0.45 0.02 260 / 0.045) 0 2px, transparent 2px 6px),
      linear-gradient(150deg, oklch(1 0 0) 0%, oklch(0.985 0.003 250) 55%, oklch(0.965 0.006 250) 100%);
    -webkit-backdrop-filter: none;
    backdrop-filter: none;
    box-shadow:
      inset 1px 1px 0 oklch(1 0 0),
      inset -1px -1px 0 oklch(0.55 0.02 260 / 0.20),
      0 0 var(--bloom) -20px oklch(0.50 0.215 263 / 0.50),
      0 24px 34px -26px oklch(0.35 0.03 265 / 0.45);
  }
  /* The body is drawn as two strips that sit only where the plate's edges
     protrude, right and bottom. A full-size rectangle behind the face covered
     most of a short panel like the sidebar and read as a grey wash over it. */
  /* On a near-white page the wall has to stay close to the face, or the plate
     reads as a grey slab parked behind the panel instead of a machined edge. */
  :root[data-theme="light"][data-skin="steel"],
  :root[data-theme="light"][data-skin="3d"] {
    --edge: oklch(0.905 0.006 260);
    --edge-stack:
      1px 1px 0 var(--edge), 2px 2px 0 var(--edge), 3px 3px 0 var(--edge),
      4px 4px 0 var(--edge), 5px 5px 0 var(--edge), 6px 6px 0 var(--edge),
      7px 7px 0 var(--edge), 8px 8px 0 var(--edge);
  }
  @media (prefers-color-scheme: light) {
    /* System resolved to light gets the same pale metal. */
    :root[data-theme="system"][data-skin="steel"] .surface,
    :root[data-theme="system"][data-skin="3d"] .surface {
      background:
        repeating-linear-gradient(103deg, oklch(0.45 0.02 260 / 0.045) 0 2px, transparent 2px 6px),
        linear-gradient(150deg, oklch(1 0 0) 0%, oklch(0.985 0.003 250) 55%, oklch(0.965 0.006 250) 100%);
      -webkit-backdrop-filter: none;
      backdrop-filter: none;
      box-shadow:
        inset 1px 1px 0 oklch(1 0 0),
        inset -1px -1px 0 oklch(0.55 0.02 260 / 0.20),
        0 0 var(--bloom) -20px oklch(0.50 0.215 263 / 0.50),
        0 24px 34px -26px oklch(0.35 0.03 265 / 0.45);
    }
    :root[data-theme="system"][data-skin="steel"],
    :root[data-theme="system"][data-skin="3d"] {
      --edge: oklch(0.905 0.006 260);
      --edge-stack:
        1px 1px 0 var(--edge), 2px 2px 0 var(--edge), 3px 3px 0 var(--edge),
        4px 4px 0 var(--edge), 5px 5px 0 var(--edge), 6px 6px 0 var(--edge),
        7px 7px 0 var(--edge), 8px 8px 0 var(--edge);
    }
  }

  /* No inner scrollbars. Any overflow other than visible clips the element's
     own ::before, which trapped each plate's body inside the panel and painted
     it across the face, and it put a scrollbar down the middle of the page.
     The plate still reads as an object because its body runs the full height of
     the right edge, visible at every scroll position. */
  :root[data-skin="steel"] .shell,
  :root[data-skin="3d"] .shell { align-items: start; }
  :root[data-skin="steel"] .col,
  :root[data-skin="3d"] .col,
  :root[data-skin="steel"] .side,
  :root[data-skin="3d"] .side {
    max-height: none;
    overflow: visible;
  }

  /* Smaller controls get the same plate treatment, so the look carries
     through the page instead of sitting only on the big panels. */
  :root[data-skin="steel"] .pn a,
  :root[data-skin="3d"] .pn a,
  :root[data-skin="steel"] .jump a,
  :root[data-skin="3d"] .jump a,
  :root[data-skin="steel"] .seg button,
  :root[data-skin="3d"] .seg button {
    border-color: transparent;
    box-shadow:
      inset 1px 1px 0 var(--highlight-top-soft),
      inset -1px -1px 0 var(--shadow-side),
      5px 5px 0 -1px color-mix(in oklch, var(--bg-1) 50%, black 50%),
      0 0 26px -12px var(--accent-royal-bright),
      0 12px 16px -12px var(--shadow-drop);
  }
  /* Pressing one pushes it down into its own shadow. */
  :root[data-skin="steel"] .pn a:hover,
  :root[data-skin="3d"] .pn a:hover,
  :root[data-skin="steel"] .jump a:hover,
  :root[data-skin="3d"] .jump a:hover {
    box-shadow:
      inset 1px 1px 0 var(--highlight-top),
      2px 2px 0 -1px color-mix(in oklch, var(--bg-1) 50%, black 50%),
      0 0 30px -10px var(--accent-royal-bright),
      0 6px 10px -10px var(--shadow-drop);
  }
  :root[data-skin="steel"] .prism-trigger,
  :root[data-skin="3d"] .prism-trigger {
    box-shadow:
      inset 1px 1px 0 var(--highlight-top),
      6px 6px 0 -2px color-mix(in oklch, var(--bg-1) 50%, black 50%),
      0 0 34px -10px var(--accent-royal-bright),
      0 16px 22px -14px var(--shadow-drop);
  }

  /* ---------- Position marker ---------- */
  .strip { position: fixed; left: 0; top: 0; bottom: 0; width: 6px; background: var(--glass-bg-hover); z-index: 10; }
  .strip i {
    position: absolute; left: 0; right: 0;
    top: calc(var(--pos, 0) * 100%);
    height: max(4px, calc(100% / var(--count, 191)));
    background: var(--accent-emerald-bright);
    box-shadow: 0 0 14px 3px var(--accent-emerald);
    opacity: 0;
    transition: top .8s var(--easing-out), opacity var(--duration-base) ease;
  }
  .strip.on i { opacity: 1; }

  /* ---------- Layout ---------- */
  .shell { display: grid; grid-template-columns: 17rem minmax(0, 1fr); gap: var(--space-xl); max-width: 1440px; margin: 0 auto; padding: var(--space-xl) var(--space-xl) 5rem; margin-left: 6px; }
  /* The sidebar does not scroll. Its contents are a title, three links, a
     search box and one more link, so a max-height with overflow only ever
     manufactured a scrollbar for content that already fits. */
  .side { position: sticky; top: var(--space-xl); align-self: start; padding: var(--space-lg); display: grid; gap: var(--space-lg); }
  .brand { text-decoration: none; color: var(--brand-color); display: block; }
  .brand b { display: block; font: 400 1.7rem/1.05 var(--font-display); letter-spacing: -.01em; text-shadow: 0 0 22px var(--brand-glow); }
  .brand span { display: block; margin-top: .3rem; color: var(--color-fg-muted); font-size: .88rem; }
  .nav { list-style: none; margin: 0; padding: 0; display: grid; gap: .15rem; }
  .nav a { display: block; padding: .4rem .65rem; border-radius: var(--radius-sm); color: var(--color-fg-secondary); text-decoration: none; font-weight: 500; }
  .nav a:hover { background: var(--glass-bg-hover); color: var(--color-fg-primary); }
  .nav a[aria-current="page"] { background: var(--glass-bg-hover); color: var(--color-fg-primary); box-shadow: inset 2px 0 0 var(--accent-emerald-bright); }
  .search label { display: block; font-size: .82rem; color: var(--color-fg-muted); margin-bottom: .35rem; }
  .search input {
    width: 100%; font: inherit; color: var(--color-fg-primary);
    background: var(--glass-bg); border: 1px solid var(--glass-border);
    border-radius: var(--radius-sm); padding: .5rem .65rem;
  }
  .search input::placeholder { color: var(--color-fg-muted); }
  .side-foot { display: grid; gap: .5rem; justify-items: start; font-size: .9rem; }

  main { min-width: 0; }
  main:focus { outline: none; }
  .col { max-width: 40rem; padding: clamp(1.5rem, 3vw, 2.75rem); }
  .col.wide { max-width: 68rem; }
  h1, h2, h3 { font-family: var(--font-display); font-weight: 400; letter-spacing: -.01em; }
  .page-title { font-size: clamp(2.3rem, 5vw, 3.2rem); line-height: 1.05; margin: 0 0 .5rem; }
  .lede { color: var(--color-fg-tertiary); margin: 0 0 var(--space-xl); max-width: 42rem; }

  /* ---------- Cover ---------- */
  .cover-title { font: 300 clamp(3rem, 8vw, 5.6rem)/.95 var(--font-display); letter-spacing: -.02em; margin: 0 0 var(--space-lg); color: var(--brand-color); text-shadow: 0 0 40px var(--brand-glow); }
  .cover-title span { display: block; }
  .cover-title span + span { padding-left: 1.1em; }
  .byline { font: 400 1.1rem/1.4 var(--font-display); color: var(--color-fg-secondary); margin: 0 0 var(--space-lg); }
  .intro { color: var(--color-fg-tertiary); max-width: 34rem; margin: 0 0 var(--space-xl); }
  .epigraph { margin: 0 0 var(--space-xl); padding-left: var(--space-md); border-left: 2px solid var(--accent-emerald); font: italic 300 1.25rem/1.55 var(--font-poem); color: var(--color-fg-secondary); }
  .epigraph p { margin: 0; }
  .epigraph a { display: inline-block; margin-top: .6rem; font: 400 .88rem/1 var(--font-ui); font-style: normal; }
  .doors { list-style: none; padding: 0; margin: 0; display: grid; gap: .55rem; }
  .doors a { font-weight: 500; }

  /* ---------- Contents ---------- */
  .part { margin: 0 0 var(--space-xl); }
  .part h2 { font-size: 1.7rem; margin: 0 0 .15rem; }
  .part .count { color: var(--color-fg-muted); margin: 0 0 var(--space-md); font-size: .9rem; }
  .toc { columns: 2 17rem; column-gap: 3rem; margin: 0; padding-left: 2.6rem; font-family: var(--font-poem); font-size: 1.05rem; }
  .toc li { break-inside: avoid; padding: .13rem 0; }
  .toc li::marker { color: var(--color-fg-muted); font: 400 .8rem var(--font-ui); }
  .toc a { color: var(--color-fg-secondary); text-decoration: none; }
  .toc a:hover { color: var(--accent-royal-bright); text-decoration: underline; }

  /* ---------- Index ---------- */
  .jump { list-style: none; padding: 0; margin: 0 0 var(--space-xl); display: flex; flex-wrap: wrap; gap: .5rem; }
  .jump a {
    display: inline-flex; gap: .45rem; align-items: baseline; padding: .35rem .75rem;
    border: 1px solid var(--glass-border); border-radius: var(--radius-full);
    background: var(--glass-bg); color: var(--color-fg-secondary); text-decoration: none; font-size: .9rem;
  }
  .jump a:hover { border-color: var(--accent-royal-bright); color: var(--color-fg-primary); }
  .jump small { color: var(--color-fg-muted); font-size: .78rem; }
  .cat { margin: 0 0 var(--space-xl); scroll-margin-top: 1.5rem; }
  .cat h2 { font-size: 1.5rem; margin: 0 0 .7rem; padding-bottom: .45rem; border-bottom: 1px solid var(--glass-border); display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; }
  .cat h2 small { font: 400 .82rem var(--font-ui); color: var(--color-fg-muted); }
  .entries { list-style: none; padding: 0; margin: 0; columns: 2 17rem; column-gap: 3rem; }
  .entries li { break-inside: avoid; display: flex; justify-content: space-between; gap: 1rem; padding: .15rem 0; font-family: var(--font-poem); font-size: 1.02rem; }
  .entries a { color: var(--color-fg-secondary); text-decoration: none; }
  .entries a:hover { color: var(--accent-royal-bright); text-decoration: underline; }
  .entries .no { color: var(--color-fg-muted); font: 400 .78rem/1.9 var(--font-ui); white-space: nowrap; }
  .letter { font: 500 .92rem var(--font-display); color: var(--color-fg-muted); margin: 1.1rem 0 .3rem; break-after: avoid; }
  .top-link { font-size: .86rem; }

  /* ---------- Poem ---------- */
  .where { color: var(--color-fg-muted); font-size: .9rem; margin: 0 0 .7rem; }
  .where a { color: var(--color-fg-muted); }
  .poem h1 { font-size: clamp(2rem, 4vw, 2.8rem); line-height: 1.1; margin: 0 0 var(--space-xl); }
  .verse { font: 400 1.18rem/1.62 var(--font-poem); color: var(--color-fg-primary); }
  .stanza { margin: 0 0 1.5em; }
  .l { display: block; padding-left: 1.6em; text-indent: -1.6em; }
  .sig { font: italic 400 1rem var(--font-poem); color: var(--color-fg-muted); margin: -.2rem 0 0; }
  .filed { margin: var(--space-xl) 0 0; padding-top: var(--space-md); border-top: 1px solid var(--glass-border); color: var(--color-fg-tertiary); font-size: .93rem; }
  .pn { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-md); margin-top: var(--space-lg); }
  .pn a { display: block; text-decoration: none; padding: .85rem 1rem; border-radius: var(--radius-md); background: var(--glass-bg); border: 1px solid var(--glass-border); color: var(--color-fg-secondary); }
  .pn a:hover { border-color: var(--accent-royal-bright); color: var(--color-fg-primary); }
  .pn a small { display: block; color: var(--color-fg-muted); font-size: .8rem; margin-bottom: .2rem; }
  .pn a span { font: 400 1.02rem/1.3 var(--font-poem); }
  .pn .next { text-align: right; grid-column: 2; }
  .hint { color: var(--color-fg-muted); font-size: .84rem; margin-top: var(--space-md); }

  /* ---------- Search ---------- */
  .results { list-style: none; padding: 0; margin: 0; }
  .results li { padding: .9rem 0; border-bottom: 1px solid var(--glass-border); }
  .results a { font: 400 1.18rem var(--font-poem); text-decoration: none; }
  .results a:hover { text-decoration: underline; }
  .results .no { color: var(--color-fg-muted); font-size: .8rem; margin-left: .5rem; }
  .results p { margin: .3rem 0 0; font: italic 300 1rem/1.5 var(--font-poem); color: var(--color-fg-tertiary); }
  mark { background: color-mix(in oklch, var(--accent-emerald) 35%, transparent); color: inherit; border-radius: 2px; padding: 0 .1em; }

  /* ---------- The poem, in a modal ---------- */
  .overlay {
    position: fixed; inset: 0; z-index: 20;
    background: oklch(0.12 0.03 265 / 0.55);
    -webkit-backdrop-filter: blur(3px);
    backdrop-filter: blur(3px);
    opacity: 0;
    transition: opacity var(--dur) var(--ease-modal);
  }
  .overlay.open { opacity: 1; }
  .overlay[hidden], .modal[hidden] { display: none; }
  .modal {
    position: fixed; z-index: 21;
    left: 50%; top: 50%;
    width: min(44rem, calc(100vw - 2rem));
    /* Use the whole window before scrolling. A fixed rem cap here sat below the
       available height on a tall screen, so poems that would have fitted got a
       scrollbar they did not need. */
    max-height: calc(100vh - 3rem);
    overflow-y: auto;
    padding: clamp(1.5rem, 3vw, 2.75rem);
    transform: translate(-50%, -50%) scale(.94) translateY(18px);
    opacity: 0;
    transition: transform var(--dur) var(--ease-modal), opacity var(--dur) var(--ease-modal);
  }
  .modal.open { transform: translate(-50%, -50%) scale(1) translateY(0); opacity: 1; }
  /* The poem is opaque. As glass the page behind it bled through the text.
     Only the colour is set, not the shorthand, so each skin's grain and
     gradient still paint over it; both attributes are in the selector so this
     outranks the per-theme plate rules. */
  :root[data-theme][data-skin] .modal {
    background-color: var(--bg-2);
    -webkit-backdrop-filter: none;
    backdrop-filter: none;
  }
  /* Scrollbars: a floating thumb in the same material as everything else. The
     track stays transparent so nothing sits in a channel, the thumb is inset
     from the edge by a transparent border, and it fades away when the surface
     is neither scrolling nor hovered. */
  /* Chrome and Edge ignore every ::-webkit-scrollbar rule on an element that
     also sets scrollbar-width or scrollbar-color, so the two cannot be declared
     together. The webkit rules run here; the standard properties are confined
     to the @supports block below, which only Firefox enters. */
  /* A native scrollbar is a gutter locked to the edge of its scroller and it
     takes layout width, so it can be neither floated above the page nor
     inset from the edge. The native bars are hidden and a real one is drawn
     instead, positioned over the content with a gap at the right. */
  ::-webkit-scrollbar { width: 0; height: 0; }
  html, .modal, .prism-panel { scrollbar-width: none; -ms-overflow-style: none; }

  .sbar {
    position: fixed;
    width: 12px;
    z-index: 40;
    opacity: 0;
    pointer-events: none;
    transition: opacity .35s var(--easing-out);
  }
  .sbar.on { opacity: 1; pointer-events: auto; }
  .sbar i {
    position: absolute;
    left: 0; right: 0;
    border-radius: var(--radius-full);
    background: linear-gradient(135deg,
      color-mix(in oklch, var(--bg-2) 55%, white 22%),
      color-mix(in oklch, var(--bg-1) 65%, black 35%));
    box-shadow:
      inset 2px 2px 3px var(--highlight-top-soft),
      inset -2px -2px 3px var(--shadow-side),
      2px 4px 10px var(--shadow-drop);
    cursor: grab;
    transition: background .25s var(--easing-out);
  }
  .sbar i:hover {
    background: linear-gradient(135deg,
      color-mix(in oklch, var(--accent-royal-bright) 75%, white 15%),
      var(--accent-royal-deep));
  }
  .sbar.dragging i {
    cursor: grabbing;
    background: linear-gradient(135deg,
      color-mix(in oklch, var(--bg-1) 70%, black 30%),
      color-mix(in oklch, var(--bg-2) 55%, white 12%));
    box-shadow:
      inset 1px 1px 2px var(--shadow-side),
      1px 2px 5px var(--shadow-drop);
  }
  /* Keep the poem clear of the thumb. */
  .modal { padding-right: calc(clamp(1.5rem, 3vw, 2.75rem) + 10px); }
  body.locked { overflow: hidden; }
  .modal-close {
    position: absolute; top: .75rem; right: .9rem;
    width: 34px; height: 34px; border-radius: var(--radius-full);
    display: grid; place-items: center; cursor: pointer;
    background: var(--glass-bg); border: 1px solid var(--glass-border);
    color: var(--color-fg-secondary); font: 400 1.1rem/1 var(--font-ui);
  }
  .modal-close:hover { color: var(--color-fg-primary); background: var(--glass-bg-hover); }
  .alone { margin: var(--space-md) 0 0; font-size: .86rem; }
  body.single .side, body.single .strip { display: none; }
  /* A poem on its own sits in the middle of the page. The shell normally keeps
     a left margin to clear the position marker, which is hidden here, so the
     margin goes back to auto. `safe center` so a long poem cannot have its top
     cut off when it outgrows the viewport. */
  body.single .shell {
    grid-template-columns: minmax(0, 1fr);
    max-width: 48rem;
    margin-left: auto;
    margin-right: auto;
    min-height: 100vh;
    align-content: center;
    align-content: safe center;
  }
  body.single main { display: grid; justify-items: center; }
  body.single .col { width: 100%; }

  /* ---------- Prism control panel ---------- */
  .prism { position: fixed; right: var(--space-lg); bottom: var(--space-lg); z-index: 30; display: grid; justify-items: end; gap: var(--space-sm); }
  .prism-trigger {
    width: 52px; height: 52px; border-radius: var(--radius-full);
    display: grid; place-items: center; cursor: pointer;
    background: var(--glass-bg-hover); border: 1px solid var(--glass-border-strong);
    color: var(--color-fg-primary);
    -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-saturate));
    backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-saturate));
    box-shadow: 0 10px 28px -12px var(--shadow-drop), 0 0 24px -6px var(--brand-glow);
    transition: transform var(--duration-fast) var(--easing-out);
  }
  .prism-trigger:hover { transform: translateY(-2px); }
  .prism-trigger svg { width: 26px; height: 26px; }
  .prism-panel {
    width: min(21rem, calc(100vw - 2rem));
    max-height: min(32rem, calc(100vh - 8rem));
    overflow-y: auto;
    padding: var(--space-md);
    display: grid;
    gap: var(--space-md);
  }
  .prism-panel[hidden] { display: none; }
  /* The panel is a control surface, not glass. It stays opaque whatever the
     skin or theme, so the dimmed overlay behind an open poem never shows
     through it. Both attributes are in the selector so this outranks the
     per-theme plate rules above. */
  :root[data-theme][data-skin] .prism-panel,
  :root[data-theme][data-skin] .prism-trigger {
    background: var(--bg-2);
    border: 1px solid var(--glass-border-strong);
    -webkit-backdrop-filter: none;
    backdrop-filter: none;
  }
  :root[data-theme][data-skin] .prism-panel {
    box-shadow: 0 24px 44px -20px var(--shadow-drop);
  }
  :root[data-theme][data-skin] .prism-panel::after,
  :root[data-theme][data-skin] .prism-trigger::after { background: none; }
  .prism-head { display: flex; align-items: baseline; justify-content: space-between; gap: .5rem; }
  .prism-head b { font: 400 1.25rem var(--font-display); }
  .prism-head span { font-size: .74rem; color: var(--color-fg-muted); }
  .prism-section > p { margin: 0 0 .35rem; font-size: .74rem; color: var(--color-fg-muted); letter-spacing: .02em; }
  .prism-row { display: flex; align-items: baseline; justify-content: space-between; gap: .5rem; }
  .prism-row output { font: 500 .78rem var(--font-ui); color: var(--color-fg-secondary); }
  .seg { display: flex; flex-wrap: wrap; gap: .3rem; }
  .seg button {
    appearance: none; border: 1px solid var(--glass-border); background: var(--glass-bg);
    color: var(--color-fg-tertiary); font: 500 .78rem/1 var(--font-ui); padding: .45rem .6rem;
    border-radius: var(--radius-sm); cursor: pointer;
    transition: background var(--duration-fast) var(--easing-out), color var(--duration-fast) var(--easing-out);
  }
  .seg button:hover { color: var(--color-fg-primary); background: var(--glass-bg-hover); }
  .seg button[aria-checked="true"] { color: #fff; background: var(--accent-royal); border-color: transparent; }
  .hue-slider { width: 100%; margin: .2rem 0 0; accent-color: var(--accent-royal); }
  .hue-track {
    height: 8px; border-radius: var(--radius-full); margin-top: .3rem;
    border: 1px solid var(--glass-border);
    background: linear-gradient(90deg,
      oklch(0.65 0.2 0), oklch(0.65 0.2 60), oklch(0.65 0.2 120), oklch(0.65 0.2 180),
      oklch(0.65 0.2 240), oklch(0.65 0.2 300), oklch(0.65 0.2 360));
  }
  .prism-foot { display: flex; justify-content: space-between; gap: .5rem; align-items: center; }
  .linkbtn { font: inherit; color: var(--accent-royal-bright); background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; text-underline-offset: .18em; font-size: .82rem; }

  @media (max-width: 900px) {
    .shell { grid-template-columns: minmax(0, 1fr); padding: var(--space-md) 16px 5.5rem; gap: var(--space-md); }
    .side { position: static; max-height: none; grid-template-columns: 1fr auto; align-items: center; }
    .brand span { display: none; }
    .nav { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: .2rem; }
    .search { grid-column: 1 / -1; }
    .side-foot { grid-column: 1 / -1; grid-auto-flow: column; justify-content: start; gap: 1rem; }
    .col { padding: var(--space-lg) var(--space-md); }
    .toc { padding-left: 2.2rem; }
    .pn { grid-template-columns: 1fr; }
    .pn .next { grid-column: 1; text-align: left; }
    .prism { right: var(--space-md); bottom: var(--space-md); }
    /* On a phone the plate is the page, so it scrolls with the document and
       the body is thinner. */
    :root[data-skin="3d"], :root[data-skin="steel"] { --plate: 7px; }
    :root[data-skin="steel"] .col,
    :root[data-skin="3d"] .col,
    :root[data-skin="steel"] .side,
    :root[data-skin="3d"] .side { max-height: none; overflow: visible; }
  }
  @media (prefers-reduced-motion: reduce) {
    :root { --dur: 200ms; }
    .aurora i { animation: none; }
    .strip i, .surface, .prism-trigger { transition: none; }
  }
  @media print {
    .side, .strip, .pn, .hint, .skip, .aurora, .prism { display: none !important; }
    body { background: #fff; color: #000; }
    .shell { display: block; margin: 0; padding: 0; }
    .surface { background: none; border: 0; box-shadow: none; }
    .surface::after, .surface::before { display: none; }
  }
</style>
</head>
<body>
<a class="skip" href="#view">Skip to the reading pane</a>
<div class="aurora" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
<div class="strip" id="strip" aria-hidden="true"><i></i></div>
<div class="shell stage">
  <aside class="side surface">
    <a class="brand" href="#/"><b>Prince’s Prose</b><span>P. R. Manjee</span></a>
    <ul class="nav">
      <li><a href="#/contents" data-nav="contents">Contents</a></li>
      <li><a href="#/index" data-nav="index">Index</a></li>
      <li><a href="#/index/titles-a-to-z" data-nav="az">Titles A to Z</a></li>
    </ul>
    <form class="search" role="search" id="search-form">
      <label for="q">Search titles and lines</label>
      <input id="q" type="search" autocomplete="off" placeholder="A word or phrase">
    </form>
    <div class="side-foot">
      <a href="#/random">Open a poem at random</a>
    </div>
  </aside>
  <main id="view" tabindex="-1" aria-live="polite"></main>
</div>

<div class="overlay" id="overlay" hidden></div>
<div class="modal surface stage" id="modal" role="dialog" aria-modal="true" aria-label="Poem" hidden>
  <button class="modal-close" id="modal-close" type="button" aria-label="Close the poem">&#215;</button>
  <div id="modal-body"></div>
</div>

<div class="prism">
  <div class="prism-panel surface" id="prism-panel" role="dialog" aria-label="Prism control panel" hidden>
    <div class="prism-head"><b>Prism</b><span>theme, surface, palette</span></div>
    <section class="prism-section">
      <p id="lbl-mode">Mode</p>
      <div class="seg" id="seg-mode" role="radiogroup" aria-labelledby="lbl-mode"></div>
    </section>
    <section class="prism-section">
      <p id="lbl-skin">Surface</p>
      <div class="seg" id="seg-skin" role="radiogroup" aria-labelledby="lbl-skin"></div>
    </section>
    <section class="prism-section">
      <p id="lbl-model">Mixing model</p>
      <div class="seg" id="seg-model" role="radiogroup" aria-labelledby="lbl-model"></div>
    </section>
    <section class="prism-section">
      <div class="prism-row"><p id="lbl-hue">Hue</p><output id="hue-out" for="hue">263&deg;</output></div>
      <input class="hue-slider" id="hue" type="range" min="0" max="360" step="1" value="263" aria-labelledby="lbl-hue">
      <div class="hue-track" aria-hidden="true"></div>
    </section>
    <section class="prism-section">
      <p id="lbl-contrast">Contrast</p>
      <div class="seg" id="seg-contrast" role="radiogroup" aria-labelledby="lbl-contrast"></div>

<script id="book" type="application/json">{"title": "Prince's Prose", "intro": "191 poems by P. R. Manjee, gathered in groups. It opens with “The Undertow of Grace” and the thirteen new poems on loss, addiction, recovery and betrayal. The rest follow by theme.", "cover": {"lines": ["Prince’s", "Prose"], "epigraph": {"slug": "pilot-light", "lines": ["The flame’s still on.", "Nobody’s cooking.", "Somebody could."]}}, "siblings": [{"title": "The Undertow of Grace", "href": "../The%20Undertow%20of%20Grace/The%20Undertow%20of%20Grace.html"}, {"title": "Prince's Prose", "href": "../Prince%27s%20Prose/Prince%27s%20Prose.html"}], "parts": [{"n": 1, "title": "Loss, Addiction, Recovery", "label": "Loss, Addiction, Recovery"}, {"n": 2, "title": "Fortitude & Gentleness", "label": "Fortitude & Gentleness"}, {"n": 3, "title": "Healing & Endurance", "label": "Healing & Endurance"}, {"n": 4, "title": "Growth & Becoming", "label": "Growth & Becoming"}, {"n": 5, "title": "Grace & Self-Forgiveness", "label": "Grace & Self-Forgiveness"}, {"n": 6, "title": "Rest & Stillness", "label": "Rest & Stillness"}, {"n": 7, "title": "Worth & Belonging", "label": "Worth & Belonging"}, {"n": 8, "title": "Fatherhood & Duty", "label": "Fatherhood & Duty"}, {"n": 9, "title": "Letting Go", "label": "Letting Go"}, {"n": 10, "title": "Seasons & Letters", "label": "Seasons & Letters"}, {"n": 11, "title": "Honor & Character", "label": "Honor & Character"}, {"n": 12, "title": "Faith & Reverence", "label": "Faith & Reverence"}, {"n": 13, "title": "Grief & Loss", "label": "Grief & Loss"}, {"n": 14, "title": "Nature as Teacher", "label": "Nature as Teacher"}], "poems": [{"n": 1, "part": 1, "title": "The Undertow of Grace", "slug": "the-undertow-of-grace", "stanzas": [["I held your chin above the cresting foam,", "And traded all my breath to see you home.", "My shoulders burned beneath the heavy weight,", "While you clawed upward, panicked by your fate.", "I was the raft, the anchor, and the shore,", "Giving you everything, and giving more."], ["But when your boots at last had struck the sand,", "You did not turn to offer me a hand.", "You shook the water from your heavy coat,", "And walked away, because you were afloat.", "You never looked behind to see the cost,", "Or mark the water where a man was lost."], ["No grace was given for the life I saved,", "Just silent ripples on an empty grave.", "The current pulled me down into the deep,", "And kept the gratitude you chose to keep.", "I taught your lungs to breathe the open air,", "While mine filled up with what you left me there."]], "text": "I held your chin above the cresting foam,\nAnd traded all my breath to see you home.\nMy shoulders burned beneath the heavy weight,\nWhile you clawed upward, panicked by your fate.\nI was the raft, the anchor, and the shore,\nGiving you everything, and giving more.\nBut when your boots at last had struck the sand,\nYou did not turn to offer me a hand.\nYou shook the water from your heavy coat,\nAnd walked away, because you were afloat.\nYou never looked behind to see the cost,\nOr mark the water where a man was lost.\nNo grace was given for the life I saved,\nJust silent ripples on an empty grave.\nThe current pulled me down into the deep,\nAnd kept the gratitude you chose to keep.\nI taught your lungs to breathe the open air,\nWhile mine filled up with what you left me there.", "sig": true, "cats": ["Grief & Loss", "Honor & Character", "Betrayal"]}, {"n": 2, "part": 1, "title": "Day One", "slug": "day-one", "stanzas": [["The calendar was free. That's how it starts.", "A real estate agency, a stack of neighborhoods,", "April in Wicker Park, all blossoms and no rent,", "tacked to a kitchen wall by someone kind", "who fed the dogs and never asked me why."], ["I found a pen. Not a good pen. A pen.", "The kind that comes in tens and dies in threes.", "I wrote the number on the day and stood", "and looked at it, and it looked back, and neither", "of us blinked. It was a one. It was a <em>one.<\/em>"], ["No candle. No committee. No applause.", "Nobody sang. The dogs did not convene.", "The building didn't buzz. The lake stayed put.", "Chicago, to its credit, did not care,", "which is the nicest thing Chicago does."], ["They tell you one's the loneliest. They're right.", "But one is also one more than the zero", "I'd been carrying around like a receipt", "for something I could not remember buying", "and could not, for the life of me, return."], ["So here's the whole ceremony. Pen. Mark. Down.", "A man, a wall, a free calendar, a dog", "who's on a chair she is not allowed to be on", "and I don't fix it, because who am I", "to lecture Hope about where she belongs."], ["Tomorrow I will do it all again.", "That's the trick. That's the entire trick.", "It doesn't build. It doesn't crescendo.", "It's the same small mark in the same cheap ink,", "and the ink, thank God, is cheap enough to last."]], "text": "The calendar was free. That's how it starts.\nA real estate agency, a stack of neighborhoods,\nApril in Wicker Park, all blossoms and no rent,\ntacked to a kitchen wall by someone kind\nwho fed the dogs and never asked me why.\nI found a pen. Not a good pen. A pen.\nThe kind that comes in tens and dies in threes.\nI wrote the number on the day and stood\nand looked at it, and it looked back, and neither\nof us blinked. It was a one. It was a one.\nNo candle. No committee. No applause.\nNobody sang. The dogs did not convene.\nThe building didn't buzz. The lake stayed put.\nChicago, to its credit, did not care,\nwhich is the nicest thing Chicago does.\nThey tell you one's the loneliest. They're right.\nBut one is also one more than the zero\nI'd been carrying around like a receipt\nfor something I could not remember buying\nand could not, for the life of me, return.\nSo here's the whole ceremony. Pen. Mark. Down.\nA man, a wall, a free calendar, a dog\nwho's on a chair she is not allowed to be on\nand I don't fix it, because who am I\nto lecture Hope about where she belongs.\nTomorrow I will do it all again.\nThat's the trick. That's the entire trick.\nIt doesn't build. It doesn't crescendo.\nIt's the same small mark in the same cheap ink,\nand the ink, thank God, is cheap enough to last.", "sig": true, "cats": ["Addiction & Recovery", "Healing & Endurance"]}, {"n": 3, "part": 1, "title": "Have You Eaten?", "slug": "have-you-eaten", "stanzas": [["Not <em>hello.<\/em> Not <em>hey.<\/em> Never once <em>how are you.<\/em>", "The question came before the phone was warm:", "<em>Have you eaten?<\/em> And I'd lie, because the truth", "was peanut butter, bread, a knife, no plate,", "a meal that only bachelors and raccoons", "would classify as dinner. <em>I'm about to.<\/em>", "<em>About to what.<\/em> <em>Eat.<\/em> <em>Eat what.<\/em> <em>A sandwich.<\/em>", "<em>A sandwich is a cry for help,<\/em> she'd say,", "and I could hear the corners of her mouth", "go round. You can. You can hear a smile.", "I catalogued it. I catalogued everything."], ["The question was a lock she checked each night.", "You don't answer it. You just keep the door shut.", "<em>Move the boxes.<\/em> <em>Tonight.<\/em> <em>Tonight meaning tonight.<\/em>", "<em>Not tonight meaning Saturday.<\/em> <em>Tonight.<\/em>", "And keys, and a door, and the rustle of a woman", "with somewhere to be and a husband to supervise", "in the basic arts of protein and of Christmas."], ["I still stand in kitchens.", "I still hold the knife.", "The bread still sits there like it's owed a plate.", "And every phone I've owned since then has rung", "and not one of them has asked me what I've had."], ["You want to know what loss is? It's not the funeral.", "It's not the flowers or the folded program", "or a room of people saying <em>if you need anything.<\/em>", "It's a jar of Jif at ten o'clock at night", "and nobody on earth to tell you <em>that's not food.<\/em>"], ["I ate the sandwich. Eventually. Years later.", "It had protein. So does dog food. I know.", "I know. I know. I know. I can still hear you."]], "text": "Not hello. Not hey. Never once how are you.\nThe question came before the phone was warm:\nHave you eaten? And I'd lie, because the truth\nwas peanut butter, bread, a knife, no plate,\na meal that only bachelors and raccoons\nwould classify as dinner. I'm about to.\nAbout to what. Eat. Eat what. A sandwich.\nA sandwich is a cry for help, she'd say,\nand I could hear the corners of her mouth\ngo round. You can. You can hear a smile.\nI catalogued it. I catalogued everything.\nThe question was a lock she checked each night.\nYou don't answer it. You just keep the door shut.\nMove the boxes. Tonight. Tonight meaning tonight.\nNot tonight meaning Saturday. Tonight.\nAnd keys, and a door, and the rustle of a woman\nwith somewhere to be and a husband to supervise\nin the basic arts of protein and of Christmas.\nI still stand in kitchens.\nI still hold the knife.\nThe bread still sits there like it's owed a plate.\nAnd every phone I've owned since then has rung\nand not one of them has asked me what I've had.\nYou want to know what loss is? It's not the funeral.\nIt's not the flowers or the folded program\nor a room of people saying if you need anything.\nIt's a jar of Jif at ten o'clock at night\nand nobody on earth to tell you that's not food.\nI ate the sandwich. Eventually. Years later.\nIt had protein. So does dog food. I know.\nI know. I know. I know. I can still hear you.", "sig": true, "cats": ["Grief & Loss"]}, {"n": 4, "part": 1, "title": "The Floor", "slug": "the-floor", "stanzas": [["They said grief is a room. Go in. Sit down.", "Cry on the furniture. Come out when done.", "That's what the pamphlet said, or would have said,", "if I had ever let one in the house."], ["Mine wasn't a room.", "Mine was the floor."], ["Every enterprise I ever built,", "the lemonade, the limos, the degrees,", "the dinners, the careers, the second wife,", "the third wife, the operation, the rescues, the cell,", "the sobriety, the dogs, the plywood counter,", "all of it sat on the same slab of poured cement", "and the cement was a boy at a grave in Indiana", "who had a name that meant one thing", "beside a stone that meant the same thing, feminine."], ["You don't feel a foundation. That's the point.", "You walk on it. You put a couch on it.", "You get a mortgage. You forget it's there.", "And then one day you're sitting with a dog", "and something in your breathing shifts, and the dog", "notices before you do, because the dog", "is calibrated like a seismograph to the tremors", "of the large sad animal it lives with,", "and you look down and think:", "<em>oh. That's what I've been standing on.<\/em>"], ["Every horse with ribs like an architect's sketch.", "Every dog four days from the needle.", "Every family learning what January does.", "Same face. Same face. Same face.", "A debt that isn't a number.", "A debt that is a name."], ["I tried to pay it off in animals.", "Turns out the interest is compounding", "and the bank is a fourteen-year-old boy", "who won't take cash, or horses, or apologies,", "and won't say what he wants, because he's fourteen,", "and because he's me."]], "text": "They said grief is a room. Go in. Sit down.\nCry on the furniture. Come out when done.\nThat's what the pamphlet said, or would have said,\nif I had ever let one in the house.\nMine wasn't a room.\nMine was the floor.\nEvery enterprise I ever built,\nthe lemonade, the limos, the degrees,\nthe dinners, the careers, the second wife,\nthe third wife, the operation, the rescues, the cell,\nthe sobriety, the dogs, the plywood counter,\nall of it sat on the same slab of poured cement\nand the cement was a boy at a grave in Indiana\nwho had a name that meant one thing\nbeside a stone that meant the same thing, feminine.\nYou don't feel a foundation. That's the point.\nYou walk on it. You put a couch on it.\nYou get a mortgage. You forget it's there.\nAnd then one day you're sitting with a dog\nand something in your breathing shifts, and the dog\nnotices before you do, because the dog\nis calibrated like a seismograph to the tremors\nof the large sad animal it lives with,\nand you look down and think:\noh. That's what I've been standing on.\nEvery horse with ribs like an architect's sketch.\nEvery dog four days from the needle.\nEvery family learning what January does.\nSame face. Same face. Same face.\nA debt that isn't a number.\nA debt that is a name.\nI tried to pay it off in animals.\nTurns out the interest is compounding\nand the bank is a fourteen-year-old boy\nwho won't take cash, or horses, or apologies,\nand won't say what he wants, because he's fourteen,\nand because he's me.", "sig": true, "cats": ["Grief & Loss", "Healing & Endurance"]}, {"n": 5, "part": 1, "title": "The Twenty-Mile Rule", "slug": "the-twenty-mile-rule", "stanzas": [["I had a rule. I want you to appreciate", "the elegance of it. Twenty miles. At all times.", "Twenty miles from the product, from the cash,", "from the warehouse and the hands that touched the thing.", "I managed from a distance. I was good at it.", "Distance was the one thing I could build", "faster than a lemonade stand at eight years old."], ["Twenty miles is, in Chicago, forty minutes.", "In Indiana it's one bad decision and a cornfield.", "On the map it's a circle. In the body it's nothing.", "The body doesn't do miles. The body does <em>yes.<\/em>"], ["Here's the joke, and it's a good one, hold on:", "I built a ring around the poison", "and stood in the middle of it", "and called the middle <em>clean.<\/em>", "Twenty miles from the drugs.", "Zero miles from the reason."], ["You can outsource the handling.", "You can delegate the touching.", "You can be so far from the thing", "that no jury could ever place you in the room.", "And then you can go home and be in the room,", "because the room, it turns out, was never in Indiana.", "The room was in the chest.", "The room has always been in the chest."], ["There is no twenty-mile rule for wanting.", "There is no distance that outruns a kitchen at 2 a.m.", "with the lights off and a spreadsheet and a dead wife", "and a set of skills that could solve the problem", "and a problem that could not be solved by skill."], ["So now the rule is different. Here's the new rule:", "Zero miles. Stand in it. Feel the wind come through the walls.", "Don't manage it. Don't franchise it. Don't delegate the feeling", "to a horse, or a dog, or a family out of Aleppo.", "Stand in the middle of the circle you drew", "and admit the circle was a target."], ["Twenty miles was never a safe distance.", "It was just enough room to keep lying."]], "text": "I had a rule. I want you to appreciate\nthe elegance of it. Twenty miles. At all times.\nTwenty miles from the product, from the cash,\nfrom the warehouse and the hands that touched the thing.\nI managed from a distance. I was good at it.\nDistance was the one thing I could build\nfaster than a lemonade stand at eight years old.\nTwenty miles is, in Chicago, forty minutes.\nIn Indiana it's one bad decision and a cornfield.\nOn the map it's a circle. In the body it's nothing.\nThe body doesn't do miles. The body does yes.\nHere's the joke, and it's a good one, hold on:\nI built a ring around the poison\nand stood in the middle of it\nand called the middle clean.\nTwenty miles from the drugs.\nZero miles from the reason.\nYou can outsource the handling.\nYou can delegate the touching.\nYou can be so far from the thing\nthat no jury could ever place you in the room.\nAnd then you can go home and be in the room,\nbecause the room, it turns out, was never in Indiana.\nThe room was in the chest.\nThe room has always been in the chest.\nThere is no twenty-mile rule for wanting.\nThere is no distance that outruns a kitchen at 2 a.m.\nwith the lights off and a spreadsheet and a dead wife\nand a set of skills that could solve the problem\nand a problem that could not be solved by skill.\nSo now the rule is different. Here's the new rule:\nZero miles. Stand in it. Feel the wind come through the walls.\nDon't manage it. Don't franchise it. Don't delegate the feeling\nto a horse, or a dog, or a family out of Aleppo.\nStand in the middle of the circle you drew\nand admit the circle was a target.\nTwenty miles was never a safe distance.\nIt was just enough room to keep lying.", "sig": true, "cats": ["Addiction & Recovery", "Honor & Character"]}, {"n": 6, "part": 1, "title": "They Don't Kill You", "slug": "they-dont-kill-you", "stanzas": [["They tell you drugs will take your life.", "You picture a grave. A young one. A photo", "where you look better than you ever did.", "That's not the deal. I wish it were that clean."], ["They don't kill you. That's the whole grift.", "They leave you standing, breathing, in the room,", "and then they take the room."], ["They take the life you were building. Board by board.", "They take the friends who stood by you, and the ones who feared you,", "and the ones who admired you, and the ones who, God help them,", "bragged about you to the old ladies at the mosque.", "They take the clearance. They take the resume", "that looked like three men's careers shuffled and stapled", "and made HR reach for the phone and put it down", "and reach for it and put it down and pass."], ["They take your name at the bank.", "They take your name at the door.", "They take the seven-foot pole nobody will touch you with", "and hand you the pole and say <em>here, hold this, it's yours now.<\/em>"], ["And they do it politely. That's the part.", "They're not a robber. They're a slow eviction.", "Nothing gets kicked in. Nothing bleeds.", "You just look up one Tuesday and the couch is gone", "and the wife is gone and the brothers don't call", "and your mother still loves you, because mothers do,", "which is the only thing left in the apartment", "and it is not, it turns out, a load-bearing wall."], ["What did they give me? I did the inventory.", "I got laid. Sure. A few times. Fine.", "They did not give me back the phone call.", "They did not give me back the laugh.", "They did not give me a single yard of that last mile.", "They took more than everything else combined", "and they did it while I was thanking them."], ["They don't kill you.", "I'd almost respect them if they did.", "They just take the life", "and let you keep the body", "and call it a favor."]], "text": "They tell you drugs will take your life.\nYou picture a grave. A young one. A photo\nwhere you look better than you ever did.\nThat's not the deal. I wish it were that clean.\nThey don't kill you. That's the whole grift.\nThey leave you standing, breathing, in the room,\nand then they take the room.\nThey take the life you were building. Board by board.\nThey take the friends who stood by you, and the ones who feared you,\nand the ones who admired you, and the ones who, God help them,\nbragged about you to the old ladies at the mosque.\nThey take the clearance. They take the resume\nthat looked like three men's careers shuffled and stapled\nand made HR reach for the phone and put it down\nand reach for it and put it down and pass.\nThey take your name at the bank.\nThey take your name at the door.\nThey take the seven-foot pole nobody will touch you with\nand hand you the pole and say here, hold this, it's yours now.\nAnd they do it politely. That's the part.\nThey're not a robber. They're a slow eviction.\nNothing gets kicked in. Nothing bleeds.\nYou just look up one Tuesday and the couch is gone\nand the wife is gone and the brothers don't call\nand your mother still loves you, because mothers do,\nwhich is the only thing left in the apartment\nand it is not, it turns out, a load-bearing wall.\nWhat did they give me? I did the inventory.\nI got laid. Sure. A few times. Fine.\nThey did not give me back the phone call.\nThey did not give me back the laugh.\nThey did not give me a single yard of that last mile.\nThey took more than everything else combined\nand they did it while I was thanking them.\nThey don't kill you.\nI'd almost respect them if they did.\nThey just take the life\nand let you keep the body\nand call it a favor.", "sig": true, "cats": ["Addiction & Recovery", "Grief & Loss"]}, {"n": 7, "part": 1, "title": "The Strip of Light", "slug": "the-strip-of-light", "stanzas": [["Eight by ten. I measured it. Of course I did.", "You give an engineer a room, he'll pace it,", "because the master's degree does not get confiscated", "along with the belt and the shoelaces and the future."], ["Six items. Bed. Mattress. Shelf. Toilet. Sink. Window.", "A child could catalog it. Several, probably, have.", "The mattress met the definition of a mattress", "the way a puddle meets the definition of a lake."], ["Ninety days. Then six months. Do the math.", "I did the math. The math was the only thing in there", "that didn't have latitude, didn't have a mood,", "didn't review my file and shake its head.", "One hundred eighty days. Four thousand three hundred", "twenty hours. The math was clean. The math was kind.", "The math was the only guard who never lied."], ["And there was the light."], ["A window near the ceiling, narrow as an apology,", "and through it one strip of day, laid across the wall", "at an angle that moved. That was the whole show.", "That was the only thing in the room that moved.", "I watched it like television. I watched it like a wife.", "It came in high and slid down slow and left,", "and I thought: there goes a day I'm not in.", "There goes a whole city being a city without me."], ["You want to know what freedom is worth? Ask a man", "who watched a stripe of sun cross cinderblock", "for a hundred and eighty consecutive matinees", "and never once got tired of the plot."], ["The lock made a sound. Not loud. Precise.", "A bolt in a housing. Metal meeting metal.", "The sound of a system doing what it's for,", "and what it's for was me."], ["Here's the humor, since you asked for humor:", "I'd spent my whole life in motion. Every direction", "anyone would give me, I took. And then they gave me", "a room with no directions in it, and a strip of light", "that went one way, slowly, every day,", "and I finally learned to sit still", "by having it legally required."]], "text": "Eight by ten. I measured it. Of course I did.\nYou give an engineer a room, he'll pace it,\nbecause the master's degree does not get confiscated\nalong with the belt and the shoelaces and the future.\nSix items. Bed. Mattress. Shelf. Toilet. Sink. Window.\nA child could catalog it. Several, probably, have.\nThe mattress met the definition of a mattress\nthe way a puddle meets the definition of a lake.\nNinety days. Then six months. Do the math.\nI did the math. The math was the only thing in there\nthat didn't have latitude, didn't have a mood,\ndidn't review my file and shake its head.\nOne hundred eighty days. Four thousand three hundred\ntwenty hours. The math was clean. The math was kind.\nThe math was the only guard who never lied.\nAnd there was the light.\nA window near the ceiling, narrow as an apology,\nand through it one strip of day, laid across the wall\nat an angle that moved. That was the whole show.\nThat was the only thing in the room that moved.\nI watched it like television. I watched it like a wife.\nIt came in high and slid down slow and left,\nand I thought: there goes a day I'm not in.\nThere goes a whole city being a city without me.\nYou want to know what freedom is worth? Ask a man\nwho watched a stripe of sun cross cinderblock\nfor a hundred and eighty consecutive matinees\nand never once got tired of the plot.\nThe lock made a sound. Not loud. Precise.\nA bolt in a housing. Metal meeting metal.\nThe sound of a system doing what it's for,\nand what it's for was me.\nHere's the humor, since you asked for humor:\nI'd spent my whole life in motion. Every direction\nanyone would give me, I took. And then they gave me\na room with no directions in it, and a strip of light\nthat went one way, slowly, every day,\nand I finally learned to sit still\nby having it legally required.", "sig": true, "cats": ["Confinement & Release", "Rest & Stillness"]}, {"n": 8, "part": 1, "title": "The Door Opens Outward", "slug": "the-door-opens-outward", "stanzas": [["I noticed that. The door of the place", "swings out, away from the building, like the architecture", "itself is telling you: go on. Get out. We're done.", "I went."], ["And the air. God, the air. Same nitrogen.", "Same oxygen. Same parts per million", "of whatever the West Side was cooking that morning.", "But this air <em>moved.<\/em> It had options. It could go left.", "It could rise. It was not pushed through vents", "that smelled like bleach and someone else's despair.", "First unmonitored breath in half a year.", "It was good. Lowercase. Just good."], ["A plastic bag. Inventory: one wallet, expired.", "Forty-three dollars. One phone, dead.", "One photograph, face down, which I did not turn over,", "because a man can only carry so much daylight at a time."], ["I took the bus.", "I'd owned limousines at ten. A Navigator. Military transport.", "The back of a federal vehicle after they caught me.", "Now the CTA, exact change from a Ziploc,", "window seat, diesel and humanity,", "and I didn't mind either, because neither was floor wax."], ["The elevator took its time. So did I.", "That was new. Nowhere to be.", "For thirty years there had been somewhere. Always somewhere.", "A dome, a desert, a studio, a courtroom, a cell.", "Now: an elevator. A hallway. A door. A key I hoped still worked."], ["It worked."], ["And then the sound. Before the sight, the sound.", "Four sets of nails on hardwood. Ninety pounds of joy", "at a velocity that shepherds should not achieve indoors.", "I went down on one knee, because you can't take that standing,", "not after six months on a metal bed.", "A slam. A lean. A sentry taking my left leg.", "And fifteen pounds of white fur planting herself", "on my feet. Not beside them. <em>On<\/em> them. Claimed."], ["I sat on the floor. They arranged themselves", "like they'd rehearsed it. Maybe they had.", "The place smelled like dog. The floor was where", "everyone needed to be. I stayed a long time."], ["The door opens outward.", "I've been through a lot of doors.", "That's the only one I ever noticed."]], "text": "I noticed that. The door of the place\nswings out, away from the building, like the architecture\nitself is telling you: go on. Get out. We're done.\nI went.\nAnd the air. God, the air. Same nitrogen.\nSame oxygen. Same parts per million\nof whatever the West Side was cooking that morning.\nBut this air moved. It had options. It could go left.\nIt could rise. It was not pushed through vents\nthat smelled like bleach and someone else's despair.\nFirst unmonitored breath in half a year.\nIt was good. Lowercase. Just good.\nA plastic bag. Inventory: one wallet, expired.\nForty-three dollars. One phone, dead.\nOne photograph, face down, which I did not turn over,\nbecause a man can only carry so much daylight at a time.\nI took the bus.\nI'd owned limousines at ten. A Navigator. Military transport.\nThe back of a federal vehicle after they caught me.\nNow the CTA, exact change from a Ziploc,\nwindow seat, diesel and humanity,\nand I didn't mind either, because neither was floor wax.\nThe elevator took its time. So did I.\nThat was new. Nowhere to be.\nFor thirty years there had been somewhere. Always somewhere.\nA dome, a desert, a studio, a courtroom, a cell.\nNow: an elevator. A hallway. A door. A key I hoped still worked.\nIt worked.\nAnd then the sound. Before the sight, the sound.\nFour sets of nails on hardwood. Ninety pounds of joy\nat a velocity that shepherds should not achieve indoors.\nI went down on one knee, because you can't take that standing,\nnot after six months on a metal bed.\nA slam. A lean. A sentry taking my left leg.\nAnd fifteen pounds of white fur planting herself\non my feet. Not beside them. On them. Claimed.\nI sat on the floor. They arranged themselves\nlike they'd rehearsed it. Maybe they had.\nThe place smelled like dog. The floor was where\neveryone needed to be. I stayed a long time.\nThe door opens outward.\nI've been through a lot of doors.\nThat's the only one I ever noticed.", "sig": true, "cats": ["Confinement & Release", "Worth & Belonging"]}, {"n": 9, "part": 1, "title": "Four Leashes", "slug": "four-leashes", "stanzas": [["Six-thirty. A bark. Not a request. A notification.", "Six-thirty-two: feet on floor.", "Six-thirty-five: coffee, black, since the military,", "where additions were inefficiency and so was feeling.", "Six-forty: four bowls, four styles.", "Deliberate. Frantic. Efficient. Eccentric.", "Seven o'clock: the leashes."], ["Four dogs. One elevator. One lobby. One sidewalk.", "The tamale guy, who was there before I went away", "and will be there after I'm gone, because tamale guys", "run on a clock that does not consult your narrative."], ["And the wind. Let's discuss the wind.", "Chicago wind is not weather. It's a municipal employee", "who's held the job a thousand years and will not", "be persuaded by your jacket to take the day off.", "You lean into it. The dogs lean into it.", "Everybody on the sidewalk is leaning into something."], ["One walks at heel like a West Pointer.", "One pulls, always, and is losing, and does not mind.", "One takes my left leg as her assignment, permanent.", "And one, the small one, the acronym,", "has found a wrapper near a hydrant that requires", "her full fifteen pounds of immediate investigation."], ["Four leashes. Four directions. Me in the middle.", "This is not a metaphor. I want that on the record.", "This is a man and some dogs and a fire hydrant.", "And also, fine, it's a metaphor."], ["Because here's what nobody tells you about standing:", "it isn't stillness. It's four things pulling", "and you not going with any of them.", "It's holding what you've got at the speed of patience", "while the wind does its job and the L does its job", "and the day does whatever the day has planned."], ["Some mornings the bed is the only thing that makes sense", "and the dogs are the only reason it doesn't win.", "But the dogs are a good reason.", "The dogs are a very good reason."], ["I named the small one Hope. All caps. With periods.", "Hold On, Pain Ends. A prayer disguised as an acronym", "disguised as a dog, because some things are too heavy", "to say to a person, and a dog will carry anything", "you hand her and never once ask why."], ["She's on my feet again.", "Claimed."]], "text": "Six-thirty. A bark. Not a request. A notification.\nSix-thirty-two: feet on floor.\nSix-thirty-five: coffee, black, since the military,\nwhere additions were inefficiency and so was feeling.\nSix-forty: four bowls, four styles.\nDeliberate. Frantic. Efficient. Eccentric.\nSeven o'clock: the leashes.\nFour dogs. One elevator. One lobby. One sidewalk.\nThe tamale guy, who was there before I went away\nand will be there after I'm gone, because tamale guys\nrun on a clock that does not consult your narrative.\nAnd the wind. Let's discuss the wind.\nChicago wind is not weather. It's a municipal employee\nwho's held the job a thousand years and will not\nbe persuaded by your jacket to take the day off.\nYou lean into it. The dogs lean into it.\nEverybody on the sidewalk is leaning into something.\nOne walks at heel like a West Pointer.\nOne pulls, always, and is losing, and does not mind.\nOne takes my left leg as her assignment, permanent.\nAnd one, the small one, the acronym,\nhas found a wrapper near a hydrant that requires\nher full fifteen pounds of immediate investigation.\nFour leashes. Four directions. Me in the middle.\nThis is not a metaphor. I want that on the record.\nThis is a man and some dogs and a fire hydrant.\nAnd also, fine, it's a metaphor.\nBecause here's what nobody tells you about standing:\nit isn't stillness. It's four things pulling\nand you not going with any of them.\nIt's holding what you've got at the speed of patience\nwhile the wind does its job and the L does its job\nand the day does whatever the day has planned.\nSome mornings the bed is the only thing that makes sense\nand the dogs are the only reason it doesn't win.\nBut the dogs are a good reason.\nThe dogs are a very good reason.\nI named the small one Hope. All caps. With periods.\nHold On, Pain Ends. A prayer disguised as an acronym\ndisguised as a dog, because some things are too heavy\nto say to a person, and a dog will carry anything\nyou hand her and never once ask why.\nShe's on my feet again.\nClaimed.", "sig": true, "cats": ["Addiction & Recovery", "Fortitude & Gentleness"]}, {"n": 10, "part": 1, "title": "Good, Not Perfect", "slug": "good-not-perfect", "stanzas": [["I wanted it. Forty-four years I wanted it.", "The perfect grades. The perfect trajectory.", "The perfect rescue. The perfect crime, and I mean that,", "I built it like a franchise and it was <em>beautiful<\/em>", "right up until the wire. And then, of course,", "the perfect sobriety. Each day flawless.", "Each mark on the calendar an A-plus", "in the introductory course of Being Alive."], ["I wanted the universe to run on merit.", "On fairness. On the syllabus. I did the reading.", "And the universe handed back a dead sister,", "a sabotaged dream, two wives in the ground,", "a cell, a gutted condo, a charge I didn't earn,", "an insurance company with a form letter,", "and a system that called itself civilization", "and ran like a franchise for extracting hope", "from whoever needed it most."], ["So I read Genesis. In a cell. Between Clancy and Patterson.", "Not for God. For something to do with my eyes.", "And I counted. The Maker looks at the light: <em>good.<\/em>", "The sky: <em>good.<\/em> The water, the land, the crawling things:", "<em>good, good, good.<\/em> Seven times. Never once <em>perfect.<\/em>", "Never once <em>exactly as I drew it up.<\/em>", "Just: made. Mine. Enough for today. Next."], ["You understand what that did to me?", "The Creator of the universe looked at the whole", "messy sprawling unfinished project", "and gave it a B and went to bed."], ["Now I have a bucket under a drip.", "The drip is fixed. I paid a plumber. The bucket stays,", "because fixes are provisional and buckets are insurance", "and a man who's been fixed before knows the difference.", "The counter is plywood. The couch has a dip", "from a man and four dogs and however many nights.", "The dip is comfortable. The dip is ours.", "The photograph is from Walgreens. It's fine. It's good."], ["I'm not enough. I'm not trying to be enough.", "I'm present. Accounted for. Still on the roster.", "Still answering when the name gets called.", "Life is not perfect. It never signed for that.", "But as a sister taught me, and a dog keeps teaching me,", "it does, at minimum, need to be good."], ["Good. Lowercase. Seven times.", "Then go feed the dogs."]], "text": "I wanted it. Forty-four years I wanted it.\nThe perfect grades. The perfect trajectory.\nThe perfect rescue. The perfect crime, and I mean that,\nI built it like a franchise and it was beautiful\nright up until the wire. And then, of course,\nthe perfect sobriety. Each day flawless.\nEach mark on the calendar an A-plus\nin the introductory course of Being Alive.\nI wanted the universe to run on merit.\nOn fairness. On the syllabus. I did the reading.\nAnd the universe handed back a dead sister,\na sabotaged dream, two wives in the ground,\na cell, a gutted condo, a charge I didn't earn,\nan insurance company with a form letter,\nand a system that called itself civilization\nand ran like a franchise for extracting hope\nfrom whoever needed it most.\nSo I read Genesis. In a cell. Between Clancy and Patterson.\nNot for God. For something to do with my eyes.\nAnd I counted. The Maker looks at the light: good.\nThe sky: good. The water, the land, the crawling things:\ngood, good, good. Seven times. Never once perfect.\nNever once exactly as I drew it up.\nJust: made. Mine. Enough for today. Next.\nYou understand what that did to me?\nThe Creator of the universe looked at the whole\nmessy sprawling unfinished project\nand gave it a B and went to bed.\nNow I have a bucket under a drip.\nThe drip is fixed. I paid a plumber. The bucket stays,\nbecause fixes are provisional and buckets are insurance\nand a man who's been fixed before knows the difference.\nThe counter is plywood. The couch has a dip\nfrom a man and four dogs and however many nights.\nThe dip is comfortable. The dip is ours.\nThe photograph is from Walgreens. It's fine. It's good.\nI'm not enough. I'm not trying to be enough.\nI'm present. Accounted for. Still on the roster.\nStill answering when the name gets called.\nLife is not perfect. It never signed for that.\nBut as a sister taught me, and a dog keeps teaching me,\nit does, at minimum, need to be good.\nGood. Lowercase. Seven times.\nThen go feed the dogs.", "sig": true, "cats": ["Addiction & Recovery", "Grace & Self-Forgiveness", "Faith & Reverence"]}, {"n": 11, "part": 1, "title": "Pilot Light", "slug": "pilot-light", "stanzas": [["My mother said a pessimist is just an optimist", "who got hit enough times to learn to flinch.", "That's me. That's exactly me. I'd like it on a shirt.", "An optimist who kept getting punched in the plan", "until the optimism ducked on its own."], ["But it's still in there.", "That's the part they don't put on the shirt."], ["You know a pilot light? Down in the stove,", "that little blue nothing that nobody looks at,", "burning at three in the morning with no pot on,", "burning through the funeral and the eviction", "and the six months and the drip and the frame,", "not because anyone asked it to, but because", "that is what a pilot light does. It stays lit.", "It waits for someone to turn the knob."], ["I asked my lawyer if he was optimistic.", "He said: <em>I am experiencing the absence of pessimism,<\/em>", "<em>which in this practice is as close as I get.<\/em>", "I'll take it. I'll
